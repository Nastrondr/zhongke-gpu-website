<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 - 个人数字大脑</title>
  <script>
    // 在页面渲染前应用主题，防止闪烁
    (function() {
      const savedTheme = localStorage.getItem('app_theme_mode');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme === 'system' ? (systemDark ? 'dark' : 'light') : (savedTheme || 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/theme-variables.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root,
    html[data-theme="dark"] {
      --bg-primary: linear-gradient(180deg, #0A0F1C 0%, #10182A 50%, #0A0F1C 100%);
      --bg-secondary: #10182A;
      --card-bg: #111C31;
      --card-hover: #16233D;
      --border-primary: rgba(96, 165, 250, 0.28);
      --border-secondary: rgba(148, 163, 184, 0.16);
      --divider: rgba(148, 163, 184, 0.10);
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-tertiary: #94A3B8;
      --text-muted: #64748B;
      --brand-primary: #60A5FA;
      --brand-secondary: #3B82F6;
      --accent-cyan: #22C7D6;
      --success: #22C55E;
      --warning: #F59E0B;
      --error: #EF4444;
      --info: #38BDF8;
      --chart-grid: rgba(148, 163, 184, 0.10);
      --tooltip-bg: #16233D;
      --tooltip-title: #F8FAFC;
      --tooltip-body: #CBD5E1;
    }

    html[data-theme="light"] {
      --bg-primary: linear-gradient(180deg, #F6F9FC 0%, #F3F7FB 50%, #F6F9FC 100%);
      --bg-secondary: #EEF4FA;
      --card-bg: #FFFFFF;
      --card-bg-soft: #FBFDFF;
      --card-highlight: linear-gradient(135deg, #F4F8FF 0%, #EAF2FF 100%);
      --bg-card: #FFFFFF;
      --bg-card-hover: #FBFDFF;
      --card-hover: #FBFDFF;
      --border-card: #D7E6FF;
      --border-primary: #D7E6FF;
      --border-secondary: rgba(140, 170, 220, 0.18);
      --border-accent: #BFD7FF;
      --divider: rgba(140, 170, 220, 0.12);
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-tertiary: #7C8CA5;
      --text-muted: #94A3B8;
      --brand-primary: #4A8DFF;
      --brand-secondary: #6BA8FF;
      --brand-soft: #EAF3FF;
      --accent-cyan: #0891B2;
      --success: #1BD4A0;
      --success-bg: rgba(27, 212, 160, 0.15);
      --warning: #D97706;
      --warning-bg: #FFF5E8;
      --error: #DC2626;
      --error-bg: #FDECEC;
      --info: #0284C7;
      --info-bg: #E0F2FE;
      --chart-grid: rgba(140, 170, 220, 0.08);
      --tooltip-bg: #FFFFFF;
      --tooltip-title: #0F172A;
      --tooltip-body: #475569;
      --shadow-card: 0 8px 24px rgba(67, 97, 168, 0.06);
      --shadow-card-hover: 0 12px 32px rgba(67, 97, 168, 0.10);
      --shadow-soft: 0 2px 10px rgba(67, 97, 168, 0.05);
    }

    html[data-theme="light"] .brand-title {
      background: linear-gradient(135deg, #2563EB 0%, #60A5FA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    html[data-theme="light"] .card,
    html[data-theme="light"] .app-card,
    html[data-theme="light"] .wallet-card,
    html[data-theme="light"] .device-card,
    html[data-theme="light"] .service-item,
    html[data-theme="light"] .task-item,
    html[data-theme="light"] .timeline-row,
    html[data-theme="light"] .app-item,
    html[data-theme="light"] .capability-item,
    html[data-theme="light"] .stat-card,
    html[data-theme="light"] .skill-card,
    html[data-theme="light"] .record-item,
    html[data-theme="light"] .data-source-item,
    html[data-theme="light"] .section,
    html[data-theme="light"] .timeline-mini {
      box-shadow: var(--shadow-card);
      background: var(--card-bg);
      border: 1px solid var(--border-card);
    }

    html[data-theme="light"] .card:hover,
    html[data-theme="light"] .app-card:hover,
    html[data-theme="light"] .wallet-card:hover,
    html[data-theme="light"] .device-card:hover,
    html[data-theme="light"] .service-item:hover,
    html[data-theme="light"] .task-item:hover,
    html[data-theme="light"] .app-item:hover,
    html[data-theme="light"] .capability-item:hover,
    html[data-theme="light"] .skill-card:hover,
    html[data-theme="light"] .section:hover {
      box-shadow: var(--shadow-card-hover);
    }

    html[data-theme="dark"] .card,
    html[data-theme="dark"] .app-card,
    html[data-theme="dark"] .wallet-card,
    html[data-theme="dark"] .device-card,
    html[data-theme="dark"] .service-item,
    html[data-theme="dark"] .task-item,
    html[data-theme="dark"] .timeline-row,
    html[data-theme="dark"] .app-item,
    html[data-theme="dark"] .capability-item,
    html[data-theme="dark"] .stat-card,
    html[data-theme="dark"] .skill-card,
    html[data-theme="dark"] .record-item,
    html[data-theme="dark"] .data-source-item,
    html[data-theme="dark"] .section,
    html[data-theme="dark"] .timeline-mini {
      box-shadow: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* 手机容器 */
    .app-container {
      max-width: 430px;
      min-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 状态栏 */
    .status-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .status-bar .time {
      color: var(--text-primary);
    }

    .status-bar .icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* 主内容区 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 24px 40px;
    }

    /* 品牌欢迎区 */
    .brand-section {
      text-align: center;
      padding: 40px 0 48px;
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(37, 99, 235, 0.4);
    }

    .brand-logo svg {
      width: 36px;
      height: 36px;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .brand-welcome {
      font-size: 14px;
      color: var(--text-tertiary);
      line-height: 1.6;
      max-width: 280px;
      margin: 0 auto;
    }

    /* 登录表单卡片 */
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 28px 24px;
      backdrop-filter: blur(10px);
    }

    .login-card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
    }

    /* 表单组 */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 16px;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input::placeholder {
      color: var(--text-tertiary);
    }

    .form-input:focus {
      border-color: var(--border-input-focus);
      box-shadow: 0 0 0 3px var(--accent-blue-glow);
    }

    .form-input.error {
      border-color: var(--error);
    }

    /* 密码输入框 */
    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-tertiary);
      transition: color 0.2s ease;
    }

    .password-toggle:hover {
      color: var(--text-secondary);
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
    }

    .form-input.has-toggle {
      padding-right: 56px;
    }

    /* 记住登录状态 */
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-blue);
      cursor: pointer;
    }

    .checkbox-wrapper span {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* 登录按钮 */
    .login-btn {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* 提示信息区 */
    .message-area {
      min-height: 24px;
      margin-top: 16px;
      text-align: center;
    }

    .message {
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      display: inline-block;
      animation: fadeIn 0.3s ease;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .message.success {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    html[data-theme="light"] .message.success {
      background: #dcfce7;
      color: #16a34a;
      border: 1px solid #86efac;
    }

    html[data-theme="light"] .message.error {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 底部辅助区 */
    .footer-section {
      padding: 24px;
      text-align: center;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 16px;
    }

    .footer-link {
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--accent-blue-light);
    }

    .footer-hint {
      font-size: 12px;
      color: var(--text-tertiary);
      line-height: 1.5;
    }

    .version-info {
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* 交付弹窗 */
    .delivery-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .delivery-modal.active {
      display: flex;
    }

    .delivery-content {
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%);
      border: 1px solid rgba(37, 99, 235, 0.5);
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 360px;
      width: 100%;
      animation: modalSlideIn 0.3s ease;
    }

    @keyframes modalSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .delivery-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .delivery-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 32px rgba(37, 99, 235, 0.4);
    }

    .delivery-icon svg {
      width: 32px;
      height: 32px;
      color: white;
    }

    .delivery-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .delivery-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
      text-align: center;
    }

    .delivery-info {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .info-item {
      margin-bottom: 12px;
    }

    .info-item:last-child {
      margin-bottom: 0;
    }

    .info-label {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .info-value.agent-name {
      color: #60a5fa;
    }

    .device-link-box {
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 11px;
      color: var(--text-secondary);
      word-break: break-all;
      line-height: 1.5;
      font-family: 'SF Mono', Monaco, monospace;
    }

    .delivery-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-delivery {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-delivery-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
    }

    .btn-delivery-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-delivery-secondary {
      background: rgba(37, 99, 235, 0.2);
      color: var(--accent-blue-light);
      border: 1px solid rgba(37, 99, 235, 0.4);
    }

    .btn-delivery-secondary:hover {
      background: rgba(37, 99, 235, 0.3);
    }

    .btn-delivery-text {
      background: transparent;
      color: var(--text-tertiary);
      font-size: 13px;
      font-weight: 500;
    }

    .btn-delivery-text:hover {
      color: var(--text-secondary);
    }

    /* Toast 提示 */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(16, 185, 129, 0.95);
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .toast.active {
      opacity: 1;
    }
  </style>

<body>
  <div class="app-container">
    <!-- 主内容 -->
    <div class="main-content">
      <!-- 品牌欢迎区 -->
      <div class="brand-section">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </div>
        <h1 class="brand-title">萤火虫-个人数字大脑</h1>
        <p class="brand-welcome">欢迎登录，继续查看设备、词元与智能服务</p>
      </div>

      <!-- 登录表单卡片 -->
      <div class="login-card">
        <h2 class="login-card-title">手机号登录</h2>

        <form id="loginForm">
          <!-- 手机号输入 -->
          <div class="form-group">
            <label class="form-label">手机号</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="username"
                class="form-input"
                placeholder="请输入手机号"
                autocomplete="username"
              >
            </div>
          </div>

          <!-- 密码输入 -->
          <div class="form-group">
            <label class="form-label">密码</label>
            <div class="input-wrapper password-wrapper">
              <input
                type="password"
                id="password"
                class="form-input has-toggle"
                placeholder="请输入密码"
                autocomplete="current-password"
              >
              <button type="button" class="password-toggle" id="togglePassword" aria-label="显示密码">
                <!-- 眼睛图标 - 隐藏状态 -->
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- 眼睛关闭图标 - 显示状态 -->
                <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- 记住登录状态 -->
          <div class="remember-row">
            <label class="checkbox-wrapper">
              <input type="checkbox" id="rememberMe">
              <span>记住登录状态</span>
            </label>
          </div>

          <!-- 登录按钮 -->
          <button type="submit" class="login-btn" id="loginBtn">登录</button>

          <!-- 提示信息区 -->
          <div class="message-area" id="messageArea"></div>
        </form>
      </div>
    </div>

    <!-- 底部辅助区 -->
    <div class="footer-section">
      <div class="footer-links">
        <a href="javascript:void(0);" class="footer-link">忘记密码</a>
        <a href="javascript:void(0);" class="footer-link">联系支持</a>
      </div>
      <p class="footer-hint">如需正式账号，请联系平台管理员</p>
      <p class="version-info">版本 1.0.0 | 安全加密传输</p>
    </div>
  </div>

  <!-- 智能体交付弹窗 -->
  <div class="delivery-modal" id="deliveryModal">
    <div class="delivery-content">
      <div class="delivery-header">
        <div class="delivery-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <h3 class="delivery-title" id="deliveryTitle">萤火虫 已交付</h3>
      </div>

      <p class="delivery-desc">
        当前账号已匹配专属智能体设备链接，请先复制链接并完成设备绑定。绑定后可在个人中心持续查看与管理。
      </p>

      <div class="delivery-info">
        <div class="info-item">
          <div class="info-label">智能体名称</div>
          <div class="info-value agent-name" id="agentName">萤火虫智能体 A</div>
        </div>
        <div class="info-item">
          <div class="info-label">专属设备链接</div>
          <div class="device-link-box" id="deviceLink">http://30103215.nat123.top:41696/?token=29a71586190952b0b107c63121d9fc112348b031f18565c0</div>
        </div>
      </div>

      <div class="delivery-actions">
        <button class="btn-delivery btn-delivery-secondary" id="copyLinkBtn">复制链接</button>
        <button class="btn-delivery btn-delivery-primary" id="bindNowBtn">立即去绑定</button>
        <button class="btn-delivery btn-delivery-text" id="bindLaterBtn">稍后处理</button>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast">已复制链接</div>

  <script>
    // DOM 元素
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');
    const loginBtn = document.getElementById('loginBtn');
    const messageArea = document.getElementById('messageArea');
    const clock = document.getElementById('clock') || null;

    // 弹窗相关元素
    const deliveryModal = document.getElementById('deliveryModal');
    const deliveryTitle = document.getElementById('deliveryTitle');
    const agentNameEl = document.getElementById('agentName');
    const deviceLinkEl = document.getElementById('deviceLink');
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    const bindNowBtn = document.getElementById('bindNowBtn');
    const bindLaterBtn = document.getElementById('bindLaterBtn');
    const toast = document.getElementById('toast');

    // 当前登录账号信息
    let currentAccount = null;

    // 更新时间
    function updateClock() {
      if (clock) {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        clock.textContent = `${hours}:${minutes}`;
      }
    }
    if (clock) {
      updateClock();
      setInterval(updateClock, 60000);
    }

    // 密码显示/隐藏切换
    let isPasswordVisible = false;
    togglePasswordBtn.addEventListener('click', function() {
      isPasswordVisible = !isPasswordVisible;
      passwordInput.type = isPasswordVisible ? 'text' : 'password';
      eyeIcon.style.display = isPasswordVisible ? 'none' : 'block';
      eyeOffIcon.style.display = isPasswordVisible ? 'block' : 'none';
    });

    // 显示提示信息
    function showMessage(text, type) {
      messageArea.innerHTML = `<div class="message ${type}">${text}</div>`;
    }

    // 清除提示
    function clearMessage() {
      messageArea.innerHTML = '';
      usernameInput.classList.remove('error');
      passwordInput.classList.remove('error');
    }

    // 登录验证
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      clearMessage();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      // 验证输入
      if (!username) {
        showMessage('请输入手机号', 'error');
        usernameInput.classList.add('error');
        return;
      }

      if (!password) {
        showMessage('请输入密码', 'error');
        passwordInput.classList.add('error');
        return;
      }

      // ===== DEV ONLY: 临时开发测试账号 =====
      // TEMP DEBUG LOGIN - 方便调试页面和状态流转
      // 后续可整块删除，不影响正式登录
      if (username === 'adminA' && password === 'A123456') {
        loginBtn.disabled = true;
        loginBtn.textContent = '登录中...';

        const devToken = 'dev-adminA-token';
        const devUser = {
          userId: 'dev-user-adminA',
          account: 'adminA',
          username: 'adminA',
          mobile: '',
          email: '',
          bindStatus: 'none'
        };

        Storage.Auth.setToken(devToken);
        Storage.Auth.setLoggedIn(true, !rememberMe);
        Storage.Auth.setUser(devUser);
        Storage.Auth.setAccountData({
          username: 'adminA',
          password: 'A123456',
          agentName: '萤火虫-个人数字大脑',
          deviceLink: '',
          bindStatus: 'none'
        });

        console.log('[DEV ONLY] temp login success, data written to Storage.Auth');
        showMessage('登录成功（开发模式）', 'success');

        setTimeout(() => {
          Navigation.goTo('home.html');
        }, 500);
        return;
      }
      // ===== DEV ONLY END =====

      // 禁用按钮
      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      // 调用真实登录接口
      (async () => {
        try {
          const result = await UserService.login({ username, password }, rememberMe);

          if (result.success) {
            // 登录成功
            showMessage('登录成功', 'success');

            // 延迟后跳转到首页
            setTimeout(() => {
              Navigation.goTo('home.html');
            }, 500);
          } else {
            // 登录失败
            showMessage(result.message || '手机号或密码错误', 'error');
            passwordInput.classList.add('error');
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
          }
        } catch (error) {
          // 网络错误
          showMessage('网络错误，请稍后重试', 'error');
          loginBtn.disabled = false;
          loginBtn.textContent = '登录';
        }
      })();
    });

    // 输入时清除错误状态
    usernameInput.addEventListener('input', function() {
      this.classList.remove('error');
    });

    passwordInput.addEventListener('input', function() {
      this.classList.remove('error');
    });

    // 显示交付弹窗
    function showDeliveryModal(account) {
      deliveryTitle.textContent = `${account.agentName} 已交付`;
      agentNameEl.textContent = account.agentName;
      deviceLinkEl.textContent = account.deviceLink;
      deliveryModal.classList.add('active');
    }

    // 隐藏交付弹窗
    function hideDeliveryModal() {
      deliveryModal.classList.remove('active');
    }

    // 显示 Toast 提示
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('active');
      setTimeout(() => {
        toast.classList.remove('active');
      }, 2000);
    }

    // 复制链接
    copyLinkBtn.addEventListener('click', function() {
      const link = deviceLinkEl.textContent;
      navigator.clipboard.writeText(link).then(() => {
        showToast('已复制链接');
      }).catch(() => {
        // 降级方案
        const textArea = document.createElement('textarea');
        textArea.value = link;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        showToast('已复制链接');
      });
    });

    // 立即去绑定
    bindNowBtn.addEventListener('click', function() {
      hideDeliveryModal();
      window.location.href = 'account-binding.html';
    });

    // 稍后处理
    bindLaterBtn.addEventListener('click', function() {
      hideDeliveryModal();
      window.location.href = 'home.html?tab=profile';
    });

    // 检查是否已登录
    const savedUser = (window.Storage && Storage.get) ? Storage.get('auth_login_user') : localStorage.getItem('auth_login_user');
    if (savedUser) {
      usernameInput.value = savedUser;
      document.getElementById('rememberMe').checked = true;
    }

    // 页面加载时检查登录状态 - 已登录用户直接跳转
    document.addEventListener('DOMContentLoaded', function() {
      // 检查是否有从其他页面跳转时保存的错误信息
      const savedError = sessionStorage.getItem('auth_error');
      if (savedError) {
        try {
          const errorData = JSON.parse(savedError);
          // 只显示5分钟内的错误信息
          if (Date.now() - errorData.timestamp < 5 * 60 * 1000) {
            showMessage(errorData.message, 'error');
          }
        } catch (e) {
          console.warn('[Auth] 解析保存的错误信息失败:', e);
        }
        sessionStorage.removeItem('auth_error');
      }

      const isLoggedIn = Storage.Auth.isLoggedIn();

      if (isLoggedIn) {
        const accountData = Storage.Auth.getAccountData();

        if (accountData) {
          if (accountData.bindStatus === 'bound') {
            Navigation.goTo('home.html');
            return;
          }

          if (accountData.bindStatus === 'pending' && accountData.deviceLink) {
            showDeliveryModal(accountData);
            return;
          }
        }

        Navigation.goTo('home.html');
      }
    });

    // 初始化主题
    ThemeManager.init();
  </script>
</body>
</html>
