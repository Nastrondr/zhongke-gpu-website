<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小龙虾设备对话</title>
  <link rel="icon" type="image/png" href="./apple-touch-icon2.png">
  <link rel="shortcut icon" type="image/png" href="./apple-touch-icon2.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon2.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon2.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="数字大脑">
  <meta name="application-name" content="数字大脑">
  <link rel="stylesheet" href="css/theme-variables.css">
  <style>
    /* 薄层兼容映射 - 使用全局变量并保留聊天特有颜色 */
    :root {
      /* 聊天气泡颜色 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #334155;
      --border-card: var(--border-primary);
    }
    html[data-theme="light"] {
      /* 聊天气泡 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #EEF2F7;
      --border-card: var(--border-primary);
      /* 保留功能色 */
      --accent-green: var(--success);
    }
    html[data-theme="dark"] {
      /* 聊天气泡 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #1E293B;
      --border-card: var(--border-primary);
      /* 保留功能色 */
      --accent-green: var(--success);
    }
    
    /* 深色模式覆盖 */
    html[data-theme="dark"] body {
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    html[data-theme="dark"] .header {
      background: #111827;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .header-title {
      color: #F8FAFC;
    }
    html[data-theme="dark"] .header-back {
      color: #CBD5E1;
    }
    html[data-theme="dark"] .device-info {
      background: #141E2F;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .device-name {
      color: #F8FAFC;
      font-weight: 700;
    }
    html[data-theme="dark"] .device-uuid {
      color: #94A3B8;
    }
    html[data-theme="dark"] .device-status {
      color: #94A3B8;
    }
    html[data-theme="dark"] .status-dot.online {
      background: #10B981;
    }
    html[data-theme="dark"] .status-dot.offline {
      background: #64748B;
    }
    html[data-theme="dark"] .header-status {
      background: rgba(16, 185, 129, 0.16);
      color: #34D399;
    }
    html[data-theme="dark"] .device-reconnect-btn {
      background: rgba(59, 130, 246, 0.10);
      border: 1px solid rgba(96, 165, 250, 0.16);
      color: #60A5FA;
    }
    html[data-theme="dark"] .quick-cmd {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.14);
      color: #CBD5E1;
    }
    html[data-theme="dark"] .quick-cmd svg {
      stroke: #94A3B8;
    }
    html[data-theme="dark"] .quick-cmd[style*="color: var(--success)"] { 
      background: rgba(16, 185, 129, 0.10);
      border: 1px solid rgba(16, 185, 129, 0.18);
      color: #34D399;
    }
    html[data-theme="dark"] .quick-cmd[style*="color: var(--success)"] svg {
      stroke: #34D399;
    }
    html[data-theme="dark"] .welcome-bubble {
      background: #1E293B;
      border: 1px solid rgba(148, 163, 184, 0.10);
      color: #F8FAFC;
    }
    html[data-theme="dark"] .chat-message.assistant {
      background: #1E293B;
      border: 1px solid rgba(148, 163, 184, 0.10);
      color: #F8FAFC;
    }
    html[data-theme="dark"] .chat-message.user {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: #FFFFFF;
    }
    html[data-theme="dark"] .input-area {
      background: #111827;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .chat-input {
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .chat-input::placeholder {
      color: #64748B;
    }
    html[data-theme="dark"] .chat-input:focus {
      border-color: rgba(59, 130, 246, 0.4);
    }
    html[data-theme="dark"] .send-btn {
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }
    html[data-theme="dark"] .send-btn svg {
      stroke: #FFFFFF !important;
    }
    html[data-theme="dark"] .device-avatar {
      background: rgba(59, 130, 246, 0.16);
    }
    html[data-theme="dark"] .device-avatar svg {
      stroke: #60A5FA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    .header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-card);
    }
    .header-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 14px;
    }
    .header-back svg { width: 20px; height: 20px; }
    .header-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
    }

    .header-status {
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
    }
    .header-status.offline { background: rgba(100, 116, 139, 0.12); color: #64748B; }
    .header-status.error { background: rgba(239, 68, 68, 0.12); color: #DC2626; }

    .header-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      color: var(--text-secondary);
      transition: all 0.2s;
    }

    .header-action:hover {
      background: rgba(96, 165, 250, 0.15);
      color: var(--brand-primary);
    }

    .header-action svg {
      width: 18px;
      height: 18px;
    }

    /* 设备信息 */
    .device-info {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: #FFFFFF;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }
    .device-avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
    }
    .device-detail { flex: 1; }
    .device-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .device-status {
      font-size: 13px;
      color: #64748B;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.online { background: #10B981; }
    .status-dot.offline { background: #94A3B8; }
    
    .device-reconnect-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.08);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .device-reconnect-btn:hover {
      background: rgba(59, 130, 246, 0.15);
    }
    .device-reconnect-btn:active {
      transform: scale(0.95);
    }
    .device-reconnect-btn svg {
      stroke: #3B82F6;
    }

    /* 聊天区域 */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .chat-message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }
    .chat-message.assistant {
      align-self: flex-start;
      background: #EEF2F7;
      color: #1E293B;
      border-bottom-left-radius: 4px;
    }
    .chat-message.loading {
      color: var(--text-secondary);
      font-style: italic;
    }
    .chat-message.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }

    .chat-message .message-content {
      line-height: 1.6;
    }

    .chat-message.loading {
      opacity: 0.7;
    }

    .chat-message.streaming::after {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 8px;
      border-radius: 50%;
      background: var(--accent-blue);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .bubble-status {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      font-style: italic;
    }

    .chat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      margin: 8px 0;
      overflow: hidden;
    }

    .chat-card .card-header {
      background: var(--bg-secondary);
      padding: 8px 12px;
      font-weight: 600;
      font-size: 13px;
      border-bottom: 1px solid var(--border-primary);
    }

    .chat-card .card-body {
      padding: 12px;
    }

    .command-output-text {
      background: var(--bg-primary);
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
      margin: 0;
    }

    .card-toggle {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
    }

    .card-toggle:hover {
      background: var(--bg-hover);
    }

    /* Markdown 渲染样式 */
    .chat-message strong {
      font-weight: 700;
      color: inherit;
    }
    .chat-message code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92em;
      background: rgba(255,255,255,0.08);
      padding: 2px 5px;
      border-radius: 5px;
    }
    .chat-message br {
      display: block;
      content: "";
      line-height: 1.7;
    }

    .chat-raw {
      margin-top: 8px;
      padding: 8px;
      background: var(--bg-card);
      border-radius: 8px;
      font-size: 11px;
      color: var(--text-tertiary);
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
    }
    .chat-raw-toggle {
      font-size: 11px;
      color: var(--text-tertiary);
      cursor: pointer;
      margin-top: 4px;
    }

    /* 快捷指令 */
    .quick-commands {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-card);
    }
    .quick-cmd {
      padding: 8px 14px;
      background: #F1F5F9;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .quick-cmd:hover { background: rgba(59, 130, 246, 0.08); }
    .quick-cmd:active { background: rgba(59, 130, 246, 0.12); transform: scale(0.98); }
    .quick-cmd svg { stroke: #64748B; }
    .quick-cmd:hover svg { stroke: #3B82F6; }
    .quick-cmd[style*="color: var(--success)"] { 
      color: #059669; 
      background: rgba(16, 185, 129, 0.08);
    }
    .quick-cmd[style*="color: var(--success)"] svg { stroke: #059669; }

    /* 输入区域 */
    .input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(398px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      background: rgba(248, 250, 252, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(148, 163, 184, 0.14);
    }
    .chat-input {
      flex: 1;
      height: 48px;
      padding: 0 18px;
      background: #EEF3F8;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 15px;
      color: #1E293B;
      outline: none;
      transition: all 0.2s ease;
    }
    .chat-input:focus {
      background: #FFFFFF;
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
    }
    .chat-input::placeholder { color: #94A3B8; font-size: 15px; }
    .send-btn {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
      transition: all 0.2s ease;
      padding: 0;
      overflow: hidden;
    }
    .send-btn:disabled {
      opacity: 0.55;
      box-shadow: none;
      cursor: not-allowed;
    }
    .send-btn:not(:disabled):active {
      transform: scale(0.95);
    }
    .send-btn svg {
      width: 22px;
      height: 22px;
      stroke: #FFFFFF !important;
      fill: none !important;
      stroke-width: 1.9 !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
      display: block;
    }

    /* 加载动画 */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .typing { animation: pulse 1.5s infinite; }
  </style>
</head>

<body>
  <!-- 顶部 -->
  <div class="header">
    <a href="/h5/device.html" class="header-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      返回
    </a>
    <div class="header-title">设备对话</div>
    <div class="header-status" id="serviceStatus"></div>
  </div>

  <!-- 设备信息 -->
  <div class="device-info">
    <div class="device-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <circle cx="15.5" cy="8.5" r="1.5"/>
        <circle cx="8.5" cy="15.5" r="1.5"/>
        <circle cx="15.5" cy="15.5" r="1.5"/>
      </svg>
    </div>
    <div class="device-detail">
      <div class="device-name" id="deviceName">加载中...</div>
      <div class="device-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">检查中...</span>
      </div>
    </div>
    <button class="device-reconnect-btn" onclick="handleAction('重新连接', '正在重新连接...')" title="重新连接">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    </button>
  </div>

  <!-- 快捷指令 -->
  <div class="quick-commands">
    <button class="quick-cmd" onclick="sendQuickCmd('状态查询')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      查状态
    </button>
    <button class="quick-cmd" id="testCmd" onclick="sendQuickCmd('1+1=?')" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      测试
    </button>
    <button class="quick-cmd" onclick="sendQuickCmd('你好')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 11a6 6 0 0 0-9.93-4.93M18 8v6M15 8h.01M10 21V5"/></svg>
      打招呼
    </button>
    <button class="quick-cmd" onclick="window.location.href='/h5/session-center.html'" style="color: var(--success);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      管理会话
    </button>
  </div>

  <!-- 聊天容器 -->
  <div class="chat-container" id="chatContainer"></div>

  <!-- 输入框 -->
  <div class="input-area">
    <input type="text" class="chat-input" id="chatInput" placeholder="输入设备指令或任务..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" id="sendBtn" onclick="handleSend()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <!-- 依赖脚本 -->
  <script src="js/utils/storage.js"></script>
  <script src="js/services/themeService.js"></script>
  <script src="js/utils/navigation.js"></script>
  <script src="js/utils/toast.js"></script>
  <script src="js/services/api/config.js"></script>
  <script src="js/services/api/ApiClient.js"></script>
  <script src="js/services/api/endpoints.js"></script>
  <script src="js/services/api/index.js"></script>
  <script src="js/services/deviceService.js"></script>
  <script src="js/services/openclawChatService.js"></script>

  <script>
    const log = console.log;
    let currentDevice = null;
    let isProcessing = false;
    let currentSessionKey = 'agent:main:mobile-cn';  // 当前会话 sessionKey
    
    // 区分设备状态和小龙虾状态
    const runtimeState = {
      deviceOnline: false,
      deviceStatusText: '设备状态未知',
      wsAlive:false,
      openclawOnline: false,
      openclawStatusText: '检测中',
      
      canChat: false
    };
    
    // 更新状态显示
    function updateStatusDisplay() {
      console.log('[DeviceChat] updateStatusDisplay');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const deviceStatusText = document.getElementById('deviceStatusText');
      console.log('[DeviceChat] updateStatusDisplay runtimeState:', runtimeState);
      const { deviceOnline, openclawOnline, wsAlive } = runtimeState;

      console.log('[DeviceChat] updateStatusDisplay deviceOnline:', deviceOnline, 'openclawOnline:', openclawOnline, 'wsAlive:', wsAlive);

      // 计算综合状态文本
      let overallStatus = '';
      let dotClass = 'offline';

      if (!deviceOnline) {
        overallStatus = '设备离线';
        dotClass = 'offline';
      } else if (deviceOnline && !openclawOnline) {
        overallStatus = '设备在线 · 服务未启动';
        dotClass = 'warning';
      } else if (deviceOnline && wsAlive) {
        overallStatus = '设备在线 · 服务已启动';
        dotClass = 'online';
      }

      // 右上角状态胶囊
      if (statusDot && statusText) {
        statusDot.className = 'status-dot ' + dotClass;
        statusText.textContent = overallStatus;
      }

      // 更新设备状态显示
      const deviceStatusDot = document.getElementById('deviceStatusDot');
      if (deviceStatusDot && deviceStatusDot) {
        deviceStatusDot.className = 'status-dot ' + (deviceOnline ? 'online' : 'offline');
      }
      if (deviceStatusText) {
        deviceStatusText.textContent = deviceOnline ? '设备在线' : '设备离线';
      }
    }
    
    // 查询小龙虾服务状态
    async function checkOpenclawStatus(deviceId) {
      console.log('[DeviceChat] checkOpenclawStatus deviceId:', deviceId);
      try {
        const result = await window.OpenClawChatService.queryOpenClawStatus(deviceId);
        console.log('[DeviceChat] checkOpenclawStatus result:', result);
        console.log('[DeviceChat] checkOpenclawStatus wasLive:', result.wasLive);
        const wasLive = result.wsAlive;
        runtimeState.openclawOnline = wasLive;
        runtimeState.openclawStatusText = wasLive ? '在线' : '离线';
        runtimeState.canChat = result.wsAvlie;
        runtimeState.wsAlive = result.wsAvlie;
        
        updateStatusDisplay();

        if (wasLive) {
          // 服务已上线
          clearSystemNotice('openclaw_offline_notice');
        } else {
          // 服务仍未上线
          addSystemNoticeOnce('openclaw_offline_notice', '萤火虫服务未在线，请确认服务已启动后重试。', 'warning');
        }
      } catch (e) {
        console.error('[DeviceChat] checkOpenclawStatus failed:', e);
        runtimeState.openclawOnline = false;
        runtimeState.openclawStatusText = '检测失败';
        runtimeState.canChat = false;
        updateStatusDisplay();
        addSystemNoticeOnce('openclaw_offline_notice', '萤火虫服务未在线，请确认服务已启动后重试。', 'warning');
      }
    }
    
    // 初始化运行时状态
    async function initRuntimeState(device) {
      if (!device) return;
      
      // 设备状态
      const status = String(device?.status || '').toLowerCase();
      const manageState = String(device?.manageState || '').toLowerCase();
      runtimeState.deviceOnline = ['online', 'running', 'active'].includes(status) || 
                           ['online', 'running', 'active'].includes(manageState);
      runtimeState.deviceStatusText = runtimeState.deviceOnline ? '设备在线' : '设备离线';
      
      console.log('[StateDebug] deviceOnline:', runtimeState.deviceOnline, device?.status, device?.manageState);
      
      // 小龙虾服务状态
      const numericDeviceId = resolveNumericDeviceId(device);
      if (numericDeviceId) {
        console.log('[OpenClawDevice] numericDeviceId:', numericDeviceId, typeof numericDeviceId);
        console.log('[OpenClawDevice] iotDeviceUuid:', device?.iotDeviceUuid);
        console.log('[OpenClawDevice] routeDeviceId:', device?.routeDeviceId);
        console.log('[OpenClawDevice] sn:', device?.sn);
        await checkOpenclawStatus(numericDeviceId);
      }

      // 根据状态显示不同的消息
      if (runtimeState.deviceOnline && runtimeState.openclawOnline) {
        addAssistantMessage('萤火虫已就绪，可以帮你查询设备状态、执行任务或处理资料。');
      } else if (runtimeState.deviceOnline && !runtimeState.openclawOnline) {
        addSystemNoticeOnce('openclaw_offline_notice', '设备在线，但萤火虫服务未启动。请点击右上角刷新检测，或启动服务后再试。', 'warning');
      } else {
        addSystemNoticeOnce('device_offline_notice', '设备离线，请检查设备网络或电源。', 'error');
      }
    }
    
    // DEBUG 模式下显示测试按钮
    if (typeof DEBUG_OPENCLAW !== 'undefined' && DEBUG_OPENCLAW) {
      const testBtn = document.getElementById('testCmd');
      if (testBtn) testBtn.style.display = 'block';
    }

    // 新建会话
    function startNewSession() {
      // 生成新的 sessionKey
      currentSessionKey = 'agent:main:mobile:' + Date.now();
      console.log('[OpenClaw] new session:', currentSessionKey);
      
      // 清空聊天记录
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';
      
      // 显示欢迎语
      addAssistantMessage('小龙虾已开启新会话，请发送新的指令。');
    }

    // 安全转义 HTML
    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 渲染 assistant 消息的 Markdown
    function renderAssistantMarkdown(text) {
      const escaped = escapeHtml(text);
      return escaped
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^\s*[-*]\s+(.+)$/gm, '• $1')
        .replace(/\n/g, '<br>');
    }

    // 从URL获取deviceId
    function getDeviceIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('deviceId');
    }

    // 解析数字型 deviceId（用于 API 路径）
    // 注意：此函数只返回数字 ID，不返回字符串 UUID
    function resolveNumericDeviceId(device, fallbackId) {
      // 优先使用 device.id 或 device.deviceId
      const rawId = device?.id || device?.deviceId || fallbackId;
      const numericId = Number(rawId);
      
      if (!Number.isFinite(numericId)) {
        // 如果是 UUID 字符串，返回 null 并记录错误
        console.error('[DeviceId] invalid numeric device id', {
          rawId,
          deviceId: device?.id,
          deviceDeviceId: device?.deviceId,
          fallbackId,
          iotDeviceUuid: device?.iotDeviceUuid,
          routeDeviceId: device?.routeDeviceId,
          sn: device?.sn
        });
        return null;
      }
      
      console.log('[DeviceId] numericDeviceId:', numericId, typeof numericId);
      return numericId;
    }

    // 从设备对象中提取数字 ID（更宽松的解析）
    function extractNumericDeviceId(device) {
      if (!device) return null;
      
      // 尝试多种来源
      const id = device.id || device.deviceId;
      if (!id) return null;
      
      const numericId = Number(id);
      return Number.isFinite(numericId) ? numericId : null;
    }

    // 初始化
    async function init() {
      // 初始化主题
      ThemeManager.init();
      
      const urlDeviceId = getDeviceIdFromUrl();
      log('[DeviceChat] init, url deviceId:', urlDeviceId);

      // 从存储获取设备列表
      const deviceList = Storage.Device.getDeviceList() || [];
      const cached = Storage.Device.getCurrentDevice();
      log('[DeviceChat] deviceList:', deviceList);
      log('[DeviceChat] cached:', cached);
      
      // 尝试从 URL 获取数字 ID，或从缓存/列表中找到对应设备
      let targetDevice = null;
      let numericDeviceId = null;
      
      if (urlDeviceId) {
        // 尝试将 URL 中的 ID 转为数字
        numericDeviceId = Number(urlDeviceId);
        
        if (Number.isFinite(numericDeviceId)) {
          // URL 中是数字 ID，直接使用
          targetDevice = deviceList.find(d => d.id === numericDeviceId || String(d.id) === urlDeviceId) || cached;
        } else {
          // URL 中是 UUID 或其他字符串，在设备列表中查找
          log('[DeviceChat] URL deviceId is not numeric, searching device list...');
          targetDevice = deviceList.find(d => 
            d.iotDeviceUuid === urlDeviceId || 
            d.uuid === urlDeviceId || 
            d.routeDeviceUuid === urlDeviceId ||
            d.routeDeviceId === urlDeviceId ||
            d.sn === urlDeviceId
          ) || cached;
          
          // 如果找到设备，提取数字 ID
          if (targetDevice) {
            numericDeviceId = extractNumericDeviceId(targetDevice);
          }
        }
      } else {
        // 没有 URL deviceId，使用缓存设备
        targetDevice = cached;
        numericDeviceId = extractNumericDeviceId(targetDevice);
      }
      
      currentDevice = targetDevice;
      log('[DeviceChat] found device:', currentDevice);
      log('[DeviceChat] numericDeviceId:', numericDeviceId);

      if (!currentDevice) {
        showError('未找到设备，请从设备页进入');
        return;
      }
      
      // 验证数字 deviceId
      if (!numericDeviceId) {
        log('[DeviceChat] numericDeviceId is null, checking device...', currentDevice);
        // 尝试最后从 currentDevice 提取
        numericDeviceId = extractNumericDeviceId(currentDevice);
        if (!numericDeviceId) {
          showError('设备ID异常，请重新进入设备对话');
          return;
        }
      }
      
      log('[DeviceChat] validated numericDeviceId:', numericDeviceId);

      // 显示设备信息
      renderDeviceInfo();
      
      // 初始化运行时状态（设备状态 + 萤火虫服务状态）
      await initRuntimeState(currentDevice);

      // 初始化聊天服务
      window.OpenClawChatService.init(currentDevice);

      // 启动轮询系统（恢复轮询 -> 空闲轮询）
      if (numericDeviceId && runtimeState.openclawOnline) {
        window.OpenClawChatService.startPolling(numericDeviceId, {
          onRecoveryProgress: (count) => {
            console.log('[UI] recovery progress:', count);
          },
          onLifecycleStart: (runId) => {
            console.log('[UI] lifecycle start during idle:', runId);
          },
          onAssistantUpdate: (text) => {
            console.log('[UI] assistant update during idle:', text.slice(0, 50));
          },
          onCommandOutput: (output, info) => {
            console.log('[UI] command output during idle:', info);
          },
          onFinal: (text) => {
            console.log('[UI] final during idle:', text.slice(0, 50));
          },
          onIdle: () => {
            console.log('[UI] now in idle polling mode');
          }
        });
      }
    }

    // 渲染设备信息
    function renderDeviceInfo() {
      const nameEl = document.getElementById('deviceName');
      const dotEl = document.getElementById('statusDot');
      const textEl = document.getElementById('statusText');
      
      if (nameEl) nameEl.textContent = currentDevice?.name || '未知设备';
      
      const isOnline = currentDevice?.isOnline || currentDevice?.status === 'online';
      if (dotEl) {
        dotEl.className = 'status-dot ' + (isOnline ? 'online' : 'offline');
      }
      if (textEl) {
        textEl.textContent = isOnline ? '设备在线' : '设备离线';
      }
    }

    // 快捷指令
    function sendQuickCmd(message) {
      if (isProcessing) return;
      handleSend(message);
    }

    // 回车发送
    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    }

    // 发送消息
    async function handleSend(customMessage = null) {
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const message = (customMessage || input.value || '').trim();

      if (!message || isProcessing) return;
      if (!currentDevice) {
        showError('未绑定设备');
        return;
      }

      const deviceUuid = window.OpenClawChatService.resolveDeviceUuid(currentDevice);
      if (!deviceUuid) {
        showError('当前设备缺少 iotDeviceUuid / uuid，暂无法连接萤火虫');
        return;
      }

      // 状态拦截
      if (!runtimeState.deviceOnline) {
        addSystemNoticeOnce('device_offline_notice', '设备离线，无法发送指令。请检查设备网络或电源。', 'error');
        return;
      }

      if (!runtimeState.openclawOnline) {
        addSystemNoticeOnce('openclaw_offline_notice', '设备在线，但萤火虫服务未启动。请先重新检测或启动服务。', 'warning');
        return;
      }

      const turnId = 'turn_' + Date.now();
      console.log('[Turn]', turnId, 'sending:', message);

      isProcessing = true;
      input.disabled = true;
      sendBtn.disabled = true;

      addUserMessage(message);
      input.value = '';

      // 创建助手消息气泡
      const assistantMessageId = addAssistantMessage('正在发送指令...', {
        status: 'loading',
        turnId: turnId
      });

      let commandCardId = null;

      const updateCurrentAssistant = (text, options = {}) => {
        updateAssistantMessage(assistantMessageId, text, options);
      };

      const addCommandCard = (output, index) => {
        const container = document.getElementById('chatContainer');
        const card = document.createElement('div');
        card.className = 'chat-card command-output';

        const header = document.createElement('div');
        header.className = 'card-header';
        header.textContent = '执行结果 #' + (index + 1);

        const body = document.createElement('div');
        body.className = 'card-body';

        const pre = document.createElement('pre');
        pre.className = 'command-output-text';
        pre.textContent = output.length > 500 ? output.substring(0, 500) + '...' : output;

        body.appendChild(pre);

        if (output.length > 500) {
          const toggle = document.createElement('button');
          toggle.className = 'card-toggle';
          toggle.textContent = '点击展开全部';
          toggle.onclick = () => {
            pre.textContent = pre.textContent.includes('...') ? output : output.substring(0, 500) + '...';
            toggle.textContent = pre.textContent.includes('...') ? '点击收起' : '点击展开全部';
          };
          body.appendChild(toggle);
        }

        card.appendChild(header);
        card.appendChild(body);
        container.appendChild(card);
        scrollToBottom();

        return card.id;
      };

      try {
        const response = await window.OpenClawChatService.sendMessageAndWait(currentDevice, message, {
          // Lifecycle 事件
          onLifecycleStart: (runId, data) => {
            console.log('[UI] lifecycle start:', runId);
            updateCurrentAssistant('萤火虫正在分析问题...', { status: 'loading' });
          },

          onLifecycleEnd: (data) => {
            console.log('[UI] lifecycle end');
          },

          // Assistant 更新
          onAssistantUpdate: (text) => {
            console.log('[UI] assistant update, len:', text.length);
            updateCurrentAssistant(text, { status: 'streaming' });
          },

          // 命令输出
          onCommandOutput: (output, info) => {
            console.log('[UI] command output:', info);
            if (!commandCardId) {
              commandCardId = addCommandCard(output, info.index);
            }
          },

          // Final 完成
          onFinal: (text, extra) => {
            console.log('[UI] final:', text.slice(0, 100));
            updateCurrentAssistant(text, { status: 'done', final: true });
          },

          // 警告提示
          onWarning: (msg) => {
            console.log('[UI] warning:', msg);
            updateCurrentAssistant(msg, { status: 'loading' });
          },

          // 进入空闲状态
          onIdle: () => {
            console.log('[UI] idle polling');
          }
        });

        // 处理返回结果
        if (response?.success && response?.text) {
          updateCurrentAssistant(response.text, { status: 'done', final: response.isFinal });

          if (response.warning && !response.isFinal) {
            const bubble = document.querySelector(`[data-message-id="${assistantMessageId}"]`);
            if (bubble) {
              bubble.classList.add('warning');
              const warn = document.createElement('div');
              warn.className = 'chat-warning';
              warn.textContent = response.warning;
              bubble.appendChild(warn);
            }
          }

          if (response.commandOutputs?.length > 0 && !commandCardId) {
            response.commandOutputs.forEach((cmd, idx) => {
              addCommandCard(cmd.text, idx);
            });
          }
        } else if (!response?.success) {
          updateCurrentAssistant(response?.msg || '通信失败', { status: 'error' });
        } else {
          updateCurrentAssistant('暂未返回可读结果，请稍后重试。', { status: 'error' });
        }

      } catch (error) {
        console.error('[Turn] error:', error);
        updateCurrentAssistant(error.message || '通信失败', { status: 'error' });
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        isProcessing = false;
        input.focus();
      }
    }

    // 添加用户消息
    function addUserMessage(message) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message user';
      div.textContent = message;
      container.appendChild(div);
      scrollToBottom();
    }

    // 渲染消息内容（支持 Markdown）
    function renderMessageContent(text) {
      if (typeof renderAssistantMarkdown === 'function') {
        return renderAssistantMarkdown(text);
      }
      return text;
    }

    // 添加助手消息（带 data-message-id）
    function addAssistantMessage(message, options = {}) {
      const container = document.getElementById('chatContainer');
      const id = options.id || `assistant_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      
      const div = document.createElement('div');
      div.className = 'chat-message assistant';
      div.dataset.messageId = id;
      div.dataset.turnId = options.turnId || '';
      
      if (options.isError) {
        div.classList.add('error');
      }
      
      if (options.warning) {
        div.classList.add('warning');
      }
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.innerHTML = renderMessageContent(message);
      div.appendChild(contentDiv);
      
      if (options.warning) {
        const warningDiv = document.createElement('div');
        warningDiv.className = 'chat-warning';
        warningDiv.textContent = options.warning;
        div.appendChild(warningDiv);
      }
      
      container.appendChild(div);
      scrollToBottom();
      
      console.log('[UIRender] addAssistantMessage', { id, textPreview: String(message).slice(0, 50) });
      return id;
    }

    // 更新助手消息内容
    function updateAssistantMessage(messageId, text, options = {}) {
      const el = document.querySelector(`[data-message-id="${messageId}"]`);
      
      if (!el) {
        console.error('[UIRender] assistant message not found:', messageId);
        return false;
      }
      
      const contentEl = 
        el.querySelector('.message-content') || 
        el.querySelector('.bubble-content') || 
        el.querySelector('.assistant-content') ||
        el;
      
      contentEl.innerHTML = renderMessageContent(text);
      
      el.classList.remove('loading', 'streaming', 'error', 'warning');
      if (options.status) {
        el.classList.add(options.status);
      }
      
      console.log('[UIRender] updateAssistantMessage', { 
        messageId, 
        textPreview: String(text).slice(0, 80),
        status: options.status 
      });
      
      scrollToBottom();
      return true;
    }

    // 添加助手气泡（可更新的，兼容旧接口）
    function addAssistantBubble(message, status = null) {
      const container = document.getElementById('chatContainer');
      const id = `bubble_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      
      const div = document.createElement('div');
      div.className = 'chat-message assistant';
      div.dataset.messageId = id;
      
      if (status) {
        div.classList.add(status);
      }
      
      const bubbleContent = document.createElement('div');
      bubbleContent.className = 'bubble-content';
      bubbleContent.textContent = message;
      div.appendChild(bubbleContent);
      
      if (status) {
        const bubbleStatus = document.createElement('div');
        bubbleStatus.className = 'bubble-status';
        bubbleStatus.textContent = status;
        div.appendChild(bubbleStatus);
      }
      
      container.appendChild(div);
      scrollToBottom();
      
      console.log('[UIRender] addAssistantBubble', { id, status, textPreview: String(message).slice(0, 50) });
      return id;
    }

    // 添加loading消息
    function addLoadingMessage(message) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message assistant loading typing';
      div.id = 'loading-' + Date.now();
      div.textContent = message;
      container.appendChild(div);
      scrollToBottom();
      return div.id;
    }

    // 显示错误
    function showError(message) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message error';
      div.textContent = message;
      container.appendChild(div);
      scrollToBottom();
    }

    function addSystemNoticeOnce(id, text, type = 'warning') {
      if (document.querySelector(`[data-notice-id="${id}"]`)) return;

      const container = document.getElementById('chatContainer');
      const notice = document.createElement('div');
      notice.className = `chat-message system-notice ${type}`;
      notice.dataset.noticeId = id;
      notice.textContent = text;
      container.appendChild(notice);
      scrollToBottom();
    }

    function clearSystemNotice(id) {
      const notice = document.querySelector(`[data-notice-id="${id}"]`);
      if (notice) notice.remove();
    }

    // 移除消息
    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    // 切换原始JSON显示
    function toggleRaw(el) {
      const parent = el.parentElement;
      const raw = parent.dataset.raw;
      if (raw) {
        if (el.textContent.includes('展开')) {
          el.textContent = '▲ 收起原始JSON';
          const rawDiv = document.createElement('div');
          rawDiv.className = 'chat-raw';
          rawDiv.textContent = raw;
          parent.appendChild(rawDiv);
        } else {
          el.textContent = '▼ 点击展开原始JSON';
          const rawDiv = parent.querySelector('.chat-raw');
          if (rawDiv) rawDiv.remove();
        }
      }
    }

    // 滚动到底部
    function scrollToBottom() {
      const container = document.getElementById('chatContainer');
      container.scrollTop = container.scrollHeight;
    }

    // 页面加载完成
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
