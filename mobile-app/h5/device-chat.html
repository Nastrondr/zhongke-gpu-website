<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小龙虾设备对话</title>
  <link rel="icon" type="image/png" href="./apple-touch-icon2.png">
  <link rel="shortcut icon" type="image/png" href="./apple-touch-icon2.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon2.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon2.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="数字大脑">
  <meta name="application-name" content="数字大脑">
  <link rel="stylesheet" href="css/theme-variables.css">
  <style>
    /* 薄层兼容映射 - 使用全局变量并保留聊天特有颜色 */
    :root {
      /* 聊天气泡颜色 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #334155;
      --border-card: var(--border-primary);
    }
    html[data-theme="light"] {
      /* 聊天气泡 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #EEF2F7;
      --border-card: var(--border-primary);
      /* 保留功能色 */
      --accent-green: var(--success);
    }
    html[data-theme="dark"] {
      /* 聊天气泡 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #1E293B;
      --border-card: var(--border-primary);
      /* 保留功能色 */
      --accent-green: var(--success);
    }
    
    /* 深色模式覆盖 */
    html[data-theme="dark"] body {
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    html[data-theme="dark"] .header {
      background: #111827;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .header-title {
      color: #F8FAFC;
    }
    html[data-theme="dark"] .header-back {
      color: #CBD5E1;
    }
    html[data-theme="dark"] .device-info {
      background: #141E2F;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .device-name {
      color: #F8FAFC;
      font-weight: 700;
    }
    html[data-theme="dark"] .device-uuid {
      color: #94A3B8;
    }
    html[data-theme="dark"] .device-status {
      color: #94A3B8;
    }
    html[data-theme="dark"] .status-dot.online {
      background: #10B981;
    }
    html[data-theme="dark"] .status-dot.offline {
      background: #64748B;
    }
    html[data-theme="dark"] .header-status {
      background: rgba(16, 185, 129, 0.16);
      color: #34D399;
    }
    html[data-theme="dark"] .device-reconnect-btn {
      background: rgba(59, 130, 246, 0.10);
      border: 1px solid rgba(96, 165, 250, 0.16);
      color: #60A5FA;
    }
    html[data-theme="dark"] .quick-cmd {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.14);
      color: #CBD5E1;
    }
    html[data-theme="dark"] .quick-cmd svg {
      stroke: #94A3B8;
    }
    html[data-theme="dark"] .quick-cmd[style*="color: var(--success)"] { 
      background: rgba(16, 185, 129, 0.10);
      border: 1px solid rgba(16, 185, 129, 0.18);
      color: #34D399;
    }
    html[data-theme="dark"] .quick-cmd[style*="color: var(--success)"] svg {
      stroke: #34D399;
    }
    html[data-theme="dark"] .welcome-bubble {
      background: #1E293B;
      border: 1px solid rgba(148, 163, 184, 0.10);
      color: #F8FAFC;
    }
    html[data-theme="dark"] .chat-message.assistant {
      background: #1E293B;
      border: 1px solid rgba(148, 163, 184, 0.10);
      color: #F8FAFC;
    }
    html[data-theme="dark"] .chat-message.user {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: #FFFFFF;
    }
    html[data-theme="dark"] .input-area {
      background: #111827;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .chat-input {
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .chat-input::placeholder {
      color: #64748B;
    }
    html[data-theme="dark"] .chat-input:focus {
      border-color: rgba(59, 130, 246, 0.4);
    }
    html[data-theme="dark"] .send-btn {
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }
    html[data-theme="dark"] .send-btn svg {
      stroke: #FFFFFF !important;
    }
    html[data-theme="dark"] .device-avatar {
      background: rgba(59, 130, 246, 0.16);
    }
    html[data-theme="dark"] .device-avatar svg {
      stroke: #60A5FA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    .header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-card);
    }
    .header-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 14px;
    }
    .header-back svg { width: 20px; height: 20px; }
    .header-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
    }

    .header-status {
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
    }
    .header-status.offline { background: rgba(100, 116, 139, 0.12); color: #64748B; }
    .header-status.error { background: rgba(239, 68, 68, 0.12); color: #DC2626; }

    .header-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      color: var(--text-secondary);
      transition: all 0.2s;
    }

    .header-action:hover {
      background: rgba(96, 165, 250, 0.15);
      color: var(--brand-primary);
    }

    .header-action svg {
      width: 18px;
      height: 18px;
    }

    /* 设备信息 */
    .device-info {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: #FFFFFF;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }
    .device-avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
    }
    .device-detail { flex: 1; }
    .device-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .device-status {
      font-size: 13px;
      color: #64748B;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.online { background: #10B981; }
    .status-dot.offline { background: #94A3B8; }
    
    .device-reconnect-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.08);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .device-reconnect-btn:hover {
      background: rgba(59, 130, 246, 0.15);
    }
    .device-reconnect-btn:active {
      transform: scale(0.95);
    }
    .device-reconnect-btn svg {
      stroke: #3B82F6;
    }

    /* 聊天区域 */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .chat-message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }
    .chat-message.assistant {
      align-self: flex-start;
      background: #EEF2F7;
      color: #1E293B;
      border-bottom-left-radius: 4px;
    }
    .chat-message.loading {
      color: var(--text-secondary);
      font-style: italic;
    }
    .chat-message.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }
    .chat-message.paused {
      background: rgba(251, 191, 36, 0.15);
      color: #92400E;
      border: 1px solid #FBBF24;
    }

    .chat-message .message-content {
      line-height: 1.6;
    }

    .chat-message.loading {
      opacity: 0.7;
    }

    .chat-message.streaming::after {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 8px;
      border-radius: 50%;
      background: var(--accent-blue);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 消息包装容器 */
    .message-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 16px;
      position: relative;
    }

    /* 消息操作按钮容器 - 水平分布在气泡下方左侧，常显 */
    .message-actions {
      display: flex;
      flex-direction: row;
      gap: 6px;
      margin-top: 4px;
      align-self: flex-start;
      margin-left: 0;
    }

    /* 操作按钮样式 - 更小尺寸 */
    .message-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      border-radius: 4px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .message-action-btn svg {
      width: 12px !important;
      height: 12px !important;
      flex-shrink: 0;
    }

    .message-action-btn:hover {
      background: rgba(0, 0, 0, 0.08);
      color: var(--text-primary);
    }

    .message-action-btn:active {
      transform: scale(0.95);
    }

    /* 多模态按钮样式 */
    .multi-modal-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .multi-modal-btn:hover {
      background: #e0e0e0;
    }

    /* 多模态菜单 */
    .multi-modal-menu {
      display: none;
      position: absolute;
      bottom: 70px;
      left: 16px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      padding: 8px;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
    }

    .multi-modal-menu.active {
      display: flex;
    }

    .multi-modal-menu button {
      padding: 12px 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 8px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #333;
    }

    .multi-modal-menu button:hover {
      background: #f5f5f5;
    }

    /* 图片预览容器 */
    .message-images {
      display: grid;
      gap: 4px;
      margin-bottom: 8px;
      max-width: 100%;
    }

    .message-images.single {
      grid-template-columns: 1fr;
    }

    .message-images.double {
      grid-template-columns: repeat(2, 1fr);
    }

    .message-images.multiple {
      grid-template-columns: repeat(3, 1fr);
    }

    .message-images img {
      width: 100%;
      max-width: 200px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .message-images img:hover {
      transform: scale(1.02);
    }

    /* 图片预览弹窗 */
    .image-preview-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }

    .image-preview-modal.active {
      display: flex;
    }

    .image-preview-modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .image-preview-modal .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 30px;
      cursor: pointer;
      background: none;
      border: none;
    }

    /* 图片占位符样式 */
    .image-placeholder {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
      margin-right: 4px;
    }

    /* 图片暂存区样式 */
    .image-staging-area {
      display: none;
      flex-wrap: wrap;
      padding: 8px 16px;
      background: #f8f9fa;
      border-top: 1px solid #e0e0e0;
    }

    /* 复制成功提示 */
    .copy-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      animation: fadeInUp 0.3s ease forwards;
      z-index: 100;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0);
      }
    }

    /* 引用选择器样式 */
    .quote-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .quote-selector {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .quote-header {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .quote-textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      font-size: 14px;
      resize: none;
      box-sizing: border-box;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--bg-primary);
    }

    .quote-textarea:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    .quote-buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .quote-btn-cancel, .quote-btn-confirm {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quote-btn-cancel {
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }

    .quote-btn-cancel:hover {
      background: var(--bg-tertiary);
    }

    .quote-btn-confirm {
      background: var(--accent-blue);
      color: white;
    }

    .quote-btn-confirm:hover {
      background: var(--accent-blue-dark);
    }

    /* 深色模式支持 */
    html[data-theme="dark"] .quote-selector {
      background: var(--bg-card);
    }

    html[data-theme="dark"] .quote-textarea {
      background: var(--bg-primary);
      border-color: var(--border-primary);
      color: var(--text-primary);
    }

    html[data-theme="dark"] .quote-btn-cancel {
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }

    .bubble-status {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      font-style: italic;
    }

    .chat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      margin: 8px 0;
      overflow: hidden;
    }

    .chat-card .card-header {
      background: var(--bg-secondary);
      padding: 8px 12px;
      font-weight: 600;
      font-size: 13px;
      border-bottom: 1px solid var(--border-primary);
    }

    .chat-card .card-body {
      padding: 12px;
    }

    .command-output-text {
      background: var(--bg-primary);
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
      margin: 0;
    }

    .card-toggle {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
    }

    .card-toggle:hover {
      background: var(--bg-hover);
    }

    /* Markdown 渲染样式 */
    .chat-message strong {
      font-weight: 700;
      color: inherit;
    }
    .chat-message code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92em;
      background: rgba(255,255,255,0.08);
      padding: 2px 5px;
      border-radius: 5px;
    }
    .chat-message br {
      display: block;
      content: "";
      line-height: 1.7;
    }

    .chat-raw {
      margin-top: 8px;
      padding: 8px;
      background: var(--bg-card);
      border-radius: 8px;
      font-size: 11px;
      color: var(--text-tertiary);
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
    }
    .chat-raw-toggle {
      font-size: 11px;
      color: var(--text-tertiary);
      cursor: pointer;
      margin-top: 4px;
    }

    /* 快捷指令 */
    .quick-commands {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-card);
    }
    .quick-cmd {
      padding: 8px 14px;
      background: #F1F5F9;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .quick-cmd:hover { background: rgba(59, 130, 246, 0.08); }
    .quick-cmd:active { background: rgba(59, 130, 246, 0.12); transform: scale(0.98); }
    .quick-cmd svg { 
  stroke: #64748B; 
  width: 14px; 
  height: 14px; 
  flex-shrink: 0;
}
    .quick-cmd:hover svg { stroke: #3B82F6; }
    .quick-cmd[style*="color: var(--success)"] { 
      color: #059669; 
      background: rgba(16, 185, 129, 0.08);
    }
    .quick-cmd[style*="color: var(--success)"] svg { stroke: #059669; }

    /* 输入区域 */
    .input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(398px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      background: rgba(248, 250, 252, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(148, 163, 184, 0.14);
    }
    .chat-input {
      flex: 1;
      min-height: 48px;
      max-height: 200px;
      padding: 12px 18px;
      background: #EEF3F8;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 15px;
      color: #1E293B;
      outline: none;
      transition: all 0.2s ease;
      resize: none;
      display: flex;
      align-items: center;
      overflow-y: auto;
    }
    .chat-input:focus {
      background: #FFFFFF;
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
    }
    .chat-input::placeholder { 
      color: #94A3B8; 
      font-size: 15px; 
      display: flex;
      align-items: center;
      height: 100%;
    }
    .chat-input:not(:placeholder-shown) {
      white-space: pre-wrap;
    }
    .input-hint {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 58px;
      padding: 4px 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #FFFFFF;
      font-size: 11px;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      margin-bottom: 4px;
    }
    .input-area:hover .input-hint,
    .chat-input:focus ~ .input-hint {
      opacity: 1;
    }
    .send-btn {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
      transition: all 0.2s ease;
      padding: 0;
      overflow: hidden;
    }
    .send-btn:disabled {
      opacity: 0.55;
      box-shadow: none;
      cursor: not-allowed;
    }
    .send-btn:not(:disabled):active {
      transform: scale(0.95);
    }
    .send-btn svg {
      width: 22px;
      height: 22px;
      stroke: #FFFFFF !important;
      fill: none !important;
      stroke-width: 1.9 !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
      display: block;
    }
    .send-btn.processing {
      background: linear-gradient(135deg, #EF4444, #DC2626);
      animation: pulse-processing 1s infinite;
    }
    .send-btn.processing svg.icon-send {
      display: none;
    }
    .send-btn.processing svg.icon-pause {
      display: block;
    }
    .send-btn.processing svg.icon-stop {
      display: none;
    }

    /* 加载动画 */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes pulse-processing {
      0%, 100% { 
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        transform: scale(1);
      }
      50% { 
        box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
        transform: scale(1.02);
      }
    }
    .typing { animation: pulse 1.5s infinite; }
  </style>
</head>

<body>
  <!-- 顶部 -->
  <div class="header">
    <a href="/h5/device.html" class="header-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      返回
    </a>
    <div class="header-title">设备对话</div>
    <div class="header-status" id="serviceStatus"></div>
  </div>

  <!-- 设备信息 -->
  <div class="device-info">
    <div class="device-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <circle cx="15.5" cy="8.5" r="1.5"/>
        <circle cx="8.5" cy="15.5" r="1.5"/>
        <circle cx="15.5" cy="15.5" r="1.5"/>
      </svg>
    </div>
    <div class="device-detail">
      <div class="device-name" id="deviceName">加载中...</div>
      <div class="device-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">检查中...</span>
      </div>
    </div>
    <button class="device-reconnect-btn" onclick="handleAction('重新连接', '正在重新连接...')" title="重新连接">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    </button>
  </div>

  <!-- 快捷指令 -->
  <div class="quick-commands">
    <button class="quick-cmd" onclick="sendQuickCmd('状态查询')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      查状态
    </button>
    <button class="quick-cmd" id="testCmd" onclick="sendQuickCmd('1+1=?')" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      测试
    </button>
    <button class="quick-cmd" onclick="sendQuickCmd('你好')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"/></svg>
      打招呼
    </button>
    <button class="quick-cmd" onclick="window.location.href='/h5/session-center.html'" style="color: var(--success);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      管理会话
    </button>
  </div>

  <!-- 聊天容器 -->
  <div class="chat-container" id="chatContainer"></div>

  <!-- 输入框 -->
  <div class="input-area">
    <button class="multi-modal-btn" id="multiModalBtn" onclick="toggleMultiModalMenu()">+</button>
    <div class="multi-modal-menu" id="multiModalMenu">
      <button onclick="selectImage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        📷 图片
      </button>
    </div>
    <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)" hidden multiple>
    <textarea class="chat-input" id="chatInput" placeholder="输入设备指令或任务..." rows="1" onkeydown="handleInputKeydown(event)" onkeypress="handleKeyPress(event)" oninput="autoResizeInput(this)"></textarea>
    <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
    <button class="send-btn" id="sendBtn" onclick="isProcessing ? handlePause() : handleSend()">
      <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none;">
        <rect x="6" y="4" width="4" height="16" rx="1"/>
        <rect x="14" y="4" width="4" height="16" rx="1"/>
      </svg>
      <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none;">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
      </svg>
    </button>
  </div>

  <!-- 图片预览弹窗 -->
  <div class="image-preview-modal" id="imagePreviewModal" onclick="closeImagePreview(event)">
    <button class="close-btn" onclick="closeImagePreview()">×</button>
    <img id="previewImage" src="" alt="图片预览">
  </div>

  <!-- 依赖脚本 -->
  <script src="js/utils/storage.js"></script>
  <script src="js/services/themeService.js"></script>
  <script src="js/utils/navigation.js"></script>
  <script src="js/utils/toast.js"></script>
  <script src="js/services/api/config.js"></script>
  <script src="js/services/api/ApiClient.js"></script>
  <script src="js/services/api/endpoints.js"></script>
  <script src="js/services/api/index.js"></script>
  <script src="js/services/deviceService.js"></script>
  <script src="js/services/openclawChatService.js"></script>

  <script>
    const log = console.log;
    let currentDevice = null;
    let isProcessing = false;
    let currentSessionKey = 'agent:main:mobile-cn';  // 当前会话 sessionKey
    let currentAssistantMessageId = null;  // 当前助手消息ID（用于暂停时更新）
    
    // 区分设备状态和小龙虾状态
    const runtimeState = {
      deviceOnline: false,
      deviceStatusText: '设备状态未知',
      wsAlive:false,
      openclawOnline: false,
      openclawStatusText: '检测中',
      
      canChat: false
    };
    
    // 更新状态显示
    function updateStatusDisplay() {
      console.log('[DeviceChat] updateStatusDisplay');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const deviceStatusText = document.getElementById('deviceStatusText');
      console.log('[DeviceChat] updateStatusDisplay runtimeState:', runtimeState);
      const { deviceOnline, openclawOnline, wsAlive } = runtimeState;

      console.log('[DeviceChat] updateStatusDisplay deviceOnline:', deviceOnline, 'openclawOnline:', openclawOnline, 'wsAlive:', wsAlive);

      // 计算综合状态文本
      let overallStatus = '';
      let dotClass = 'offline';

      if (!deviceOnline) {
        overallStatus = '设备离线';
        dotClass = 'offline';
      } else if (deviceOnline && !openclawOnline) {
        overallStatus = '设备在线 · 服务未启动';
        dotClass = 'warning';
      } else if (deviceOnline && wsAlive) {
        overallStatus = '设备在线 · 服务已启动';
        dotClass = 'online';
      }

      // 右上角状态胶囊
      if (statusDot && statusText) {
        statusDot.className = 'status-dot ' + dotClass;
        statusText.textContent = overallStatus;
      }

      // 更新设备状态显示
      const deviceStatusDot = document.getElementById('deviceStatusDot');
      if (deviceStatusDot && deviceStatusDot) {
        deviceStatusDot.className = 'status-dot ' + (deviceOnline ? 'online' : 'offline');
      }
      if (deviceStatusText) {
        deviceStatusText.textContent = deviceOnline ? '设备在线' : '设备离线';
      }
    }
    
    // 查询小龙虾服务状态
    async function checkOpenclawStatus(deviceId) {
      console.log('[DeviceChat] checkOpenclawStatus deviceId:', deviceId);
      try {
        const result = await window.OpenClawChatService.queryOpenClawStatus(deviceId);
        console.log('[DeviceChat] checkOpenclawStatus result:', result);
        console.log('[DeviceChat] checkOpenclawStatus wasLive:', result.wasLive);
        const wasLive = result.wsAlive;
        runtimeState.openclawOnline = wasLive;
        runtimeState.openclawStatusText = wasLive ? '在线' : '离线';
        runtimeState.canChat = result.wsAvlie;
        runtimeState.wsAlive = result.wsAvlie;
        
        updateStatusDisplay();

        if (wasLive) {
          // 服务已上线
          clearSystemNotice('openclaw_offline_notice');
        } else {
          // 服务仍未上线
          addSystemNoticeOnce('openclaw_offline_notice', '萤火虫服务未在线，请确认服务已启动后重试。', 'warning');
        }
      } catch (e) {
        console.error('[DeviceChat] checkOpenclawStatus failed:', e);
        runtimeState.openclawOnline = false;
        runtimeState.openclawStatusText = '检测失败';
        runtimeState.canChat = false;
        updateStatusDisplay();
        addSystemNoticeOnce('openclaw_offline_notice', '萤火虫服务未在线，请确认服务已启动后重试。', 'warning');
      }
    }
    
    // 初始化运行时状态
    async function initRuntimeState(device) {
      if (!device) return;
      
      // 设备状态
      const status = String(device?.status || '').toLowerCase();
      const manageState = String(device?.manageState || '').toLowerCase();
      runtimeState.deviceOnline = ['online', 'running', 'active'].includes(status) || 
                           ['online', 'running', 'active'].includes(manageState);
      runtimeState.deviceStatusText = runtimeState.deviceOnline ? '设备在线' : '设备离线';
      
      console.log('[StateDebug] deviceOnline:', runtimeState.deviceOnline, device?.status, device?.manageState);
      
      // 小龙虾服务状态
      const numericDeviceId = resolveNumericDeviceId(device);
      if (numericDeviceId) {
        console.log('[OpenClawDevice] numericDeviceId:', numericDeviceId, typeof numericDeviceId);
        console.log('[OpenClawDevice] iotDeviceUuid:', device?.iotDeviceUuid);
        console.log('[OpenClawDevice] routeDeviceId:', device?.routeDeviceId);
        console.log('[OpenClawDevice] sn:', device?.sn);
        await checkOpenclawStatus(numericDeviceId);
      }

      // 根据状态显示不同的消息
      if (runtimeState.deviceOnline && runtimeState.openclawOnline) {
        addAssistantMessage('萤火虫已就绪，可以帮你查询设备状态、执行任务或处理资料。');
      } else if (runtimeState.deviceOnline && !runtimeState.openclawOnline) {
        addSystemNoticeOnce('openclaw_offline_notice', '设备在线，但萤火虫服务未启动。请点击右上角刷新检测，或启动服务后再试。', 'warning');
      } else {
        addSystemNoticeOnce('device_offline_notice', '设备离线，请检查设备网络或电源。', 'error');
      }
    }
    
    // DEBUG 模式下显示测试按钮
    if (typeof DEBUG_OPENCLAW !== 'undefined' && DEBUG_OPENCLAW) {
      const testBtn = document.getElementById('testCmd');
      if (testBtn) testBtn.style.display = 'block';
    }

    // 新建会话
    function startNewSession() {
      // 生成新的 sessionKey
      currentSessionKey = 'agent:main:mobile:' + Date.now();
      console.log('[OpenClaw] new session:', currentSessionKey);
      
      // 清空聊天记录
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';
      
      // 显示欢迎语
      addAssistantMessage('小龙虾已开启新会话，请发送新的指令。');
    }

    // 安全转义 HTML
    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 渲染 assistant 消息的 Markdown
    function renderAssistantMarkdown(text) {
      const escaped = escapeHtml(text);
      return escaped
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^\s*[-*]\s+(.+)$/gm, '• $1')
        .replace(/\n/g, '<br>');
    }

    // 从URL获取deviceId
    function getDeviceIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('deviceId');
    }

    // 解析数字型 deviceId（用于 API 路径）
    // 注意：此函数只返回数字 ID，不返回字符串 UUID
    function resolveNumericDeviceId(device, fallbackId) {
      // 优先使用 device.id 或 device.deviceId
      const rawId = device?.id || device?.deviceId || fallbackId;
      const numericId = Number(rawId);
      
      if (!Number.isFinite(numericId)) {
        // 如果是 UUID 字符串，返回 null 并记录错误
        console.error('[DeviceId] invalid numeric device id', {
          rawId,
          deviceId: device?.id,
          deviceDeviceId: device?.deviceId,
          fallbackId,
          iotDeviceUuid: device?.iotDeviceUuid,
          routeDeviceId: device?.routeDeviceId,
          sn: device?.sn
        });
        return null;
      }
      
      console.log('[DeviceId] numericDeviceId:', numericId, typeof numericId);
      return numericId;
    }

    // 从设备对象中提取数字 ID（更宽松的解析）
    function extractNumericDeviceId(device) {
      if (!device) return null;
      
      // 尝试多种来源
      const id = device.id || device.deviceId;
      if (!id) return null;
      
      const numericId = Number(id);
      return Number.isFinite(numericId) ? numericId : null;
    }

    // 初始化
    async function init() {
      // 初始化主题
      ThemeManager.init();
      
      const urlDeviceId = getDeviceIdFromUrl();
      log('[DeviceChat] init, url deviceId:', urlDeviceId);

      // 从存储获取设备列表
      const deviceList = Storage.Device.getDeviceList() || [];
      const cached = Storage.Device.getCurrentDevice();
      log('[DeviceChat] deviceList:', deviceList);
      log('[DeviceChat] cached:', cached);
      
      // 尝试从 URL 获取数字 ID，或从缓存/列表中找到对应设备
      let targetDevice = null;
      let numericDeviceId = null;
      
      if (urlDeviceId) {
        // 尝试将 URL 中的 ID 转为数字
        numericDeviceId = Number(urlDeviceId);
        
        if (Number.isFinite(numericDeviceId)) {
          // URL 中是数字 ID，直接使用
          targetDevice = deviceList.find(d => d.id === numericDeviceId || String(d.id) === urlDeviceId) || cached;
        } else {
          // URL 中是 UUID 或其他字符串，在设备列表中查找
          log('[DeviceChat] URL deviceId is not numeric, searching device list...');
          targetDevice = deviceList.find(d => 
            d.iotDeviceUuid === urlDeviceId || 
            d.uuid === urlDeviceId || 
            d.routeDeviceUuid === urlDeviceId ||
            d.routeDeviceId === urlDeviceId ||
            d.sn === urlDeviceId
          ) || cached;
          
          // 如果找到设备，提取数字 ID
          if (targetDevice) {
            numericDeviceId = extractNumericDeviceId(targetDevice);
          }
        }
      } else {
        // 没有 URL deviceId，使用缓存设备
        targetDevice = cached;
        numericDeviceId = extractNumericDeviceId(targetDevice);
      }
      
      currentDevice = targetDevice;
      log('[DeviceChat] found device:', currentDevice);
      log('[DeviceChat] numericDeviceId:', numericDeviceId);

      if (!currentDevice) {
        showError('未找到设备，请从设备页进入');
        return;
      }
      
      // 验证数字 deviceId
      if (!numericDeviceId) {
        log('[DeviceChat] numericDeviceId is null, checking device...', currentDevice);
        // 尝试最后从 currentDevice 提取
        numericDeviceId = extractNumericDeviceId(currentDevice);
        if (!numericDeviceId) {
          showError('设备ID异常，请重新进入设备对话');
          return;
        }
      }
      
      log('[DeviceChat] validated numericDeviceId:', numericDeviceId);

      // 显示设备信息
      renderDeviceInfo();
      
      // 初始化运行时状态（设备状态 + 萤火虫服务状态）
      await initRuntimeState(currentDevice);

      // 初始化聊天服务
      window.OpenClawChatService.init(currentDevice);

      // ====== 调试：初始化时查询模型配置 ======
      if (numericDeviceId && runtimeState.openclawOnline) {
        try {
          console.log('[Model] 页面初始化，查询设备模型配置...');
          const modelResponse = await Api.OPENCLAW.listModels(numericDeviceId);
          console.log('[Model] 初始化模型列表响应:', modelResponse);
          
          if (modelResponse && modelResponse.data) {
            const modelData = modelResponse.data;
            console.log('[Model] 初始化模型详细数据:', modelData);
            
            if (modelData.models || modelData.data || modelData.result) {
              console.log('[Model] 初始化可用模型列表:', modelData.models || modelData.data || modelData.result);
            }
          }
        } catch (modelError) {
          console.warn('[Model] 初始化查询模型配置失败:', modelError);
        }
      }
      // =========================================

      // 启动轮询系统（恢复轮询 -> 空闲轮询）
      if (numericDeviceId && runtimeState.openclawOnline) {
        window.OpenClawChatService.startPolling(numericDeviceId, {
          onRecoveryProgress: (count) => {
            console.log('[UI] recovery progress:', count);
          },
          onLifecycleStart: (runId) => {
            console.log('[UI] lifecycle start during idle:', runId);
          },
          onAssistantUpdate: (text) => {
            console.log('[UI] assistant update during idle:', text.slice(0, 50));
          },
          onCommandOutput: (output, info) => {
            console.log('[UI] command output during idle:', info);
          },
          onFinal: (text) => {
            console.log('[UI] final during idle:', text.slice(0, 50));
          },
          onIdle: () => {
            console.log('[UI] now in idle polling mode');
          }
        });
      }
    }

    // 渲染设备信息
    function renderDeviceInfo() {
      const nameEl = document.getElementById('deviceName');
      const dotEl = document.getElementById('statusDot');
      const textEl = document.getElementById('statusText');
      
      if (nameEl) nameEl.textContent = currentDevice?.name || '未知设备';
      
      const isOnline = currentDevice?.isOnline || currentDevice?.status === 'online';
      if (dotEl) {
        dotEl.className = 'status-dot ' + (isOnline ? 'online' : 'offline');
      }
      if (textEl) {
        textEl.textContent = isOnline ? '设备在线' : '设备离线';
      }
    }

    // 快捷指令
    function sendQuickCmd(message) {
      if (isProcessing) return;
      handleSend(message);
    }

    // 更新发送按钮状态
    function updateSendButton(processing) {
      const sendBtn = document.getElementById('sendBtn');
      const chatInput = document.getElementById('chatInput');
      const multiModalBtn = document.getElementById('multiModalBtn');

      if (processing) {
        sendBtn.classList.add('processing');
        sendBtn.disabled = false;  // 可以点击
        chatInput.disabled = true;
        if (multiModalBtn) multiModalBtn.disabled = true;
      } else {
        sendBtn.classList.remove('processing');
        sendBtn.disabled = false;
        chatInput.disabled = false;
        if (multiModalBtn) multiModalBtn.disabled = false;
      }
    }

    // 暂停当前任务
    function handlePause() {
      if (!isProcessing) return;

      console.log('[Pause] stopping current task...');

      // 停止轮询
      window.OpenClawChatService.stopPolling();

      // 更新助手消息状态
      if (currentAssistantMessageId) {
        updateAssistantMessage(currentAssistantMessageId, '已停止回答', { status: 'paused' });
      }

      // 恢复UI状态
      isProcessing = false;
      currentAssistantMessageId = null;
      updateSendButton(false);

      // 添加系统提示
      addSystemNoticeOnce('pause_notice', '已停止当前任务，可以发送新指令。', 'info');
    }

    // 输入框键盘事件（处理快捷键）
    function handleInputKeydown(e) {
      const input = document.getElementById('chatInput');

      // 全选：Ctrl+A (Windows/Linux) 或 Cmd+A (Mac)
      if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
        if (input && input.value.length > 0) {
          e.preventDefault();
          input.select();
        }
        return;
      }

      // 发送消息：Enter（不按Shift）
      if (e.key === 'Enter' && !e.shiftKey && !isProcessing) {
        e.preventDefault();
        handleSend();
        return;
      }

      // Shift+Enter 换行：不需要特殊处理，浏览器默认行为即可
    }

    // 回车发送（保留向后兼容）
    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey && !isProcessing) {
        e.preventDefault();
        handleSend();
      }
    }

    // 多模态功能：切换菜单
    function toggleMultiModalMenu() {
      const menu = document.getElementById('multiModalMenu');
      if (menu.classList.contains('active')) {
        menu.classList.remove('active');
      } else {
        menu.classList.add('active');
      }
    }

    // 点击其他地方关闭菜单
    document.addEventListener('click', function(e) {
      const menu = document.getElementById('multiModalMenu');
      const btn = document.getElementById('multiModalBtn');
      if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.remove('active');
      }
    });

    // 选择图片
    function selectImage() {
      document.getElementById('imageUpload').click();
      toggleMultiModalMenu();
    }

    // 处理图片上传
    async function handleImageUpload(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      for (const file of files) {
        // 检查文件类型
        if (!file.type.startsWith('image/')) {
          alert('请选择图片文件');
          continue;
        }

        // 检查文件大小（最大5MB）
        if (file.size > 5 * 1024 * 1024) {
          alert('图片大小不能超过5MB');
          continue;
        }

        try {
          // 转成base64
          const base64 = await fileToBase64(file);

          // 保存到全局变量
          window.currentImages = window.currentImages || [];
          window.currentImages.push({
            base64: base64,
            name: file.name
          });

        } catch (error) {
          console.error('图片处理失败:', error);
          alert('图片处理失败，请重试');
        }
      }

      // 更新暂存区显示
      updateImageStaging();

      // 清空文件选择器
      event.target.value = '';
    }

    // 更新图片暂存区显示
    function updateImageStaging() {
      let stagingArea = document.getElementById('imageStagingArea');
      if (!stagingArea) {
        // 如果暂存区不存在，创建它
        const inputArea = document.querySelector('.input-area');
        stagingArea = document.createElement('div');
        stagingArea.id = 'imageStagingArea';
        stagingArea.className = 'image-staging-area';
        inputArea.parentNode.insertBefore(stagingArea, inputArea);
      }

      const images = window.currentImages || [];

      if (images.length === 0) {
        stagingArea.style.display = 'none';
        return;
      }

      stagingArea.style.display = 'flex';

      let html = '';
      images.forEach((img, index) => {
        html += `
          <div class="staged-image" style="position:relative;display:inline-block;margin:4px;">
            <img src="data:image/png;base64,${img.base64}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">
            <button onclick="removeStagedImage(${index})" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:none;background:#ff4444;color:white;font-size:12px;cursor:pointer;line-height:1;">×</button>
          </div>
        `;
      });

      stagingArea.innerHTML = html;
    }

    // 移除暂存图片
    function removeStagedImage(index) {
      if (window.currentImages) {
        window.currentImages.splice(index, 1);
        updateImageStaging();
      }
    }

    // 文件转base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 显示图片预览
    function showImagePreview(src) {
      const modal = document.getElementById('imagePreviewModal');
      const img = document.getElementById('previewImage');
      img.src = src;
      modal.classList.add('active');
    }

    // 关闭图片预览
    function closeImagePreview(event) {
      if (event && event.target.className === 'close-btn') return;
      const modal = document.getElementById('imagePreviewModal');
      modal.classList.remove('active');
    }

    // 渲染消息中的图片
    function renderImages(images) {
      if (!images || images.length === 0) return '';

      const count = images.length;
      let gridClass = 'single';
      if (count === 2) gridClass = 'double';
      else if (count >= 3) gridClass = 'multiple';

      const imagesHtml = images.map(img =>
        `<img src="data:image/png;base64,${img}" onclick="showImagePreview(this.src)" alt="图片" style="cursor:pointer;">`
      ).join('');

      return `<div class="message-images ${gridClass}">${imagesHtml}</div>`;
    }

    // 发送消息
    async function handleSend(customMessage = null) {
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const message = (customMessage || input.value || '').trim();

      if (!message || isProcessing) return;
      if (!currentDevice) {
        showError('未绑定设备');
        return;
      }

      const deviceUuid = window.OpenClawChatService.resolveDeviceUuid(currentDevice);
      if (!deviceUuid) {
        showError('当前设备缺少 iotDeviceUuid / uuid，暂无法连接萤火虫');
        return;
      }

      // 状态拦截
      if (!runtimeState.deviceOnline) {
        addSystemNoticeOnce('device_offline_notice', '设备离线，无法发送指令。请检查设备网络或电源。', 'error');
        return;
      }

      if (!runtimeState.openclawOnline) {
        addSystemNoticeOnce('openclaw_offline_notice', '设备在线，但萤火虫服务未启动。请先重新检测或启动服务。', 'warning');
        return;
      }

      const turnId = 'turn_' + Date.now();
      console.log('[Turn]', turnId, 'sending:', message);

      isProcessing = true;
      updateSendButton(true);  // 更新按钮状态为处理中

      // ====== 调试：打印设备模型配置信息 ======
      try {
        const numericDeviceId = window.OpenClawChatService.resolveDeviceId(currentDevice);
        console.log('[Device] 当前设备:', {
          id: currentDevice.id,
          name: currentDevice.name,
          numericDeviceId: numericDeviceId
        });

        // 尝试获取模型列表
        if (numericDeviceId) {
          console.log('[Model] 正在查询设备模型配置...');
          const modelResponse = await Api.OPENCLAW.listModels(numericDeviceId);
          console.log('[Model] 模型列表响应:', modelResponse);

          // 尝试解析模型数据
          if (modelResponse && modelResponse.data) {
            const modelData = modelResponse.data;
            console.log('[Model] 模型详细数据:', modelData);
            
            // 如果有模型信息，更详细地打印
            if (modelData.models || modelData.data || modelData.result) {
              console.log('[Model] 可用模型列表:', modelData.models || modelData.data || modelData.result);
            }
          }
        }
      } catch (modelError) {
        console.warn('[Model] 查询模型配置失败:', modelError);
        // 不中断正常流程
      }
      // =========================================

      // 检查是否有图片
      const hasImages = window.currentImages && window.currentImages.length > 0;
      const images = hasImages ? window.currentImages.map(img => img.base64) : [];

      addUserMessage(message, hasImages ? images : []);
      input.value = '';

      // 清空图片暂存区
      if (hasImages) {
        window.currentImages = [];
        updateImageStaging();
      }

      // 创建助手消息气泡
      currentAssistantMessageId = addAssistantMessage('正在发送指令...', {
        status: 'loading',
        turnId: turnId
      });

      let commandCardId = null;

      const updateCurrentAssistant = (text, options = {}) => {
        updateAssistantMessage(currentAssistantMessageId, text, options);
      };

      const addCommandCard = (output, index) => {
        const container = document.getElementById('chatContainer');
        const card = document.createElement('div');
        card.className = 'chat-card command-output';

        const header = document.createElement('div');
        header.className = 'card-header';
        header.textContent = '执行结果 #' + (index + 1);

        const body = document.createElement('div');
        body.className = 'card-body';

        const pre = document.createElement('pre');
        pre.className = 'command-output-text';
        pre.textContent = output.length > 500 ? output.substring(0, 500) + '...' : output;

        body.appendChild(pre);

        if (output.length > 500) {
          const toggle = document.createElement('button');
          toggle.className = 'card-toggle';
          toggle.textContent = '点击展开全部';
          toggle.onclick = () => {
            pre.textContent = pre.textContent.includes('...') ? output : output.substring(0, 500) + '...';
            toggle.textContent = pre.textContent.includes('...') ? '点击收起' : '点击展开全部';
          };
          body.appendChild(toggle);
        }

        card.appendChild(header);
        card.appendChild(body);
        container.appendChild(card);
        scrollToBottom();

        return card.id;
      };

      try {
        const response = await window.OpenClawChatService.sendMessageAndWait(currentDevice, message, {
          // Lifecycle 事件
          onLifecycleStart: (runId, data) => {
            console.log('[UI] lifecycle start:', runId);
            updateCurrentAssistant('萤火虫正在分析问题...', { status: 'loading' });
          },

          onLifecycleEnd: (data) => {
            console.log('[UI] lifecycle end');
          },

          // Assistant 更新
          onAssistantUpdate: (text) => {
            console.log('[UI] assistant update, len:', text.length);
            updateCurrentAssistant(text, { status: 'streaming' });
          },

          // 命令输出
          onCommandOutput: (output, info) => {
            console.log('[UI] command output:', info);
            if (!commandCardId) {
              commandCardId = addCommandCard(output, info.index);
            }
          },

          // Final 完成
          onFinal: (text, extra) => {
            console.log('[UI] final:', text.slice(0, 100));
            updateCurrentAssistant(text, { status: 'done', final: true });
          },

          // 警告提示
          onWarning: (msg) => {
            console.log('[UI] warning:', msg);
            updateCurrentAssistant(msg, { status: 'loading' });
          },

          // 进入空闲状态
          onIdle: () => {
            console.log('[UI] idle polling');
          }
        }, images);

        // 处理返回结果
        if (response?.success && response?.text) {
          updateCurrentAssistant(response.text, { status: 'done', final: response.isFinal });

          if (response.warning && !response.isFinal) {
            const bubble = document.querySelector(`[data-message-id="${assistantMessageId}"]`);
            if (bubble) {
              bubble.classList.add('warning');
              const warn = document.createElement('div');
              warn.className = 'chat-warning';
              warn.textContent = response.warning;
              bubble.appendChild(warn);
            }
          }

          if (response.commandOutputs?.length > 0 && !commandCardId) {
            response.commandOutputs.forEach((cmd, idx) => {
              addCommandCard(cmd.text, idx);
            });
          }
        } else if (!response?.success) {
          updateCurrentAssistant(response?.msg || '通信失败', { status: 'error' });
        } else {
          updateCurrentAssistant('暂未返回可读结果，请稍后重试。', { status: 'error' });
        }

      } catch (error) {
        console.error('[Turn] error:', error);
        updateCurrentAssistant(error.message || '通信失败', { status: 'error' });
      } finally {
        updateSendButton(false);  // 恢复按钮状态
        isProcessing = false;
        currentAssistantMessageId = null;
        input.focus();
      }
    }

    // 重新生成消息
    async function regenerateMessage(messageId) {
      console.log('[Regenerate] regenerating message:', messageId);
      
      // 找到对应的助手消息元素
      const messageEl = document.querySelector(`[data-message-id="${messageId}"]`);
      if (!messageEl) {
        console.error('[Regenerate] message not found:', messageId);
        return;
      }
      
      // 获取当前消息内容（用于重新发送相同问题）
      const contentEl = messageEl.querySelector('.message-content');
      if (!contentEl) return;
      
      // 获取上一条用户消息
      const messages = document.querySelectorAll('.chat-message');
      let userMessage = '';
      let found = false;
      
      for (let i = messages.length - 1; i >= 0; i--) {
        if (messages[i].dataset.messageId === messageId) {
          found = true;
        } else if (found && messages[i].classList.contains('user')) {
          userMessage = messages[i].textContent || '';
          break;
        }
      }
      
      if (!userMessage) {
        console.error('[Regenerate] user message not found');
        return;
      }
      
      // 更新消息状态为重新生成中
      updateAssistantMessage(messageId, '重新生成中...', { status: 'loading' });
      
      // 发送消息
      await handleSend(userMessage);
    }

    // 复制消息内容
    async function copyMessage(messageId, message) {
      console.log('[Copy] copying message:', messageId);
      
      try {
        // 复制到剪贴板
        await navigator.clipboard.writeText(message);
        
        // 显示复制成功提示
        showCopySuccess(messageId);
      } catch (err) {
        console.error('[Copy] failed:', err);
        
        // 降级方案：创建临时文本区域
        const textarea = document.createElement('textarea');
        textarea.value = message;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        
        try {
          document.execCommand('copy');
          showCopySuccess(messageId);
        } catch (e) {
          console.error('[Copy] fallback failed:', e);
        } finally {
          document.body.removeChild(textarea);
        }
      }
    }
    
    // 显示复制成功提示
    function showCopySuccess(messageId) {
      const msg = document.querySelector(`[data-message-id="${messageId}"]`);
      if (msg) {
        const toast = document.createElement('div');
        toast.className = 'copy-toast';
        toast.textContent = '已复制';
        msg.parentNode.appendChild(toast);
        
        setTimeout(() => {
          if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 2000);
      }
    }

    // 引用功能 - 直接插入到输入框
    function showQuoteSelector(messageId, message) {
      console.log('[Quote] inserting quote:', messageId);
      
      const input = document.getElementById('chatInput');
      if (input) {
        // 直接插入引用格式
        input.value = `> ${message.trim()}\n\n`;
        input.focus();
        // 自动调整输入框高度
        autoResizeInput(input);
      }
    }
    
    // 自动调整输入框高度
    function autoResizeInput(textarea) {
      textarea.style.height = 'auto';
      const maxHeight = 200; // 最大高度限制
      const scrollHeight = textarea.scrollHeight;
      textarea.style.height = Math.min(scrollHeight, maxHeight) + 'px';
    }

    // 添加用户消息
    function addUserMessage(message, images = []) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message user';

      // 如果有图片，先渲染图片
      let content = '';
      if (images && images.length > 0) {
        content += renderImages(images);
      }
      content += escapeHtml(message);

      div.innerHTML = content;
      container.appendChild(div);
      scrollToBottom();
    }

    // 渲染消息内容（支持 Markdown）
    function renderMessageContent(text) {
      if (typeof renderAssistantMarkdown === 'function') {
        return renderAssistantMarkdown(text);
      }
      return text;
    }

    // 添加助手消息（带 data-message-id）
    function addAssistantMessage(message, options = {}) {
      const container = document.getElementById('chatContainer');
      const id = options.id || `assistant_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      
      const div = document.createElement('div');
      div.className = 'chat-message assistant';
      div.dataset.messageId = id;
      div.dataset.turnId = options.turnId || '';
      
      if (options.isError) {
        div.classList.add('error');
      }
      
      if (options.warning) {
        div.classList.add('warning');
      }
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.innerHTML = renderMessageContent(message);
      div.appendChild(contentDiv);
      
      // 创建消息包装容器（包含气泡和操作按钮）
      const wrapperDiv = document.createElement('div');
      wrapperDiv.className = 'message-wrapper';
      
      // 先添加气泡
      wrapperDiv.appendChild(div);
      
      // 添加操作按钮（在气泡下面，右侧）
      if (!options.isError && message && message.length > 0) {
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'message-actions';
        
        // 重新生成按钮
        const regenerateBtn = document.createElement('button');
        regenerateBtn.className = 'message-action-btn';
        regenerateBtn.title = '重新生成';
        regenerateBtn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        `;
        regenerateBtn.onclick = () => regenerateMessage(id);
        actionsDiv.appendChild(regenerateBtn);
        
        // 复制按钮
        const copyBtn = document.createElement('button');
        copyBtn.className = 'message-action-btn';
        copyBtn.title = '复制';
        copyBtn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        `;
        copyBtn.onclick = () => copyMessage(id, message);
        actionsDiv.appendChild(copyBtn);
        
        // 引用按钮（气泡消息图标）
        const quoteBtn = document.createElement('button');
        quoteBtn.className = 'message-action-btn';
        quoteBtn.title = '引用';
        quoteBtn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        `;
        quoteBtn.onclick = () => showQuoteSelector(id, message);
        actionsDiv.appendChild(quoteBtn);
        
        wrapperDiv.appendChild(actionsDiv);
      }
      
      if (options.warning) {
        const warningDiv = document.createElement('div');
        warningDiv.className = 'chat-warning';
        warningDiv.textContent = options.warning;
        div.appendChild(warningDiv);
      }
      
      container.appendChild(wrapperDiv);
      scrollToBottom();
      
      console.log('[UIRender] addAssistantMessage', { id, textPreview: String(message).slice(0, 50) });
      return id;
    }

    // 更新助手消息内容
    function updateAssistantMessage(messageId, text, options = {}) {
      const el = document.querySelector(`[data-message-id="${messageId}"]`);
      
      if (!el) {
        console.error('[UIRender] assistant message not found:', messageId);
        return false;
      }
      
      const contentEl = 
        el.querySelector('.message-content') || 
        el.querySelector('.bubble-content') || 
        el.querySelector('.assistant-content') ||
        el;
      
      contentEl.innerHTML = renderMessageContent(text);
      
      el.classList.remove('loading', 'streaming', 'error', 'warning', 'paused');
      if (options.status) {
        el.classList.add(options.status);
      }
      
      console.log('[UIRender] updateAssistantMessage', { 
        messageId, 
        textPreview: String(text).slice(0, 80),
        status: options.status 
      });
      
      scrollToBottom();
      return true;
    }

    // 添加助手气泡（可更新的，兼容旧接口）
    function addAssistantBubble(message, status = null) {
      const container = document.getElementById('chatContainer');
      const id = `bubble_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      
      const div = document.createElement('div');
      div.className = 'chat-message assistant';
      div.dataset.messageId = id;
      
      if (status) {
        div.classList.add(status);
      }
      
      const bubbleContent = document.createElement('div');
      bubbleContent.className = 'bubble-content';
      bubbleContent.textContent = message;
      div.appendChild(bubbleContent);
      
      if (status) {
        const bubbleStatus = document.createElement('div');
        bubbleStatus.className = 'bubble-status';
        bubbleStatus.textContent = status;
        div.appendChild(bubbleStatus);
      }
      
      container.appendChild(div);
      scrollToBottom();
      
      console.log('[UIRender] addAssistantBubble', { id, status, textPreview: String(message).slice(0, 50) });
      return id;
    }

    // 添加loading消息
    function addLoadingMessage(message) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message assistant loading typing';
      div.id = 'loading-' + Date.now();
      div.textContent = message;
      container.appendChild(div);
      scrollToBottom();
      return div.id;
    }

    // 显示错误
    function showError(message) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message error';
      div.textContent = message;
      container.appendChild(div);
      scrollToBottom();
    }

    function addSystemNoticeOnce(id, text, type = 'warning') {
      if (document.querySelector(`[data-notice-id="${id}"]`)) return;

      const container = document.getElementById('chatContainer');
      const notice = document.createElement('div');
      notice.className = `chat-message system-notice ${type}`;
      notice.dataset.noticeId = id;
      notice.textContent = text;
      container.appendChild(notice);
      scrollToBottom();
    }

    function clearSystemNotice(id) {
      const notice = document.querySelector(`[data-notice-id="${id}"]`);
      if (notice) notice.remove();
    }

    // 移除消息
    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    // 切换原始JSON显示
    function toggleRaw(el) {
      const parent = el.parentElement;
      const raw = parent.dataset.raw;
      if (raw) {
        if (el.textContent.includes('展开')) {
          el.textContent = '▲ 收起原始JSON';
          const rawDiv = document.createElement('div');
          rawDiv.className = 'chat-raw';
          rawDiv.textContent = raw;
          parent.appendChild(rawDiv);
        } else {
          el.textContent = '▼ 点击展开原始JSON';
          const rawDiv = parent.querySelector('.chat-raw');
          if (rawDiv) rawDiv.remove();
        }
      }
    }

    // 滚动到底部
    function scrollToBottom() {
      const container = document.getElementById('chatContainer');
      container.scrollTop = container.scrollHeight;
    }

    // 页面加载完成
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
