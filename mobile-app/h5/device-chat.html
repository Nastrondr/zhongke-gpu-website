<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小龙虾设备对话</title>
  <link rel="stylesheet" href="css/theme-variables.css">
  <style>
    /* 薄层兼容映射 - 使用全局变量并保留聊天特有颜色 */
    :root {
      /* 聊天气泡颜色 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #334155;
      --border-card: var(--border-primary);
    }
    html[data-theme="light"] {
      /* 聊天气泡 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #EEF2F7;
      --border-card: var(--border-primary);
      /* 保留功能色 */
      --accent-green: var(--success);
    }
    html[data-theme="dark"] {
      /* 聊天气泡 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #1E293B;
      --border-card: var(--border-primary);
      /* 保留功能色 */
      --accent-green: var(--success);
    }
    
    /* 深色模式覆盖 */
    html[data-theme="dark"] body {
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    html[data-theme="dark"] .header {
      background: #111827;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .header-title {
      color: #F8FAFC;
    }
    html[data-theme="dark"] .header-back {
      color: #CBD5E1;
    }
    html[data-theme="dark"] .device-info {
      background: #141E2F;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .device-name {
      color: #F8FAFC;
      font-weight: 700;
    }
    html[data-theme="dark"] .device-uuid {
      color: #94A3B8;
    }
    html[data-theme="dark"] .device-status {
      color: #94A3B8;
    }
    html[data-theme="dark"] .status-dot.online {
      background: #10B981;
    }
    html[data-theme="dark"] .status-dot.offline {
      background: #64748B;
    }
    html[data-theme="dark"] .header-status {
      background: rgba(16, 185, 129, 0.16);
      color: #34D399;
    }
    html[data-theme="dark"] .device-reconnect-btn {
      background: rgba(59, 130, 246, 0.10);
      border: 1px solid rgba(96, 165, 250, 0.16);
      color: #60A5FA;
    }
    html[data-theme="dark"] .quick-cmd {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.14);
      color: #CBD5E1;
    }
    html[data-theme="dark"] .quick-cmd svg {
      stroke: #94A3B8;
    }
    html[data-theme="dark"] .quick-cmd[style*="color: var(--success)"] { 
      background: rgba(16, 185, 129, 0.10);
      border: 1px solid rgba(16, 185, 129, 0.18);
      color: #34D399;
    }
    html[data-theme="dark"] .quick-cmd[style*="color: var(--success)"] svg {
      stroke: #34D399;
    }
    html[data-theme="dark"] .welcome-bubble {
      background: #1E293B;
      border: 1px solid rgba(148, 163, 184, 0.10);
      color: #F8FAFC;
    }
    html[data-theme="dark"] .chat-message.assistant {
      background: #1E293B;
      border: 1px solid rgba(148, 163, 184, 0.10);
      color: #F8FAFC;
    }
    html[data-theme="dark"] .chat-message.user {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: #FFFFFF;
    }
    html[data-theme="dark"] .input-area {
      background: #111827;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .chat-input {
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .chat-input::placeholder {
      color: #64748B;
    }
    html[data-theme="dark"] .chat-input:focus {
      border-color: rgba(59, 130, 246, 0.4);
    }
    html[data-theme="dark"] .send-btn {
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }
    html[data-theme="dark"] .send-btn svg {
      stroke: #FFFFFF !important;
    }
    html[data-theme="dark"] .device-avatar {
      background: rgba(59, 130, 246, 0.16);
    }
    html[data-theme="dark"] .device-avatar svg {
      stroke: #60A5FA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    .header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-card);
    }
    .header-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 14px;
    }
    .header-back svg { width: 20px; height: 20px; }
    .header-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
    }

    .header-status {
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
    }
    .header-status.offline { background: rgba(100, 116, 139, 0.12); color: #64748B; }
    .header-status.error { background: rgba(239, 68, 68, 0.12); color: #DC2626; }

    /* 设备信息 */
    .device-info {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: #FFFFFF;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }
    .device-avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
    }
    .device-detail { flex: 1; }
    .device-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .device-status {
      font-size: 13px;
      color: #64748B;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.online { background: #10B981; }
    .status-dot.offline { background: #94A3B8; }
    
    .device-reconnect-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.08);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .device-reconnect-btn:hover {
      background: rgba(59, 130, 246, 0.15);
    }
    .device-reconnect-btn:active {
      transform: scale(0.95);
    }
    .device-reconnect-btn svg {
      stroke: #3B82F6;
    }

    /* 聊天区域 */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .chat-message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }
    .chat-message.assistant {
      align-self: flex-start;
      background: #EEF2F7;
      color: #1E293B;
      border-bottom-left-radius: 4px;
    }
    .chat-message.loading {
      color: var(--text-secondary);
      font-style: italic;
    }
    .chat-message.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }

    /* Markdown 渲染样式 */
    .chat-message strong {
      font-weight: 700;
      color: inherit;
    }
    .chat-message code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92em;
      background: rgba(255,255,255,0.08);
      padding: 2px 5px;
      border-radius: 5px;
    }
    .chat-message br {
      display: block;
      content: "";
      line-height: 1.7;
    }

    .chat-raw {
      margin-top: 8px;
      padding: 8px;
      background: var(--bg-card);
      border-radius: 8px;
      font-size: 11px;
      color: var(--text-tertiary);
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
    }
    .chat-raw-toggle {
      font-size: 11px;
      color: var(--text-tertiary);
      cursor: pointer;
      margin-top: 4px;
    }

    /* 快捷指令 */
    .quick-commands {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-card);
    }
    .quick-cmd {
      padding: 8px 14px;
      background: #F1F5F9;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .quick-cmd:hover { background: rgba(59, 130, 246, 0.08); }
    .quick-cmd:active { background: rgba(59, 130, 246, 0.12); transform: scale(0.98); }
    .quick-cmd svg { stroke: #64748B; }
    .quick-cmd:hover svg { stroke: #3B82F6; }
    .quick-cmd[style*="color: var(--success)"] { 
      color: #059669; 
      background: rgba(16, 185, 129, 0.08);
    }
    .quick-cmd[style*="color: var(--success)"] svg { stroke: #059669; }

    /* 输入区域 */
    .input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(398px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      background: rgba(248, 250, 252, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(148, 163, 184, 0.14);
    }
    .chat-input {
      flex: 1;
      height: 48px;
      padding: 0 18px;
      background: #EEF3F8;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 15px;
      color: #1E293B;
      outline: none;
      transition: all 0.2s ease;
    }
    .chat-input:focus {
      background: #FFFFFF;
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
    }
    .chat-input::placeholder { color: #94A3B8; font-size: 15px; }
    .send-btn {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
      transition: all 0.2s ease;
      padding: 0;
      overflow: hidden;
    }
    .send-btn:disabled {
      opacity: 0.55;
      box-shadow: none;
      cursor: not-allowed;
    }
    .send-btn:not(:disabled):active {
      transform: scale(0.95);
    }
    .send-btn svg {
      width: 22px;
      height: 22px;
      stroke: #FFFFFF !important;
      fill: none !important;
      stroke-width: 1.9 !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
      display: block;
    }

    /* 加载动画 */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .typing { animation: pulse 1.5s infinite; }
  </style>
</head>

<body>
  <!-- 顶部 -->
  <div class="header">
    <a href="/h5/device.html" class="header-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      返回
    </a>
    <div class="header-title">设备对话</div>
    <div class="header-status" id="serviceStatus">服务正常</div>
  </div>

  <!-- 设备信息 -->
  <div class="device-info">
    <div class="device-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <circle cx="15.5" cy="8.5" r="1.5"/>
        <circle cx="8.5" cy="15.5" r="1.5"/>
        <circle cx="15.5" cy="15.5" r="1.5"/>
      </svg>
    </div>
    <div class="device-detail">
      <div class="device-name" id="deviceName">加载中...</div>
      <div class="device-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">检查中...</span>
      </div>
    </div>
    <button class="device-reconnect-btn" onclick="handleAction('重新连接', '正在重新连接...')" title="重新连接">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    </button>
  </div>

  <!-- 快捷指令 -->
  <div class="quick-commands">
    <button class="quick-cmd" onclick="sendQuickCmd('状态查询')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      查状态
    </button>
    <button class="quick-cmd" id="testCmd" onclick="sendQuickCmd('1+1=?')" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      测试
    </button>
    <button class="quick-cmd" onclick="sendQuickCmd('你好')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 11a6 6 0 0 0-9.93-4.93M18 8v6M15 8h.01M10 21V5"/></svg>
      打招呼
    </button>
    <button class="quick-cmd" onclick="startNewSession()" style="color: var(--success);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      新会话
    </button>
  </div>

  <!-- 聊天容器 -->
  <div class="chat-container" id="chatContainer"></div>

  <!-- 输入框 -->
  <div class="input-area">
    <input type="text" class="chat-input" id="chatInput" placeholder="输入设备指令或任务..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" id="sendBtn" onclick="handleSend()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <!-- 依赖脚本 -->
  <script src="/h5/js/utils/storage.js"></script>
  <script src="/h5/js/services/themeService.js"></script>
  <script src="/h5/js/utils/navigation.js"></script>
  <script src="/h5/js/utils/toast.js"></script>
  <script src="/h5/js/services/api/config.js"></script>
  <script src="/h5/js/services/api/ApiClient.js"></script>
  <script src="/h5/js/services/api/endpoints.js"></script>
  <script src="/h5/js/services/api/index.js"></script>
  <script src="/h5/js/services/deviceService.js"></script>
  <script src="/h5/js/services/openclawChatService.js"></script>

  <script>
    const log = console.log;
    let currentDevice = null;
    let isProcessing = false;
    let currentSessionKey = 'agent:main:mobile-cn';  // 当前会话 sessionKey
    
    // 区分设备状态和小龙虾状态
    const runtimeState = {
      deviceOnline: false,
      deviceStatusText: '设备状态未知',
      
      openclawOnline: false,
      openclawStatusText: '检测中',
      
      canChat: false
    };
    
    // 更新状态显示
    function updateStatusDisplay() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      
      if (statusDot && statusText) {
        // 右上角显示小龙虾服务状态
        statusDot.className = 'status-dot ' + (runtimeState.openclawOnline ? 'online' : 'offline');
        statusText.textContent = runtimeState.openclawOnline ? '服务正常' : '服务未启动';
      }
      
      // 更新设备状态显示
      const deviceStatusDot = document.getElementById('deviceStatusDot');
      const deviceStatusText = document.getElementById('deviceStatusText');
      
      if (deviceStatusDot && deviceStatusText) {
        deviceStatusDot.className = 'status-dot ' + (runtimeState.deviceOnline ? 'online' : 'offline');
        deviceStatusText.textContent = runtimeState.deviceStatusText;
      }
    }
    
    // 查询小龙虾服务状态
    async function checkOpenclawStatus(deviceId) {
      try {
        const result = await window.OpenClawChatService.queryOpenClawStatus(deviceId);
        runtimeState.openclawOnline = result.wasLive;
        runtimeState.openclawStatusText = result.error 
          ? '检测失败' 
          : (result.wasLive ? '在线' : '离线');
        console.log('[StateDebug] openclawOnline wasLive:', result.wasLive);
      } catch (e) {
        runtimeState.openclawOnline = false;
        runtimeState.openclawStatusText = '检测失败';
        console.error('[StateDebug] openclaw status check failed:', e);
      }
      
      runtimeState.canChat = runtimeState.openclawOnline;
      updateStatusDisplay();
    }
    
    // 初始化运行时状态
    async function initRuntimeState(device) {
      if (!device) return;
      
      // 设备状态
      const status = String(device?.status || '').toLowerCase();
      const manageState = String(device?.manageState || '').toLowerCase();
      runtimeState.deviceOnline = ['online', 'running', 'active'].includes(status) || 
                           ['online', 'running', 'active'].includes(manageState);
      runtimeState.deviceStatusText = runtimeState.deviceOnline ? '设备在线' : '设备离线';
      
      console.log('[StateDebug] deviceOnline:', runtimeState.deviceOnline, device?.status, device?.manageState);
      
      // 小龙虾服务状态
      const deviceUuid = window.OpenClawChatService.resolveDeviceUuid(device);
      if (deviceUuid) {
        await checkOpenclawStatus(deviceUuid);
      }
    }
    
    // DEBUG 模式下显示测试按钮
    if (typeof DEBUG_OPENCLAW !== 'undefined' && DEBUG_OPENCLAW) {
      const testBtn = document.getElementById('testCmd');
      if (testBtn) testBtn.style.display = 'block';
    }

    // 新建会话
    function startNewSession() {
      // 生成新的 sessionKey
      currentSessionKey = 'agent:main:mobile:' + Date.now();
      console.log('[OpenClaw] new session:', currentSessionKey);
      
      // 清空聊天记录
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';
      
      // 显示欢迎语
      addAssistantMessage('小龙虾已开启新会话，请发送新的指令。');
    }

    // 安全转义 HTML
    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 渲染 assistant 消息的 Markdown
    function renderAssistantMarkdown(text) {
      const escaped = escapeHtml(text);
      return escaped
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^\s*[-*]\s+(.+)$/gm, '• $1')
        .replace(/\n/g, '<br>');
    }

    // 从URL获取deviceId
    function getDeviceIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('deviceId');
    }

    // 初始化
    async function init() {
      // 初始化主题
      ThemeManager.init();
      
      const deviceId = getDeviceIdFromUrl();
      log('[DeviceChat] init, deviceId:', deviceId);

      // 从存储获取设备列表
      const deviceList = Storage.Device.getDeviceList() || [];
      const cached = Storage.Device.getCurrentDevice();
      log('[DeviceChat] deviceList:', deviceList);
      log('[DeviceChat] cached:', cached);
      
      // 根据 deviceId 查找设备（兼容字符串和数字比较）
      if (deviceId) {
        // 将 deviceId 转为数字比较
        const targetId = parseInt(deviceId, 10);
        currentDevice = deviceList.find(d => d.id === targetId || d.deviceId === deviceId || String(d.id) === deviceId) || cached;
        log('[DeviceChat] found device:', currentDevice);
      } else {
        currentDevice = cached;
      }

      if (!currentDevice) {
        showError('未找到设备，请从设备页进入');
        return;
      }

      // 显示设备信息
      renderDeviceInfo();
      
      // 初始化运行时状态（设备状态 + 小龙虾服务状态）
      await initRuntimeState(currentDevice);
      
      // 初始化聊天服务
      window.OpenClawChatService.init(currentDevice);
      
      // 添加欢迎消息
      addAssistantMessage('小龙虾已就绪，可以帮你查询设备状态、执行任务或处理资料。');
    }

    // 渲染设备信息
    function renderDeviceInfo() {
      const nameEl = document.getElementById('deviceName');
      const dotEl = document.getElementById('statusDot');
      const textEl = document.getElementById('statusText');
      
      if (nameEl) nameEl.textContent = currentDevice?.name || '未知设备';
      
      const isOnline = currentDevice?.isOnline || currentDevice?.status === 'online';
      if (dotEl) {
        dotEl.className = 'status-dot ' + (isOnline ? 'online' : 'offline');
      }
      if (textEl) {
        textEl.textContent = isOnline ? '设备在线' : '设备离线';
      }
    }

    // 快捷指令
    function sendQuickCmd(message) {
      if (isProcessing) return;
      handleSend(message);
    }

    // 回车发送
    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    }

    // 发送消息
    async function handleSend(customMessage = null) {
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const message = (customMessage || input.value || '').trim();
      
      if (!message || isProcessing) return;
      if (!currentDevice) {
        showError('未绑定设备');
        return;
      }

      // 检查 deviceUuid
      const deviceUuid = window.OpenClawChatService.resolveDeviceUuid(currentDevice);
      if (!deviceUuid) {
        showError('当前设备缺少 iotDeviceUuid / uuid，暂无法连接小龙虾');
        return;
      }

      // 检查小龙虾服务状态（使用wasLive判断）
      if (!runtimeState.openclawOnline) {
        showError('小龙虾服务未在线，请先重新检测');
        return;
      }

      // 禁用输入
      isProcessing = true;
      input.disabled = true;
      sendBtn.disabled = true;

      // 添加用户消息
      addUserMessage(message);
      input.value = '';

      // 添加loading
      const loadingId = addLoadingMessage('小龙虾正在处理...');

      try {
        // 发送消息
        const response = await window.OpenClawChatService.sendMessageAndWait(currentDevice, message);
        
        // 移除loading
        removeMessage(loadingId);
        
        // 显示响应
        if (response.success) {
          if (response.data) {
            addAssistantMessage(response.data);
          } else if (response.msg) {
            if (response.timeout) {
              // 超时但有消息
              addAssistantMessage(response.msg);
            } else {
              addAssistantMessage(response.msg);
            }
          }
        } else {
          showError(response.msg || '通信失败');
        }
      } catch (error) {
        removeMessage(loadingId);
        showError(error.message || '通信失败');
      }

      // 恢复输入
      input.disabled = false;
      sendBtn.disabled = false;
      isProcessing = false;
      input.focus();
    }

    // 添加用户消息
    function addUserMessage(message) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message user';
      div.textContent = message;
      container.appendChild(div);
      scrollToBottom();
    }

    // 添加助手消息
    function addAssistantMessage(message, rawJson = null) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message assistant';
      
      if (rawJson) {
        // 显示原始JSON
        div.innerHTML = message + '<div class="chat-raw-toggle" onclick="toggleRaw(this)">▼ 点击展开原始JSON</div>';
        div.dataset.raw = rawJson;
      } else {
        div.innerHTML = renderAssistantMarkdown(message);
      }
      
      container.appendChild(div);
      scrollToBottom();
    }

    // 添加loading消息
    function addLoadingMessage(message) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message assistant loading typing';
      div.id = 'loading-' + Date.now();
      div.textContent = message;
      container.appendChild(div);
      scrollToBottom();
      return div.id;
    }

    // 显示错误
    function showError(message) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message error';
      div.textContent = message;
      container.appendChild(div);
      scrollToBottom();
    }

    // 移除消息
    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    // 切换原始JSON显示
    function toggleRaw(el) {
      const parent = el.parentElement;
      const raw = parent.dataset.raw;
      if (raw) {
        if (el.textContent.includes('展开')) {
          el.textContent = '▲ 收起原始JSON';
          const rawDiv = document.createElement('div');
          rawDiv.className = 'chat-raw';
          rawDiv.textContent = raw;
          parent.appendChild(rawDiv);
        } else {
          el.textContent = '▼ 点击展开原始JSON';
          const rawDiv = parent.querySelector('.chat-raw');
          if (rawDiv) rawDiv.remove();
        }
      }
    }

    // 滚动到底部
    function scrollToBottom() {
      const container = document.getElementById('chatContainer');
      container.scrollTop = container.scrollHeight;
    }

    // 页面加载完成
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
