<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小龙虾设备对话</title>
  <link rel="icon" type="image/png" href="./apple-touch-icon2.png">
  <link rel="shortcut icon" type="image/png" href="./apple-touch-icon2.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon2.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon2.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="数字大脑">
  <meta name="application-name" content="数字大脑">
  <link rel="stylesheet" href="css/theme-variables.css">
  <style>
    /* 薄层兼容映射 - 使用全局变量并保留聊天特有颜色 */
    :root {
      /* 聊天气泡颜色 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #334155;
      --border-card: var(--border-primary);
    }
    html[data-theme="light"] {
      /* 聊天气泡 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #EEF2F7;
      --border-card: var(--border-primary);
      /* 保留功能色 */
      --accent-green: var(--success);
    }
    html[data-theme="dark"] {
      /* 聊天气泡 - 页面特有 */
      --user-bubble: var(--primary);
      --assistant-bubble: #1E293B;
      --border-card: var(--border-primary);
      /* 保留功能色 */
      --accent-green: var(--success);
    }
    
    /* 深色模式覆盖 */
    html[data-theme="dark"] body {
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    html[data-theme="dark"] .header {
      background: #111827;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .header-title {
      color: #F8FAFC;
    }
    html[data-theme="dark"] .header-back {
      color: #CBD5E1;
    }
    html[data-theme="dark"] .device-info {
      background: #141E2F;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }
    html[data-theme="dark"] .device-name {
      color: #F8FAFC;
      font-weight: 700;
    }
    html[data-theme="dark"] .device-uuid {
      color: #94A3B8;
    }
    html[data-theme="dark"] .device-status {
      color: #94A3B8;
    }
    html[data-theme="dark"] .status-dot.online {
      background: #10B981;
    }
    html[data-theme="dark"] .status-dot.offline {
      background: #64748B;
    }
    html[data-theme="dark"] .header-status {
      background: rgba(16, 185, 129, 0.16);
      color: #34D399;
    }
    html[data-theme="dark"] .device-reconnect-btn {
      background: rgba(59, 130, 246, 0.10);
      border: 1px solid rgba(96, 165, 250, 0.16);
      color: #60A5FA;
    }
    html[data-theme="dark"] .quick-cmd {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.14);
      color: #CBD5E1;
    }
    html[data-theme="dark"] .quick-cmd svg {
      stroke: #94A3B8;
    }
    html[data-theme="dark"] .quick-cmd[style*="color: var(--success)"] { 
      background: rgba(16, 185, 129, 0.10);
      border: 1px solid rgba(16, 185, 129, 0.18);
      color: #34D399;
    }
    html[data-theme="dark"] .quick-cmd[style*="color: var(--success)"] svg {
      stroke: #34D399;
    }
    html[data-theme="dark"] .welcome-bubble {
      background: #1E293B;
      border: 1px solid rgba(148, 163, 184, 0.10);
      color: #F8FAFC;
    }
    html[data-theme="dark"] .chat-message.assistant {
      background: #1E293B;
      border: 1px solid rgba(148, 163, 184, 0.10);
      color: #F8FAFC;
    }
    html[data-theme="dark"] .chat-message.user {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: #FFFFFF;
    }
    html[data-theme="dark"] .message-bubble.assistant-bubble {
      background: #1E293B;
      border: 1px solid rgba(148, 163, 184, 0.10);
      color: #F8FAFC;
    }
    html[data-theme="dark"] .message-bubble.user-bubble {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: #FFFFFF;
    }
    html[data-theme="dark"] .message-time {
      color: #64748B;
    }

    html[data-theme="dark"] .device-avatar {
      background: rgba(59, 130, 246, 0.16);
    }
    html[data-theme="dark"] .device-avatar svg {
      stroke: #60A5FA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    .header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-card);
    }
    .header-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 14px;
    }
    .header-back svg { width: 20px; height: 20px; }
    .header-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
    }

    .header-status {
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
    }
    .header-status.offline { background: rgba(100, 116, 139, 0.12); color: #64748B; }
    .header-status.error { background: rgba(239, 68, 68, 0.12); color: #DC2626; }

    .header-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      color: var(--text-secondary);
      transition: all 0.2s;
    }

    .header-action:hover {
      background: rgba(96, 165, 250, 0.15);
      color: var(--brand-primary);
    }

    .header-action svg {
      width: 18px;
      height: 18px;
    }

    /* 设备信息 */
    .device-info {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: #FFFFFF;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }
    .device-avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
    }
    .device-detail { flex: 1; }
    .device-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .device-status {
      font-size: 13px;
      color: #64748B;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.online { background: #10B981; }
    .status-dot.offline { background: #94A3B8; }
    
    .device-reconnect-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.08);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .device-reconnect-btn:hover {
      background: rgba(59, 130, 246, 0.15);
    }
    .device-reconnect-btn:active {
      transform: scale(0.95);
    }
    .device-reconnect-btn svg {
      stroke: #3B82F6;
    }

    /* 聊天区域 */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ========== 消息行（assistant / user 共用外层） ========== */
    .message-row {
      display: flex;
      width: 100%;
    }
    .message-row.assistant {
      justify-content: flex-start;
    }
    .message-row.user {
      justify-content: flex-end;
    }

    /* ========== Assistant 消息统一宽度容器 ========== */
    .assistant-message-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      width: fit-content;
      max-width: min(78%, 560px);
      min-width: 220px;
    }

    /* ========== 气泡（user / assistant 共用基础） ========== */
    .message-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      width: 100%;
      box-sizing: border-box;
    }
    .message-bubble.user-bubble {
      align-self: flex-end;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }
    .message-bubble.assistant-bubble {
      align-self: flex-start;
      background: #EEF2F7;
      color: #1E293B;
      border-bottom-left-radius: 4px;
    }
    .message-bubble.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }
    .message-bubble.warning {
      background: rgba(251, 191, 36, 0.15);
      color: #92400E;
      border: 1px solid #FBBF24;
    }
    .message-bubble.loading {
      opacity: 0.7;
      color: var(--text-secondary);
      font-style: italic;
    }
    .message-bubble.streaming::after {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 8px;
      border-radius: 50%;
      background: var(--accent-blue);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .message-bubble .message-content {
      line-height: 1.6;
    }

    /* ========== 元信息行（操作按钮 + 时间戳） ========== */
    .message-meta-row {
      width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      padding: 0 4px;
    }

    /* ========== 操作按钮容器 ========== */
    .message-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    /* 操作按钮 */
    .message-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      border-radius: 4px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      padding: 0;
    }

    .message-action-btn svg {
      width: 12px !important;
      height: 12px !important;
      flex-shrink: 0;
    }

    .message-action-btn:hover {
      background: rgba(0, 0, 0, 0.08);
      color: var(--text-primary);
    }

    .message-action-btn:active {
      transform: scale(0.95);
    }

    /* ========== 时间戳 ========== */
    .message-time {
      flex: 0 0 auto;
      white-space: nowrap;
      font-size: 12px;
      line-height: 1;
      color: var(--text-muted, #94a3b8);
    }

    /* 兼容旧结构的选择器（保留必要的旧样式，避免其他代码引用报错） */
    .chat-message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .chat-message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }
    .chat-message.assistant {
      align-self: flex-start;
      background: #EEF2F7;
      color: #1E293B;
      border-bottom-left-radius: 4px;
    }
    .chat-message.loading {
      color: var(--text-secondary);
      font-style: italic;
    }
    .chat-message.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }
    .chat-message.paused {
      background: rgba(251, 191, 36, 0.15);
      color: #92400E;
      border: 1px solid #FBBF24;
    }

    /* 多模态按钮样式 */
    .multi-modal-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .multi-modal-btn:hover {
      background: #e0e0e0;
    }

    /* 多模态菜单（与whale-chat统一） */
    .attach-option:hover {
      background: var(--card-bg-hover, #e5e7eb) !important;
      transform: scale(1.02);
    }
    
    .attach-option:active {
      transform: scale(0.98);
    }

    /* 图片预览容器 */
    .message-images {
      display: grid;
      gap: 4px;
      margin-bottom: 8px;
      max-width: 100%;
    }

    .message-images.single {
      grid-template-columns: 1fr;
    }

    .message-images.double {
      grid-template-columns: repeat(2, 1fr);
    }

    .message-images.multiple {
      grid-template-columns: repeat(3, 1fr);
    }

    .message-images img {
      width: 100%;
      max-width: 200px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .message-images img:hover {
      transform: scale(1.02);
    }

    /* 图片预览弹窗 */
    .image-preview-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }

    .image-preview-modal.active {
      display: flex;
    }

    .image-preview-modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .image-preview-modal .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 30px;
      cursor: pointer;
      background: none;
      border: none;
    }

    /* 图片占位符样式 */
    .image-placeholder {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
      margin-right: 4px;
    }

    /* 图片暂存区样式 */
    .image-staging-area {
      display: none;
      flex-wrap: wrap;
      padding: 8px 16px;
      background: #EEF3F8;
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      width: min(398px, calc(100vw - 24px));
      max-width: 100%;
    }

    /* 复制成功提示 */
    .copy-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      animation: fadeInUp 0.3s ease forwards;
      z-index: 100;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0);
      }
    }

    /* 引用选择器样式 */
    .quote-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .quote-selector {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .quote-header {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .quote-textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      font-size: 14px;
      resize: none;
      box-sizing: border-box;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--bg-primary);
    }

    .quote-textarea:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    .quote-buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .quote-btn-cancel, .quote-btn-confirm {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quote-btn-cancel {
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }

    .quote-btn-cancel:hover {
      background: var(--bg-tertiary);
    }

    .quote-btn-confirm {
      background: var(--accent-blue);
      color: white;
    }

    .quote-btn-confirm:hover {
      background: var(--accent-blue-dark);
    }

    /* 深色模式支持 */
    html[data-theme="dark"] .quote-selector {
      background: var(--bg-card);
    }

    html[data-theme="dark"] .quote-textarea {
      background: var(--bg-primary);
      border-color: var(--border-primary);
      color: var(--text-primary);
    }

    html[data-theme="dark"] .quote-btn-cancel {
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }

    .bubble-status {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      font-style: italic;
    }

    .chat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      margin: 8px 0;
      overflow: hidden;
    }

    .chat-card .card-header {
      background: var(--bg-secondary);
      padding: 8px 12px;
      font-weight: 600;
      font-size: 13px;
      border-bottom: 1px solid var(--border-primary);
    }

    .chat-card .card-body {
      padding: 12px;
    }

    .command-output-text {
      background: var(--bg-primary);
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
      margin: 0;
    }

    .card-toggle {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
    }

    .card-toggle:hover {
      background: var(--bg-hover);
    }

    /* Markdown 渲染样式 */
    .chat-message strong {
      font-weight: 700;
      color: inherit;
    }
    .chat-message code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92em;
      background: rgba(255,255,255,0.08);
      padding: 2px 5px;
      border-radius: 5px;
    }
    .chat-message br {
      display: block;
      content: "";
      line-height: 1.7;
    }

    .chat-raw {
      margin-top: 8px;
      padding: 8px;
      background: var(--bg-card);
      border-radius: 8px;
      font-size: 11px;
      color: var(--text-tertiary);
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
    }
    .chat-raw-toggle {
      font-size: 11px;
      color: var(--text-tertiary);
      cursor: pointer;
      margin-top: 4px;
    }

    /* 快捷指令 */
    .quick-commands {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-card);
    }
    .quick-cmd {
      padding: 8px 14px;
      background: #F1F5F9;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .quick-cmd:hover { background: rgba(59, 130, 246, 0.08); }
    .quick-cmd:active { background: rgba(59, 130, 246, 0.12); transform: scale(0.98); }
    .quick-cmd svg { 
  stroke: #64748B; 
  width: 14px; 
  height: 14px; 
  flex-shrink: 0;
}
    .quick-cmd:hover svg { stroke: #3B82F6; }
    .quick-cmd[style*="color: var(--success)"] { 
      color: #059669; 
      background: rgba(16, 185, 129, 0.08);
    }
    .quick-cmd[style*="color: var(--success)"] svg { stroke: #059669; }

    /* 输入区域 - 固定在底部 */
    :root {
      --composer-height: 56px;
      --keyboard-offset: 0px;
    }
    .input-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      background: transparent;
      transform: translateY(calc(-1 * var(--keyboard-offset, 0px)));
      transition: transform 0.18s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    
    /* 聊天容器底部间距 */
    .chat-container {
      padding-bottom: calc(var(--composer-height, 56px) + env(safe-area-inset-bottom) + 24px);
    }
    
    /* 输入框组合器 */
    .chat-composer {
      width: min(398px, calc(100vw - 24px));
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px;
      background: #EEF3F8;
      border-radius: 28px;
      transition: all 0.18s ease;
      border: 1px solid transparent;
    }
    .chat-composer.is-focused {
      background: #FFFFFF;
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 0 2px 12px rgba(59, 130, 246, 0.1);
    }
    
    /* 输入框 */
    .chat-input {
      flex: 1;
      min-height: 40px;
      max-height: 160px;
      padding: 9px 4px;
      background: transparent;
      border: none;
      border-radius: 0px;
      font-size: 15px;
      color: #1E293B;
      outline: none;
      resize: none;
      overflow-y: auto;
      line-height: 22px;
      white-space: pre-wrap;
    }
    .chat-input::placeholder { 
      color: #94A3B8; 
      font-size: 15px; 
    }
    
    /* 多模态按钮 */
    .multi-modal-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #64748B;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .multi-modal-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    .multi-modal-btn:active {
      opacity: 0.7;
    }
    .multi-modal-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    /* 语音按钮 */
    .voice-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #64748B;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .voice-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    .chat-composer.has-text .voice-btn {
      display: none;
    }
    /* 发送按钮 */
    .send-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      border: none;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
      transition: all 0.2s ease;
      padding: 0;
      overflow: hidden;
      position: relative;
    }
    .send-btn:disabled {
      opacity: 0.55;
      box-shadow: none;
      cursor: not-allowed;
    }
    .send-btn:not(:disabled):active {
      transform: scale(0.95);
    }
    .send-btn svg {
      width: 22px;
      height: 22px;
      stroke: #FFFFFF !important;
      fill: none !important;
      stroke-width: 1.9 !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .send-btn svg.icon-send {
      display: block;
    }
    .send-btn svg.icon-pause {
      display: none;
    }
    .send-btn svg.icon-stop {
      display: none;
    }
    .send-btn.processing {
      background: linear-gradient(135deg, #EF4444, #DC2626);
      animation: pulse-processing 1s infinite;
    }
    .send-btn.processing svg.icon-send {
      display: none;
    }
    .send-btn.processing svg.icon-pause {
      display: block;
    }
    .send-btn.processing svg.icon-stop {
      display: none;
    }
    .send-btn.processing.stopped svg.icon-pause {
      display: none;
    }
    .send-btn.processing.stopped svg.icon-stop {
      display: block;
    }
    
    /* 有文本时显示发送按钮 */
    .chat-composer.has-text .send-btn {
      display: flex;
    }
    
    /* processing 状态下始终显示发送按钮（即使输入框为空）*/
    .chat-composer.is-processing .send-btn {
      display: flex;
    }
    
    /* 深色模式样式 */
    html[data-theme="dark"] .chat-composer {
      background: #1E293B;
    }
    html[data-theme="dark"] .chat-composer.is-focused {
      background: #334155;
      border-color: rgba(96, 165, 250, 0.3);
    }
    html[data-theme="dark"] .chat-input {
      color: #F8FAFC;
    }
    html[data-theme="dark"] .chat-input::placeholder {
      color: #64748B;
    }
    html[data-theme="dark"] .multi-modal-btn,
    html[data-theme="dark"] .voice-btn {
      color: #94A3B8;
    }
    html[data-theme="dark"] .multi-modal-btn:hover,
    html[data-theme="dark"] .voice-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    html[data-theme="dark"] .multi-modal-btn svg,
    html[data-theme="dark"] .voice-btn svg {
      stroke: #94A3B8;
    }

    /* 多模态输入菜单 - 深色模式 */
    html[data-theme="dark"] .attach-menu {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }

    html[data-theme="dark"] .attach-option {
      background: rgba(30, 41, 59, 0.8);
    }

    html[data-theme="dark"] .attach-option span {
      color: #CBD5E1;
    }

    html[data-theme="dark"] .attach-option:hover {
      background: rgba(37, 99, 235, 0.2);
    }

    /* 加载动画 */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes pulse-processing {
      0%, 100% { 
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        transform: scale(1);
      }
      50% { 
        box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
        transform: scale(1.02);
      }
    }
    .typing { animation: pulse 1.5s infinite; }
  </style>
</head>

  <script>
    const log = console.log;
    let currentDevice = null;
    let isProcessing = false;
    let currentSessionKey = 'agent:main:mobile-cn';  // 当前会话 sessionKey
    let currentAssistantMessageId = null;  // 当前助手消息ID（用于暂停时更新）
    
    // 区分设备状态和小龙虾状态
    const runtimeState = {
      deviceOnline: false,
      deviceStatusText: '设备状态未知',
      wsAlive:false,
      openclawOnline: false,
      openclawStatusText: '检测中',
      
      canChat: false
    };
    
    // 更新状态显示
    function updateStatusDisplay() {
      console.log('[DeviceChat] updateStatusDisplay');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const deviceStatusText = document.getElementById('deviceStatusText');
      console.log('[DeviceChat] updateStatusDisplay runtimeState:', runtimeState);
      const { deviceOnline, openclawOnline, wsAlive } = runtimeState;

      console.log('[DeviceChat] updateStatusDisplay deviceOnline:', deviceOnline, 'openclawOnline:', openclawOnline, 'wsAlive:', wsAlive);

      // 计算综合状态文本
      let overallStatus = '';
      let dotClass = 'offline';

      if (!deviceOnline) {
        overallStatus = '设备离线';
        dotClass = 'offline';
      } else if (deviceOnline && !openclawOnline) {
        overallStatus = '设备在线 · 服务未启动';
        dotClass = 'warning';
      } else if (deviceOnline && wsAlive) {
        overallStatus = '设备在线 · 服务已启动';
        dotClass = 'online';
      }

      // 右上角状态胶囊
      if (statusDot && statusText) {
        statusDot.className = 'status-dot ' + dotClass;
        statusText.textContent = overallStatus;
      }

      // 更新设备状态显示
      const deviceStatusDot = document.getElementById('deviceStatusDot');
      if (deviceStatusDot && deviceStatusDot) {
        deviceStatusDot.className = 'status-dot ' + (deviceOnline ? 'online' : 'offline');
      }
      if (deviceStatusText) {
        deviceStatusText.textContent = deviceOnline ? '设备在线' : '设备离线';
      }
    }
    
    // 查询小龙虾服务状态
    async function checkOpenclawStatus(deviceId) {
      console.log('[DeviceChat] checkOpenclawStatus deviceId:', deviceId);
      try {
        const result = await window.OpenClawChatService.queryOpenClawStatus(deviceId);
        console.log('[DeviceChat] checkOpenclawStatus result:', result);
        console.log('[DeviceChat] checkOpenclawStatus wasLive:', result.wasLive);
        const wasLive = result.wsAlive;
        runtimeState.openclawOnline = wasLive;
        runtimeState.openclawStatusText = wasLive ? '在线' : '离线';
        runtimeState.canChat = result.wsAvlie;
        runtimeState.wsAlive = result.wsAvlie;
        
        updateStatusDisplay();

        if (wasLive) {
          // 服务已上线
          clearSystemNotice('openclaw_offline_notice');
        } else {
          // 服务仍未上线
          addSystemNoticeOnce('openclaw_offline_notice', '萤火虫服务未在线，请确认服务已启动后重试。', 'warning');
        }
      } catch (e) {
        console.error('[DeviceChat] checkOpenclawStatus failed:', e);
        runtimeState.openclawOnline = false;
        runtimeState.openclawStatusText = '检测失败';
        runtimeState.canChat = false;
        updateStatusDisplay();
        addSystemNoticeOnce('openclaw_offline_notice', '萤火虫服务未在线，请确认服务已启动后重试。', 'warning');
      }
    }
    
    // 初始化运行时状态
    async function initRuntimeState(device) {
      if (!device) return;
      
      // 设备状态
      const status = String(device?.status || '').toLowerCase();
      const manageState = String(device?.manageState || '').toLowerCase();
      runtimeState.deviceOnline = ['online', 'running', 'active'].includes(status) || 
                           ['online', 'running', 'active'].includes(manageState);
      runtimeState.deviceStatusText = runtimeState.deviceOnline ? '设备在线' : '设备离线';
      
      console.log('[StateDebug] deviceOnline:', runtimeState.deviceOnline, device?.status, device?.manageState);
      
      // 小龙虾服务状态
      const numericDeviceId = resolveNumericDeviceId(device);
      if (numericDeviceId) {
        console.log('[OpenClawDevice] numericDeviceId:', numericDeviceId, typeof numericDeviceId);
        console.log('[OpenClawDevice] iotDeviceUuid:', device?.iotDeviceUuid);
        console.log('[OpenClawDevice] routeDeviceId:', device?.routeDeviceId);
        console.log('[OpenClawDevice] sn:', device?.sn);
        await checkOpenclawStatus(numericDeviceId);
      }

      // 根据状态显示不同的消息
      if (runtimeState.deviceOnline && runtimeState.openclawOnline) {
        addAssistantMessage('萤火虫已就绪，可以帮你查询设备状态、执行任务或处理资料。');
      } else if (runtimeState.deviceOnline && !runtimeState.openclawOnline) {
        addSystemNoticeOnce('openclaw_offline_notice', '设备在线，但萤火虫服务未启动。请点击右上角刷新检测，或启动服务后再试。', 'warning');
      } else {
        addSystemNoticeOnce('device_offline_notice', '设备离线，请检查设备网络或电源。', 'error');
      }
    }
    
    // DEBUG 模式下显示测试按钮
    if (typeof DEBUG_OPENCLAW !== 'undefined' && DEBUG_OPENCLAW) {
      const testBtn = document.getElementById('testCmd');
      if (testBtn) testBtn.style.display = 'block';
    }

    // 新建会话
    function startNewSession() {
      // 生成新的 sessionKey
      currentSessionKey = 'agent:main:mobile:' + Date.now();
      console.log('[OpenClaw] new session:', currentSessionKey);
      
      // 清空聊天记录
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';
      
      // 显示欢迎语
      addAssistantMessage('小龙虾已开启新会话，请发送新的指令。');
    }

    // 安全转义 HTML
    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 渲染 assistant 消息的 Markdown
    function renderAssistantMarkdown(text) {
      const escaped = escapeHtml(text);
      return escaped
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^\s*[-*]\s+(.+)$/gm, '• $1')
        .replace(/\n/g, '<br>');
    }

    // 从URL获取deviceId
    function getDeviceIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('deviceId');
    }

    // 解析数字型 deviceId（用于 API 路径）
    // 注意：此函数只返回数字 ID，不返回字符串 UUID
    function resolveNumericDeviceId(device, fallbackId) {
      // 优先使用 device.id 或 device.deviceId
      const rawId = device?.id || device?.deviceId || fallbackId;
      const numericId = Number(rawId);
      
      if (!Number.isFinite(numericId)) {
        // 如果是 UUID 字符串，返回 null 并记录错误
        console.error('[DeviceId] invalid numeric device id', {
          rawId,
          deviceId: device?.id,
          deviceDeviceId: device?.deviceId,
          fallbackId,
          iotDeviceUuid: device?.iotDeviceUuid,
          routeDeviceId: device?.routeDeviceId,
          sn: device?.sn
        });
        return null;
      }
      
      console.log('[DeviceId] numericDeviceId:', numericId, typeof numericId);
      return numericId;
    }

    // 从设备对象中提取数字 ID（更宽松的解析）
    function extractNumericDeviceId(device) {
      if (!device) return null;
      
      // 尝试多种来源
      const id = device.id || device.deviceId;
      if (!id) return null;
      
      const numericId = Number(id);
      return Number.isFinite(numericId) ? numericId : null;
    }

    // 初始化
    async function init() {
      // 初始化主题
      ThemeManager.init();
      
      const urlDeviceId = getDeviceIdFromUrl();
      log('[DeviceChat] init, url deviceId:', urlDeviceId);

      // 从存储获取设备列表
      const deviceList = Storage.Device.getDeviceList() || [];
      const cached = Storage.Device.getCurrentDevice();
      log('[DeviceChat] deviceList:', deviceList);
      log('[DeviceChat] cached:', cached);
      
      // 尝试从 URL 获取数字 ID，或从缓存/列表中找到对应设备
      let targetDevice = null;
      let numericDeviceId = null;
      
      if (urlDeviceId) {
        // 尝试将 URL 中的 ID 转为数字
        numericDeviceId = Number(urlDeviceId);
        
        if (Number.isFinite(numericDeviceId)) {
          // URL 中是数字 ID，直接使用
          targetDevice = deviceList.find(d => d.id === numericDeviceId || String(d.id) === urlDeviceId) || cached;
        } else {
          // URL 中是 UUID 或其他字符串，在设备列表中查找
          log('[DeviceChat] URL deviceId is not numeric, searching device list...');
          targetDevice = deviceList.find(d => 
            d.iotDeviceUuid === urlDeviceId || 
            d.uuid === urlDeviceId || 
            d.routeDeviceUuid === urlDeviceId ||
            d.routeDeviceId === urlDeviceId ||
            d.sn === urlDeviceId
          ) || cached;
          
          // 如果找到设备，提取数字 ID
          if (targetDevice) {
            numericDeviceId = extractNumericDeviceId(targetDevice);
          }
        }
      } else {
        // 没有 URL deviceId，使用缓存设备
        targetDevice = cached;
        numericDeviceId = extractNumericDeviceId(targetDevice);
      }
      
      currentDevice = targetDevice;
      log('[DeviceChat] found device:', currentDevice);
      log('[DeviceChat] numericDeviceId:', numericDeviceId);

      if (!currentDevice) {
        showError('未找到设备，请从设备页进入');
        return;
      }
      
      // 验证数字 deviceId
      if (!numericDeviceId) {
        log('[DeviceChat] numericDeviceId is null, checking device...', currentDevice);
        // 尝试最后从 currentDevice 提取
        numericDeviceId = extractNumericDeviceId(currentDevice);
        if (!numericDeviceId) {
          showError('设备ID异常，请重新进入设备对话');
          return;
        }
      }
      
      log('[DeviceChat] validated numericDeviceId:', numericDeviceId);

      // 显示设备信息
      renderDeviceInfo();
      
      // 初始化运行时状态（设备状态 + 萤火虫服务状态）
      await initRuntimeState(currentDevice);

      // 初始化聊天服务
      window.OpenClawChatService.init(currentDevice);

      // ====== 调试：初始化时查询模型配置 ======
      if (numericDeviceId && runtimeState.openclawOnline) {
        try {
          console.log('[Model] 页面初始化，查询设备模型配置...');
          const modelResponse = await Api.OPENCLAW.listModels(numericDeviceId);
          console.log('[Model] 初始化模型列表响应:', modelResponse);
          
          if (modelResponse && modelResponse.data) {
            const modelData = modelResponse.data;
            console.log('[Model] 初始化模型详细数据:', modelData);
            
            if (modelData.models || modelData.data || modelData.result) {
              console.log('[Model] 初始化可用模型列表:', modelData.models || modelData.data || modelData.result);
            }
          }
        } catch (modelError) {
          console.warn('[Model] 初始化查询模型配置失败:', modelError);
        }
      }
      // =========================================

      // 启动轮询系统（恢复轮询 -> 空闲轮询）
      if (numericDeviceId && runtimeState.openclawOnline) {
        window.OpenClawChatService.startPolling(numericDeviceId, {
          onRecoveryProgress: (count) => {
            console.log('[UI] recovery progress:', count);
          },
          onLifecycleStart: (runId) => {
            console.log('[UI] lifecycle start during idle:', runId);
          },
          onAssistantUpdate: (text) => {
            console.log('[UI] assistant update during idle:', text.slice(0, 50));
          },
          onCommandOutput: (output, info) => {
            console.log('[UI] command output during idle:', info);
          },
          onFinal: (text) => {
            console.log('[UI] final during idle:', text.slice(0, 50));
          },
          onIdle: () => {
            console.log('[UI] now in idle polling mode');
          }
        });
      }
      
      // 初始化输入框交互
      initComposer();
    }

    // 渲染设备信息
    function renderDeviceInfo() {
      const nameEl = document.getElementById('deviceName');
      const dotEl = document.getElementById('statusDot');
      const textEl = document.getElementById('statusText');
      
      if (nameEl) nameEl.textContent = currentDevice?.name || '未知设备';
      
      const isOnline = currentDevice?.isOnline || currentDevice?.status === 'online';
      if (dotEl) {
        dotEl.className = 'status-dot ' + (isOnline ? 'online' : 'offline');
      }
      if (textEl) {
        textEl.textContent = isOnline ? '设备在线' : '设备离线';
      }
    }

    // 快捷指令
    function sendQuickCmd(message) {
      if (isProcessing) return;
      handleSend(message);
    }

    // 更新发送按钮状态（处理中状态）
    function updateSendButton(processing) {
      const sendBtn = document.getElementById('sendBtn');
      const chatInput = document.getElementById('chatInput');
      const multiModalBtn = document.getElementById('multiModalBtn');

      if (processing) {
        sendBtn.classList.add('processing');
        sendBtn.disabled = false;  // 可以点击暂停
        chatInput.disabled = true;
        if (multiModalBtn) multiModalBtn.disabled = true;
      } else {
        sendBtn.classList.remove('processing');
        sendBtn.disabled = false;
        chatInput.disabled = false;
        if (multiModalBtn) multiModalBtn.disabled = false;
      }
    }

    // 暂停当前任务
    function handlePause() {
      if (!isProcessing) return;

      console.log('[Pause] stopping current task...');

      // 停止轮询
      window.OpenClawChatService.stopPolling();

      // 更新助手消息状态
      if (currentAssistantMessageId) {
        updateAssistantMessage(currentAssistantMessageId, '已停止回答', { status: 'paused' });
      }

      // 恢复UI状态
      isProcessing = false;
      currentAssistantMessageId = null;
      updateSendButton(false);

      // 添加系统提示
      addSystemNoticeOnce('pause_notice', '已停止当前任务，可以发送新指令。', 'info');
    }

    // 输入框键盘事件（处理快捷键）
    function handleInputKeydown(e) {
      const input = document.getElementById('chatInput');

      // 全选：Ctrl+A (Windows/Linux) 或 Cmd+A (Mac)
      if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
        if (input && input.value.length > 0) {
          e.preventDefault();
          input.select();
        }
        return;
      }

      // 发送消息：Enter（不按Shift）
      if (e.key === 'Enter' && !e.shiftKey && !isProcessing) {
        e.preventDefault();
        handleSend();
        return;
      }

      // Shift+Enter 换行：不需要特殊处理，浏览器默认行为即可
    }

    // 回车发送（保留向后兼容）
    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey && !isProcessing) {
        e.preventDefault();
        handleSend();
      }
    }

    // 多模态功能：切换菜单（与whale-chat统一）
    function toggleAttachMenu() {
      const menu = document.getElementById('attachMenu');
      if (menu.style.display === 'none') {
        menu.style.display = 'block';
      } else {
        menu.style.display = 'none';
      }
    }

    // 点击其他地方关闭菜单
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#attachMenu') && !e.target.closest('#multiModalBtn')) {
        const menu = document.getElementById('attachMenu');
        if (menu) menu.style.display = 'none';
      }
    });

    // 处理多模态上传（与whale-chat统一）
    function handleMultimodalUpload(type) {
      const menu = document.getElementById('attachMenu');
      if (menu) menu.style.display = 'none';

      const fileInput = document.getElementById('fileInput');
      if (!fileInput) return;

      switch(type) {
        case 'image':
          fileInput.accept = 'image/*';
          break;
        case 'document':
          fileInput.accept = '.pdf,.doc,.docx,.txt';
          break;
        case 'spreadsheet':
          fileInput.accept = '.xls,.xlsx,.csv';
          break;
        case 'scan':
          fileInput.accept = 'image/*';
          break;
        case 'voice':
          if (typeof showToast === 'function') {
            showToast('语音输入将在后续版本开放', 'info');
          } else {
            alert('语音输入将在后续版本开放');
          }
          return;
      }

      fileInput.click();
    }

    // 处理文件选择（与whale-chat统一）
    let attachedFiles = [];

    function handleFileSelected(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      console.log('[FileUpload] 选择了文件:', files.map(f => f.name).join(', '));

      files.forEach(file => {
        const fileName = file.name.toLowerCase();
        let fileType = 'document';

        if (fileName.match(/\.(jpg|jpeg|png|gif|webp|bmp)$/)) {
          fileType = 'image';
        } else if (fileName.match(/\.(xls|xlsx|csv)$/)) {
          fileType = 'spreadsheet';
        } else if (fileName.match(/\.(pdf|doc|docx|txt)$/)) {
          fileType = 'document';
        }

        if (fileType === 'image') {
          const reader = new FileReader();
          reader.onload = (e) => {
            window.currentImages = window.currentImages || [];
            window.currentImages.push({
              base64: e.target.result,
              name: file.name
            });
            updateImageStaging();
          };
          reader.readAsDataURL(file);
        } else {
          if (typeof showToast === 'function') {
            showToast('文档上传功能将在后续版本开放', 'info');
          } else {
            alert('文档上传功能将在后续版本开放');
          }
        }
      });

      event.target.value = '';
    }

    // 处理图片上传
    async function handleImageUpload(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      for (const file of files) {
        // 检查文件类型
        if (!file.type.startsWith('image/')) {
          alert('请选择图片文件');
          continue;
        }

        // 检查文件大小（最大5MB）
        if (file.size > 5 * 1024 * 1024) {
          alert('图片大小不能超过5MB');
          continue;
        }

        try {
          // 转成base64
          const base64 = await fileToBase64(file);

          // 保存到全局变量
          window.currentImages = window.currentImages || [];
          window.currentImages.push({
            base64: base64,
            name: file.name
          });

        } catch (error) {
          console.error('图片处理失败:', error);
          alert('图片处理失败，请重试');
        }
      }

      // 更新暂存区显示
      updateImageStaging();

      // 清空文件选择器
      event.target.value = '';
    }

    // 更新图片暂存区显示
    function updateImageStaging() {
      let stagingArea = document.getElementById('imageStagingArea');
      if (!stagingArea) {
        // 如果暂存区不存在，创建它
        const inputArea = document.querySelector('.input-area');
        const chatComposer = document.querySelector('.chat-composer');
        stagingArea = document.createElement('div');
        stagingArea.id = 'imageStagingArea';
        stagingArea.className = 'image-staging-area';
        // 插入到 input-area 内部，在 chat-composer 前面
        if (chatComposer && inputArea) {
          inputArea.insertBefore(stagingArea, chatComposer);
        } else if (inputArea) {
          inputArea.appendChild(stagingArea);
        }
      }

      const images = window.currentImages || [];

      if (images.length === 0) {
        stagingArea.style.display = 'none';
        return;
      }

      stagingArea.style.display = 'flex';

      let html = '';
      images.forEach((img, index) => {
        html += `
          <div class="staged-image" style="position:relative;display:inline-block;margin:4px;">
            <img src="${img.base64}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">
            <button onclick="removeStagedImage(${index})" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:none;background:#ff4444;color:white;font-size:12px;cursor:pointer;line-height:1;">×</button>
          </div>
        `;
      });

      stagingArea.innerHTML = html;
    }

    // 移除暂存图片
    function removeStagedImage(index) {
      if (window.currentImages) {
        window.currentImages.splice(index, 1);
        updateImageStaging();
      }
    }

    // 文件转base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 显示图片预览
    function showImagePreview(src) {
      const modal = document.getElementById('imagePreviewModal');
      const img = document.getElementById('previewImage');
      img.src = src;
      modal.classList.add('active');
    }

    // 关闭图片预览
    function closeImagePreview(event) {
      if (event && event.target.className === 'close-btn') return;
      const modal = document.getElementById('imagePreviewModal');
      modal.classList.remove('active');
    }

    // 渲染消息中的图片
    function renderImages(images) {
      if (!images || images.length === 0) return '';

      const count = images.length;
      let gridClass = 'single';
      if (count === 2) gridClass = 'double';
      else if (count >= 3) gridClass = 'multiple';

      const imagesHtml = images.map(img =>
        `<img src="data:image/png;base64,${img}" onclick="showImagePreview(this.src)" alt="图片" style="cursor:pointer;">`
      ).join('');

      return `<div class="message-images ${gridClass}">${imagesHtml}</div>`;
    }

    // 发送消息
    async function handleSend(customMessage = null) {
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const message = (customMessage || input.value || '').trim();

      if (!message || isProcessing) return;
      if (!currentDevice) {
        showError('未绑定设备');
        return;
      }

      const deviceUuid = window.OpenClawChatService.resolveDeviceUuid(currentDevice);
      if (!deviceUuid) {
        showError('当前设备缺少 iotDeviceUuid / uuid，暂无法连接萤火虫');
        return;
      }

      // 状态拦截
      if (!runtimeState.deviceOnline) {
        addSystemNoticeOnce('device_offline_notice', '设备离线，无法发送指令。请检查设备网络或电源。', 'error');
        return;
      }

      if (!runtimeState.openclawOnline) {
        addSystemNoticeOnce('openclaw_offline_notice', '设备在线，但萤火虫服务未启动。请先重新检测或启动服务。', 'warning');
        return;
      }

      const turnId = 'turn_' + Date.now();
      console.log('[SendFlow] click send', {
        message: message,
        deviceId: deviceUuid,
        sessionKey: 'agent:main:main',
        timestamp: Date.now(),
        currentAssistantId: currentAssistantMessageId,
        currentTurn: turnId
      });
      console.log('[Turn]', turnId, 'sending:', message);

      isProcessing = true;
      updateSendButton(true);  // 更新按钮状态为处理中

      // 检查是否有图片
      const hasImages = window.currentImages && window.currentImages.length > 0;
      const images = hasImages ? window.currentImages.map(img => img.base64) : [];

      addUserMessage(message, hasImages ? images : []);
      console.log('[SendFlow] user message created', {
        userMessageId: null
      });
      input.value = '';

      // 清空图片暂存区
      if (hasImages) {
        window.currentImages = [];
        updateImageStaging();
      }

      // 创建助手消息气泡
      currentAssistantMessageId = addAssistantMessage('正在发送指令...', {
        status: 'loading',
        turnId: turnId
      });
      console.log('[SendFlow] assistant placeholder created', {
        assistantMessageId: currentAssistantMessageId,
        currentAssistantId: currentAssistantMessageId
      });
      
      let commandCardId = null;

      const updateCurrentAssistant = (text, options = {}, meta = {}) => {
        const targetId = meta.assistantMessageId || currentAssistantMessageId;
        if (!targetId) {
          console.warn('[UIRender] drop assistant update: missing assistantMessageId');
          return;
        }
        updateAssistantMessage(targetId, text, options);
      };

      const addCommandCard = (output, index) => {
        const container = document.getElementById('chatContainer');
        const card = document.createElement('div');
        card.className = 'chat-card command-output';

        const header = document.createElement('div');
        header.className = 'card-header';
        header.textContent = '执行结果 #' + (index + 1);

        const body = document.createElement('div');
        body.className = 'card-body';

        const pre = document.createElement('pre');
        pre.className = 'command-output-text';
        pre.textContent = output.length > 500 ? output.substring(0, 500) + '...' : output;

        body.appendChild(pre);

        if (output.length > 500) {
          const toggle = document.createElement('button');
          toggle.className = 'card-toggle';
          toggle.textContent = '点击展开全部';
          toggle.onclick = () => {
            pre.textContent = pre.textContent.includes('...') ? output : output.substring(0, 500) + '...';
            toggle.textContent = pre.textContent.includes('...') ? '点击收起' : '点击展开全部';
          };
          body.appendChild(toggle);
        }

        card.appendChild(header);
        card.appendChild(body);
        container.appendChild(card);
        scrollToBottom();

        return card.id;
      };

      try {
        const response = await window.OpenClawChatService.sendMessageAndWait(currentDevice, message, {
          // Lifecycle 事件
          onLifecycleStart: (runId, data, meta = {}) => {
            console.log('[UI] lifecycle start:', runId);
            updateCurrentAssistant('萤火虫正在分析问题...', { status: 'loading' }, meta);
          },

          onLifecycleEnd: (data, meta = {}) => {
            console.log('[UI] lifecycle end');
          },

          // Assistant 更新
          onAssistantUpdate: (text, meta = {}) => {
            console.log('[UI] assistant update, len:', text.length);
            updateCurrentAssistant(text, { status: 'streaming' }, meta);
          },

          // 命令输出
          onCommandOutput: (output, info, meta = {}) => {
            console.log('[UI] command output received but hidden:', {
              length: String(output || '').length,
              phase: info?.phase,
              isEnd: info?.isEnd,
              index: info?.index
            });
          },

          // Final 完成
          onFinal: (text, meta = {}) => {
            console.log('[UI] final:', text.slice(0, 100));
            updateCurrentAssistant(text, { status: 'done', final: true }, { ...meta, final: true });
          },

          // 警告提示
          onWarning: (msg, meta = {}) => {
            if (meta?.final || meta?.state === 'final') {
              console.log('[UI] skip warning because final already received');
              return;
            }
            console.log('[UI] warning:', msg);
            updateCurrentAssistant(msg, { status: 'loading' }, meta);
          },

          // 进入空闲状态
          onIdle: () => {
            console.log('[UI] idle polling');
          }
        }, images, {
          turnId,
          assistantMessageId: currentAssistantMessageId
        });

        // 处理返回结果
        if (response?.success && response?.text) {
          updateCurrentAssistant(response.text, { status: 'done', final: response.isFinal });

          // 删除 warning DOM 追加逻辑，避免未定义变量问题
          // 直接使用 updateCurrentAssistant 处理即可
        } else if (!response?.success) {
          updateCurrentAssistant(response?.msg || '通信失败', { status: 'error' });
        } else {
          updateCurrentAssistant('暂未返回可读结果，请稍后重试。', { status: 'error' });
        }

      } catch (error) {
        console.error('[Turn] error:', error);
        updateCurrentAssistant(error.message || '通信失败', { status: 'error' });
      } finally {
        updateSendButton(false);  // 恢复按钮状态
        isProcessing = false;
        currentAssistantMessageId = null;
        input.value = '';  // 确保清空
        updateComposerState();  // 更新输入框状态
      }
    }

    // 重新生成消息
    async function regenerateMessage(messageId) {
      console.log('[Regenerate] regenerating message:', messageId);
      
      // 找到对应的助手消息元素
      const messageEl = document.querySelector(`[data-message-id="${messageId}"]`);
      if (!messageEl) {
        console.error('[Regenerate] message not found:', messageId);
        return;
      }
      
      // 获取当前消息内容（用于重新发送相同问题）
      const contentEl = messageEl.querySelector('.message-content');
      if (!contentEl) return;
      
      // 获取上一条用户消息
      const messages = document.querySelectorAll('.chat-message');
      let userMessage = '';
      let found = false;
      
      for (let i = messages.length - 1; i >= 0; i--) {
        if (messages[i].dataset.messageId === messageId) {
          found = true;
        } else if (found && messages[i].classList.contains('user')) {
          userMessage = messages[i].textContent || '';
          break;
        }
      }
      
      if (!userMessage) {
        console.error('[Regenerate] user message not found');
        return;
      }
      
      // 更新消息状态为重新生成中
      updateAssistantMessage(messageId, '重新生成中...', { status: 'loading' });
      
      // 发送消息
      await handleSend(userMessage);
    }

    // 复制消息内容
    async function copyMessage(messageId, message) {
      console.log('[Copy] copying message:', messageId);
      
      try {
        // 复制到剪贴板
        await navigator.clipboard.writeText(message);
        
        // 显示复制成功提示
        showCopySuccess(messageId);
      } catch (err) {
        console.error('[Copy] failed:', err);
        
        // 降级方案：创建临时文本区域
        const textarea = document.createElement('textarea');
        textarea.value = message;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        
        try {
          document.execCommand('copy');
          showCopySuccess(messageId);
        } catch (e) {
          console.error('[Copy] fallback failed:', e);
        } finally {
          document.body.removeChild(textarea);
        }
      }
    }
    
    // 显示复制成功提示
    function showCopySuccess(messageId) {
      const msg = document.querySelector(`[data-message-id="${messageId}"]`);
      if (msg) {
        const toast = document.createElement('div');
        toast.className = 'copy-toast';
        toast.textContent = '已复制';
        msg.parentNode.appendChild(toast);
        
        setTimeout(() => {
          if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 2000);
      }
    }

    // 引用功能 - 直接插入到输入框
    function showQuoteSelector(messageId, message) {
      console.log('[Quote] inserting quote:', messageId);
      
      const input = document.getElementById('chatInput');
      if (input) {
        // 直接插入引用格式
        input.value = `> ${message.trim()}\n\n`;
        input.focus();
        // 自动调整输入框高度
        autoResizeInput(input);
      }
    }
    
    // 自动调整输入框高度
    function autoResizeInput(textarea) {
      textarea.style.height = 'auto';
      const maxHeight = 160; // 最大高度限制
      const scrollHeight = textarea.scrollHeight;
      const newHeight = Math.min(scrollHeight, maxHeight);
      textarea.style.height = newHeight + 'px';
      
      // 更新 CSS 变量，供消息区 padding-bottom 使用
      const composer = document.getElementById('chatComposer');
      if (composer) {
        const composerHeight = Math.max(56, newHeight + 16); // 加上 padding
        document.documentElement.style.setProperty('--composer-height', `${composerHeight}px`);
      }
    }
    
    // 更新输入框组合器状态
    function updateComposerState() {
      const chatComposer = document.getElementById('chatComposer');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const voiceBtn = document.getElementById('voiceBtn');
      
      if (!chatComposer || !chatInput) return;
      
      const hasText = chatInput.value.trim().length > 0;
      const isFocused = document.activeElement === chatInput;
      const isMultiline = chatInput.scrollHeight > 48; // 单行高度阈值
      const isProcessing = window.isProcessing || false;
      
      // 更新状态 class
      chatComposer.classList.toggle('has-text', hasText);
      chatComposer.classList.toggle('is-focused', isFocused && !isProcessing);
      chatComposer.classList.toggle('is-multiline', isMultiline);
      chatComposer.classList.toggle('is-processing', isProcessing);
      
      // 更新按钮显示
      if (hasText || isProcessing) {
        // 有文本或处理中时显示发送按钮
        if (sendBtn) sendBtn.style.display = 'flex';
        if (voiceBtn) voiceBtn.style.display = 'none';
      } else {
        // 无文本且非处理中时显示语音按钮
        if (sendBtn) sendBtn.style.display = 'none';
        if (voiceBtn) voiceBtn.style.display = 'flex';
      }
      
      // 调整输入框高度
      autoResizeInput(chatInput);
    }
    
    // 键盘弹出适配
    function setupKeyboardAdaptation() {
      if (!window.visualViewport) return;
      
      const updateKeyboardOffset = () => {
        const vv = window.visualViewport;
        
        // 检查 visualViewport 是否接近全屏（键盘未弹出或已收起）
        const isFullScreen = vv.height >= window.innerHeight - 20;
        
        // 计算键盘偏移量
        let offset = isFullScreen ? 0 : Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
        
        // 限制最大偏移量（避免异常值）
        const maxOffset = 360;
        offset = Math.min(offset, maxOffset);
        
        // 调试日志（仅开发环境）
        if (offset > 0) {
          console.debug('[Keyboard] offset:', offset, 'px');
        }
        
        document.documentElement.style.setProperty('--keyboard-offset', `${offset}px`);
        
        // 滚动到输入框位置（避免重复滚动）
        if (offset > 50) {
          setTimeout(() => {
            const inputArea = document.querySelector('.input-area');
            if (inputArea) {
              inputArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }, 100);
        }
      };
      
      window.visualViewport.addEventListener('resize', updateKeyboardOffset);
      window.visualViewport.addEventListener('scroll', updateKeyboardOffset);
    }
    
    // 语音按钮点击处理
    function handleVoiceClick() {
      // 语音功能开发中提示
      if (typeof showToast === 'function') {
        showToast('语音输入开发中', 'info');
      } else if (typeof alert === 'function') {
        alert('语音输入开发中');
      } else {
        console.log('[Voice] 语音输入开发中');
      }
    }
    
    // 初始化输入框交互
    function initComposer() {
      const chatInput = document.getElementById('chatInput');
      const chatComposer = document.getElementById('chatComposer');
      const sendBtn = document.getElementById('sendBtn');
      const voiceBtn = document.getElementById('voiceBtn');
      const multiModalBtn = document.getElementById('multiModalBtn');
      
      // 空值检查
      if (!chatInput) {
        console.warn('[Composer] chatInput not found');
        return;
      }
      if (!chatComposer) {
        console.warn('[Composer] chatComposer not found');
        return;
      }
      if (!sendBtn) {
        console.warn('[Composer] sendBtn not found');
        return;
      }
      if (!voiceBtn) {
        console.warn('[Composer] voiceBtn not found');
        return;
      }
      if (!multiModalBtn) {
        console.warn('[Composer] multiModalBtn not found');
        return;
      }
      
      // 绑定事件
      chatInput.addEventListener('focus', () => {
        if (!window.isProcessing) {
          updateComposerState();
        }
      });
      
      chatInput.addEventListener('blur', () => {
        if (!window.isProcessing) {
          updateComposerState();
        }
      });
      
      chatInput.addEventListener('input', () => {
        updateComposerState();
      });
      
      chatInput.addEventListener('keydown', handleInputKeydown);
      chatInput.addEventListener('keypress', handleKeyPress);
      
      // 设置键盘适配
      setupKeyboardAdaptation();
      
      // 初始化状态
      updateComposerState();
    }

    // 添加用户消息
    function addUserMessage(message, images = []) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message user';

      // 如果有图片，先渲染图片
      let content = '';
      if (images && images.length > 0) {
        content += renderImages(images);
      }
      content += escapeHtml(message);

      div.innerHTML = content;
      container.appendChild(div);
      scrollToBottom();
    }

    // 渲染消息内容（支持 Markdown）
    function renderMessageContent(text) {
      if (typeof renderAssistantMarkdown === 'function') {
        return renderAssistantMarkdown(text);
      }
      return text;
    }

    // 添加助手消息（带 data-message-id）
    function addAssistantMessage(message, options = {}) {
      const container = document.getElementById('chatContainer');
      const id = options.id || `assistant_${Date.now()}_${Math.random().toString(36).slice(2)}`;

      // 外层行容器
      const rowDiv = document.createElement('div');
      rowDiv.className = 'message-row assistant';

      // assistant 消息统一宽度容器
      const wrapDiv = document.createElement('div');
      wrapDiv.className = 'assistant-message-wrap';

      // 气泡
      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'message-bubble assistant-bubble';
      bubbleDiv.dataset.messageId = id;
      bubbleDiv.dataset.turnId = options.turnId || '';

      if (options.isError) {
        bubbleDiv.classList.add('error');
      }
      if (options.warning) {
        bubbleDiv.classList.add('warning');
      }

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.innerHTML = renderMessageContent(message);
      bubbleDiv.appendChild(contentDiv);

      if (options.warning) {
        const warningDiv = document.createElement('div');
        warningDiv.className = 'chat-warning';
        warningDiv.textContent = options.warning;
        bubbleDiv.appendChild(warningDiv);
      }

      wrapDiv.appendChild(bubbleDiv);

      // 元信息行（操作按钮 + 时间戳）
      const metaRow = document.createElement('div');
      metaRow.className = 'message-meta-row assistant-meta-row';

      // 操作按钮
      if (!options.isError && message && message.length > 0) {
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'message-actions';

        // 重新生成按钮
        const regenerateBtn = document.createElement('button');
        regenerateBtn.className = 'message-action-btn';
        regenerateBtn.title = '重新生成';
        regenerateBtn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        `;
        regenerateBtn.onclick = () => regenerateMessage(id);
        actionsDiv.appendChild(regenerateBtn);

        // 复制按钮
        const copyBtn = document.createElement('button');
        copyBtn.className = 'message-action-btn';
        copyBtn.title = '复制';
        copyBtn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        `;
        copyBtn.onclick = () => copyMessage(id, message);
        actionsDiv.appendChild(copyBtn);

        // 引用按钮
        const quoteBtn = document.createElement('button');
        quoteBtn.className = 'message-action-btn';
        quoteBtn.title = '引用';
        quoteBtn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        `;
        quoteBtn.onclick = () => showQuoteSelector(id, message);
        actionsDiv.appendChild(quoteBtn);

        // 点赞按钮
        const likeBtn = document.createElement('button');
        likeBtn.className = 'message-action-btn';
        likeBtn.title = '点赞';
        likeBtn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
          </svg>
        `;
        likeBtn.onclick = () => handleLike(id);
        actionsDiv.appendChild(likeBtn);

        // 点踩按钮
        const dislikeBtn = document.createElement('button');
        dislikeBtn.className = 'message-action-btn';
        dislikeBtn.title = '点踩';
        dislikeBtn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"></path>
          </svg>
        `;
        dislikeBtn.onclick = () => handleDislike(id);
        actionsDiv.appendChild(dislikeBtn);

        metaRow.appendChild(actionsDiv);
      }

      // 时间戳
      const timeSpan = document.createElement('span');
      timeSpan.className = 'message-time';
      timeSpan.textContent = formatTime(options.timestamp || Date.now());
      metaRow.appendChild(timeSpan);

      wrapDiv.appendChild(metaRow);
      rowDiv.appendChild(wrapDiv);
      container.appendChild(rowDiv);
      scrollToBottom();

      console.log('[UIRender] addAssistantMessage', { id, textPreview: String(message).slice(0, 50) });
      return id;
    }

    // 更新助手消息内容
    function updateAssistantMessage(messageId, text, options = {}) {
      if (!messageId) {
        console.warn('[UIRender] drop assistant update: missing messageId');
        console.trace();
        return false;
      }
      
      console.log('[UIRender] updateAssistantMessage called', {
        messageId: messageId,
        textLength: String(text).length
      });
      
      const el = document.querySelector(`[data-message-id="${messageId}"]`);

      if (!el) {
        console.error('[UIRender] assistant message not found:', messageId);
        return false;
      }

      const contentEl =
        el.querySelector('.message-content') ||
        el.querySelector('.bubble-content') ||
        el.querySelector('.assistant-content') ||
        el;

      contentEl.innerHTML = renderMessageContent(text);

      el.classList.remove('loading', 'streaming', 'error', 'warning', 'paused');
      if (options.status) {
        el.classList.add(options.status);
      }
      
      console.log('[UIRender] updateAssistantMessage', { 
        messageId, 
        textPreview: String(text).slice(0, 80),
        status: options.status 
      });
      
      scrollToBottom();
      return true;
    }

    // 添加助手气泡（可更新的，兼容旧接口）
    function addAssistantBubble(message, status = null) {
      const container = document.getElementById('chatContainer');
      const id = `bubble_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      
      const div = document.createElement('div');
      div.className = 'chat-message assistant';
      div.dataset.messageId = id;
      
      if (status) {
        div.classList.add(status);
      }
      
      const bubbleContent = document.createElement('div');
      bubbleContent.className = 'bubble-content';
      bubbleContent.textContent = message;
      div.appendChild(bubbleContent);
      
      if (status) {
        const bubbleStatus = document.createElement('div');
        bubbleStatus.className = 'bubble-status';
        bubbleStatus.textContent = status;
        div.appendChild(bubbleStatus);
      }
      
      container.appendChild(div);
      scrollToBottom();
      
      console.log('[UIRender] addAssistantBubble', { id, status, textPreview: String(message).slice(0, 50) });
      return id;
    }

    // 添加loading消息
    function addLoadingMessage(message) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message assistant loading typing';
      div.id = 'loading-' + Date.now();
      div.textContent = message;
      container.appendChild(div);
      scrollToBottom();
      return div.id;
    }

    // 显示错误
    function showError(message) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'chat-message error';
      div.textContent = message;
      container.appendChild(div);
      scrollToBottom();
    }

    function addSystemNoticeOnce(id, text, type = 'warning') {
      if (document.querySelector(`[data-notice-id="${id}"]`)) return;

      const container = document.getElementById('chatContainer');
      const notice = document.createElement('div');
      notice.className = `chat-message system-notice ${type}`;
      notice.dataset.noticeId = id;
      notice.textContent = text;
      container.appendChild(notice);
      scrollToBottom();
    }

    function clearSystemNotice(id) {
      const notice = document.querySelector(`[data-notice-id="${id}"]`);
      if (notice) notice.remove();
    }

    // 移除消息
    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    // 切换原始JSON显示
    function toggleRaw(el) {
      const parent = el.parentElement;
      const raw = parent.dataset.raw;
      if (raw) {
        if (el.textContent.includes('展开')) {
          el.textContent = '▲ 收起原始JSON';
          const rawDiv = document.createElement('div');
          rawDiv.className = 'chat-raw';
          rawDiv.textContent = raw;
          parent.appendChild(rawDiv);
        } else {
          el.textContent = '▼ 点击展开原始JSON';
          const rawDiv = parent.querySelector('.chat-raw');
          if (rawDiv) rawDiv.remove();
        }
      }
    }

    // 格式化消息时间
    function formatTime(time) {
      if (!time) return '刚刚';
      const date = new Date(time);
      const now = new Date();
      const diff = now - date;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
      return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
    }

    // 点赞
    function handleLike(messageId) {
      console.log('[DeviceChat] Like message:', messageId);
    }

    // 点踩
    function handleDislike(messageId) {
      console.log('[DeviceChat] Dislike message:', messageId);
    }

    // 滚动到底部
    function scrollToBottom() {
      const container = document.getElementById('chatContainer');
      container.scrollTop = container.scrollHeight;
    }

    // 页面加载完成
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
