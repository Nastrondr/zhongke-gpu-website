<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>模型与技能 - 设备管理</title>
  <script>
    // 在页面渲染前应用主题，防止闪烁
    (function() {
      const savedTheme = localStorage.getItem('app_theme_mode');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme === 'system' ? (systemDark ? 'dark' : 'light') : (savedTheme || 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/theme-variables.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .app-container {
      max-width: 430px;
      min-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 30px;
    }

    /* 导航栏 */
    .nav-header {
      padding: 16px 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-primary);
    }

    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--accent-blue);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: rgba(96, 165, 250, 0.1);
    }

    .back-btn:active {
      background: rgba(96, 165, 250, 0.15);
    }

    .nav-title {
      font-size: 17px;
      font-weight: 600;
      flex: 1;
    }

    /* Tab 切换 */
    .tab-bar {
      display: flex;
      padding: 12px 16px;
      gap: 8px;
      border-bottom: 1px solid var(--border-primary);
    }

    .tab-item {
      flex: 1;
      padding: 10px 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-tertiary);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-item.active {
      color: var(--text-primary);
      background: var(--bg-tertiary);
    }

    /* 内容区域 */
    .content-area {
      padding: 16px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 卡片样式 */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    /* 模型列表 */
    .model-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-secondary);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .model-item:hover {
      border-color: var(--primary);
    }

    .model-item.active {
      border-color: var(--primary);
      background: var(--bg-active);
    }

    .model-icon {
      width: 40px;
      height: 40px;
      background: var(--primary-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .model-icon svg {
      width: 20px;
      height: 20px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .model-info {
      flex: 1;
    }

    .model-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .model-desc {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .model-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--success);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
    }

    /* 技能网格 */
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .skill-item {
      padding: 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-secondary);
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .skill-item:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .skill-item.active {
      border-color: var(--primary);
      background: var(--bg-active);
    }

    .skill-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 10px;
      background: var(--primary-gradient);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .skill-icon svg {
      width: 22px;
      height: 22px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .skill-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .skill-desc {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* 执行按钮 */
    .execute-btn {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 398px;
      padding: 14px 24px;
      background: var(--primary-gradient);
      color: white;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      transition: all 0.2s;
    }

    .execute-btn:active {
      transform: translateX(-50%) scale(0.98);
    }

    .execute-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 提示信息 */
    .info-text {
      font-size: 12px;
      color: var(--text-tertiary);
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 导航栏 -->
    <div class="nav-header">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="nav-title">模型与技能</div>
    </div>

    <!-- Tab 切换 -->
    <div class="tab-bar">
      <button class="tab-item active" onclick="switchTab('model')" data-tab="model">模型</button>
      <button class="tab-item" onclick="switchTab('skill')" data-tab="skill">技能</button>
    </div>

    <!-- 内容区域 -->
    <div class="content-area">
      <!-- 模型 Tab -->
      <div class="tab-content active" id="modelTab">
        <div class="card">
          <div class="card-title">当前模型</div>
          <div class="model-item active" data-model="qianwen">
            <div class="model-icon">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 16v-4"/>
                <path d="M12 8h.01"/>
              </svg>
            </div>
            <div class="model-info">
              <div class="model-name">千问 3.6</div>
              <div class="model-desc">高性能大语言模型，支持多轮对话</div>
            </div>
            <div class="model-status">
              <span class="status-dot"></span>
              <span>运行中</span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">可用模型</div>
          <div class="model-item" data-model="gpt4">
            <div class="model-icon" style="background: linear-gradient(135deg, #10B981, #059669);">
              <svg viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
              </svg>
            </div>
            <div class="model-info">
              <div class="model-name">GPT-4</div>
              <div class="model-desc">OpenAI 大语言模型</div>
            </div>
          </div>
          <div class="model-item" data-model="claude">
            <div class="model-icon" style="background: linear-gradient(135deg, #F59E0B, #D97706);">
              <svg viewBox="0 0 24 24">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
            </div>
            <div class="model-info">
              <div class="model-name">Claude 3</div>
              <div class="model-desc">Anthropic 大语言模型</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 技能 Tab -->
      <div class="tab-content" id="skillTab">
        <div class="card">
          <div class="card-title">已启用技能</div>
          <div class="skill-grid">
            <div class="skill-item active" data-skill="document">
              <div class="skill-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
              </div>
              <div class="skill-name">文档处理</div>
              <div class="skill-desc">解析各类文档</div>
            </div>
            <div class="skill-item active" data-skill="data">
              <div class="skill-icon">
                <svg viewBox="0 0 24 24">
                  <line x1="18" y1="20" x2="18" y2="10"/>
                  <line x1="12" y1="20" x2="12" y2="4"/>
                  <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
              </div>
              <div class="skill-name">数据分析</div>
              <div class="skill-desc">智能数据分析</div>
            </div>
            <div class="skill-item active" data-skill="image">
              <div class="skill-icon">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
              </div>
              <div class="skill-name">图像识别</div>
              <div class="skill-desc">识别图像内容</div>
            </div>
            <div class="skill-item active" data-skill="voice">
              <div class="skill-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                  <line x1="12" y1="19" x2="12" y2="23"/>
                  <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
              </div>
              <div class="skill-name">语音识别</div>
              <div class="skill-desc">语音转文字</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">更多技能</div>
          <div class="skill-grid">
            <div class="skill-item" data-skill="ocr">
              <div class="skill-icon" style="background: linear-gradient(135deg, #8B5CF6, #7C3AED);">
                <svg viewBox="0 0 24 24">
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
              </div>
              <div class="skill-name">OCR识别</div>
              <div class="skill-desc">文字识别提取</div>
            </div>
            <div class="skill-item" data-skill="translate">
              <div class="skill-icon" style="background: linear-gradient(135deg, #EC4899, #DB2777);">
                <svg viewBox="0 0 24 24">
                  <path d="M5 8l6 6M4 14l6-6 2-3"/>
                  <path d="M2 5h12M2 19h12"/>
                  <path d="M18 8l3 3-3 3"/>
                  <path d="M21 11h-6"/>
                </svg>
              </div>
              <div class="skill-name">智能翻译</div>
              <div class="skill-desc">多语言翻译</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 执行按钮 -->
    <button class="execute-btn" id="executeBtn" onclick="executeAction()">应用配置</button>
  </div>

  <script>
    // 返回上一页
    function goBack() {
      const source = sessionStorage.getItem('modelSkillSource') || 'home.html';
      const sourceTab = sessionStorage.getItem('modelSkillSourceTab') || 'page-profile';
      if (source === 'home.html' && sourceTab) {
        window.location.href = source + '?tab=' + sourceTab.replace('page-', '');
      } else {
        window.location.href = source;
      }
    }

    // Tab 切换
    function switchTab(tab) {
      // 更新 Tab 按钮状态
      document.querySelectorAll('.tab-item').forEach(item => {
        item.classList.remove('active');
      });
      document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');

      // 更新内容区域
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
      });
      document.getElementById(tab + 'Tab').classList.add('active');

      // 更新按钮文字
      updateExecuteButton();
    }

    // 模型选择
    let selectedModel = 'qianwen';
    document.querySelectorAll('.model-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.model-item').forEach(m => m.classList.remove('active'));
        this.classList.add('active');
        selectedModel = this.dataset.model;
        updateExecuteButton();
      });
    });

    // 技能选择
    let selectedSkills = ['document', 'data', 'image', 'voice'];
    document.querySelectorAll('.skill-item').forEach(item => {
      item.addEventListener('click', function() {
        const skill = this.dataset.skill;
        if (this.classList.contains('active')) {
          this.classList.remove('active');
          selectedSkills = selectedSkills.filter(s => s !== skill);
        } else {
          this.classList.add('active');
          selectedSkills.push(skill);
        }
        updateExecuteButton();
      });
    });

    // 更新执行按钮文字
    function updateExecuteButton() {
      const btn = document.getElementById('executeBtn');
      const activeTab = document.querySelector('.tab-item.active').dataset.tab;
      if (activeTab === 'model') {
        btn.textContent = '切换模型';
      } else {
        btn.textContent = `应用技能 (${selectedSkills.length})`;
      }
    }

    // 执行操作
    function executeAction() {
      const activeTab = document.querySelector('.tab-item.active').dataset.tab;
      if (activeTab === 'model') {
        showToast(`已切换到模型: ${getModelName(selectedModel)}`);
      } else {
        showToast(`已应用 ${selectedSkills.length} 个技能`);
      }
    }

    // 获取模型名称
    function getModelName(model) {
      const names = {
        'qianwen': '千问 3.6',
        'gpt4': 'GPT-4',
        'claude': 'Claude 3'
      };
      return names[model] || model;
    }

    // 显示提示
    function showToast(message) {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(15, 23, 42, 0.9);
        color: white;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 14px;
        z-index: 9999;
        animation: fadeIn 0.2s ease;
      `;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'fadeOut 0.2s ease';
        setTimeout(() => toast.remove(), 200);
      }, 2000);
    }

    // 初始化
    updateExecuteButton();
  </script>
</body>
</html>
