<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>认证与设备绑定 - 个人小鲸鱼-数字大脑</title>
  <script>
    // 在页面渲染前应用主题，防止闪烁
    (function() {
      const savedTheme = localStorage.getItem('app_theme_mode');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme === 'system' ? (systemDark ? 'dark' : 'light') : (savedTheme || 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root,
    html[data-theme="dark"] {
      --bg-primary: linear-gradient(180deg, #0a1628 0%, #0d1f3a 50%, #0a1628 100%);
      --bg-card: rgba(30, 58, 138, 0.25);
      --bg-card-hover: rgba(37, 99, 235, 0.3);
      --border-card: rgba(37, 99, 235, 0.4);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-tertiary: rgba(255, 255, 255, 0.5);
      --accent-blue: #2563eb;
      --accent-blue-light: #60a5fa;
      --success: #10b981;
      --warning: #f59e0b;
    }

    /* 浅色模式 - 冷白灰蓝科技风 */
    html[data-theme="light"] {
      --bg-primary: linear-gradient(180deg, #F6F9FC 0%, #F3F7FB 50%, #F6F9FC 100%);
      --bg-card: #FFFFFF;
      --bg-card-hover: #FBFDFF;
      --border-card: #D7E6FF;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-tertiary: #7C8CA5;
      --accent-blue: #4A8DFF;
      --accent-blue-light: #6BA8FF;
      --success: #1BD4A0;
      --warning: #D97706;
      --shadow-card: 0 8px 24px rgba(67, 97, 168, 0.06);
      --shadow-card-hover: 0 12px 32px rgba(67, 97, 168, 0.10);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      overflow-x: hidden;
    }
    
    /* 手机容器 */
    .app-container {
      max-width: 430px;
      min-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 40px;
    }
    
    /* 顶部栏 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-card);
      background: rgba(10, 22, 40, 0.95);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header .back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      text-decoration: none;
      color: var(--accent-blue);
    }
    
    .header .title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .header .placeholder {
      width: 60px;
    }
    
    /* 主内容区 */
    .main-content {
      padding: 20px 16px;
    }
    
    /* 卡片基础样式 */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    
    /* 账号状态区 */
    .account-status {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .status-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
    }
    
    .status-icon svg {
      width: 24px;
      height: 24px;
      color: white;
    }
    
    .status-info h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--success);
    }
    
    .status-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
    }
    
    /* 智能体信息区 */
    .agent-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .agent-avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.3) 0%, rgba(6, 182, 212, 0.3) 100%);
      border: 1px solid rgba(37, 99, 235, 0.4);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .agent-avatar svg {
      width: 24px;
      height: 24px;
      color: var(--accent-blue-light);
    }
    
    .agent-details h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--accent-blue-light);
    }
    
    .agent-details p {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    
    /* 设备链接区 */
    .link-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    
    .link-label {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }
    
    .link-value {
      font-size: 12px;
      color: var(--text-secondary);
      word-break: break-all;
      line-height: 1.6;
      font-family: 'SF Mono', Monaco, monospace;
    }
    
    /* 绑定状态区 */
    .bind-status-card {
      text-align: center;
      padding: 24px 20px;
    }
    
    .bind-status-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    
    .bind-status-icon.pending {
      background: rgba(245, 158, 11, 0.15);
      border: 2px solid rgba(245, 158, 11, 0.3);
    }
    
    .bind-status-icon.bound {
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid rgba(16, 185, 129, 0.3);
    }
    
    .bind-status-icon svg {
      width: 28px;
      height: 28px;
    }
    
    .bind-status-icon.pending svg {
      color: var(--warning);
    }
    
    .bind-status-icon.bound svg {
      color: var(--success);
    }
    
    .bind-status-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .bind-status-title.pending {
      color: var(--warning);
    }
    
    .bind-status-title.bound {
      color: var(--success);
    }
    
    .bind-status-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    /* 按钮样式 */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }
    
    .btn-secondary {
      background: rgba(37, 99, 235, 0.2);
      color: var(--accent-blue-light);
      border: 1px solid rgba(37, 99, 235, 0.4);
    }
    
    .btn-secondary:hover {
      background: rgba(37, 99, 235, 0.3);
    }
    
    .btn-success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
    }
    
    .btn-success:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
    
    .btn-outline {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-card);
    }
    
    .btn-outline:hover {
      background: rgba(37, 99, 235, 0.1);
    }
    
    /* 操作区 */
    .actions-section {
      margin-top: 8px;
    }
    
    /* Toast 提示 */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(16, 185, 129, 0.95);
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    
    .toast.active {
      opacity: 1;
    }
    
    .toast.error {
      background: rgba(239, 68, 68, 0.95);
    }
    
    /* 信息行 */
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(37, 99, 235, 0.2);
    }
    
    .info-row:last-child {
      border-bottom: none;
    }
    
    .info-row-label {
      font-size: 13px;
      color: var(--text-tertiary);
    }
    
    .info-row-value {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }
    
    .info-row-value.highlight {
      color: var(--accent-blue-light);
    }
  </style>
  <script src="js/utils/storage.js"></script>
  <script src="js/services/themeService.js"></script>
  <script src="js/utils/navigation.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- 顶部栏 -->
    <div class="header">
      <a href="home.html?tab=profile" class="back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <span class="title">认证与设备绑定</span>
      <div class="placeholder"></div>
    </div>
    
    <!-- 主内容区 -->
    <div class="main-content">
      <!-- 账号状态区 -->
      <div class="card">
        <div class="card-title">账号状态</div>
        <div class="account-status">
          <div class="status-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="status-info">
            <h3 id="accountName">adminA</h3>
            <span class="status-badge" id="authStatusBadge">已认证</span>
          </div>
        </div>
      </div>
      
      <!-- 智能体信息区 -->
      <!-- 设备链接区 -->
      <div class="card">
        <div class="card-title">设备名称</div>
        <div class="link-box">
          <div class="link-label">设备接入链接</div>
          <div class="link-value" id="deviceLinkDisplay">http://30103215.nat123.top:41696/?token=29a71586190952b0b107c63121d9fc112348b031f18565c0</div>
        </div>
        <button class="btn btn-secondary" id="copyLinkBtn">复制链接</button>
      </div>
      
      <!-- 绑定状态区 -->
      <div class="card bind-status-card" id="bindStatusCard">
        <div class="bind-status-icon pending" id="bindStatusIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <h3 class="bind-status-title pending" id="bindStatusTitle">待绑定</h3>
        <p class="bind-status-desc" id="bindStatusDesc">
          已为你分配专属智能体链接，请尽快完成绑定。
        </p>
      </div>
      
      <!-- 操作按钮区 -->
      <div class="actions-section" id="actionsSection">
        <button class="btn btn-success" id="markBoundBtn" style="display: none;">立即绑定</button>
        <a href="home.html?tab=profile" class="btn btn-outline" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">返回个人中心</a>
      </div>
    </div>
  </div>
  
  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>
  
  <script>
    // 检查登录状态
    function checkLoginStatus() {
      const isLoggedIn = Storage.Auth.isLoggedIn() || Storage.getSession('auth_is_logged_in');
      if (!isLoggedIn) {
        Navigation.replaceTo('index.html');
        return false;
      }
      return true;
    }
    
    checkLoginStatus();
    
    // 获取账号数据
    const accountData = Storage.getSession('auth_account_data') || Storage.get('auth_account_data');
    
    // DOM 元素
    const accountNameEl = document.getElementById('accountName');
    const authStatusBadgeEl = document.getElementById('authStatusBadge');
    const agentNameDisplayEl = document.getElementById('agentNameDisplay');
    const deviceLinkDisplayEl = document.getElementById('deviceLinkDisplay');
    const bindStatusCardEl = document.getElementById('bindStatusCard');
    const bindStatusIconEl = document.getElementById('bindStatusIcon');
    const bindStatusTitleEl = document.getElementById('bindStatusTitle');
    const bindStatusDescEl = document.getElementById('bindStatusDesc');
    const markBoundBtnEl = document.getElementById('markBoundBtn');
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    const toast = document.getElementById('toast');
    
    // 初始化页面数据
    function initPage() {
      if (accountData) {
        accountNameEl.textContent = accountData.username;
        agentNameDisplayEl.textContent = accountData.agentName || '小鲸鱼智能体';
        deviceLinkDisplayEl.textContent = accountData.deviceLink || '暂无专属链接';
        
        // 更新认证状态
        if (accountData.verified) {
          authStatusBadgeEl.textContent = '已认证';
        } else {
          authStatusBadgeEl.textContent = '待认证';
          authStatusBadgeEl.style.color = 'var(--warning)';
        }
        
        // 更新绑定状态显示
        updateBindStatusDisplay(accountData.bindStatus);
      }
    }
    
    // 更新绑定状态显示
    function updateBindStatusDisplay(status) {
      if (status === 'bound') {
        // 已绑定状态
        bindStatusIconEl.classList.remove('pending');
        bindStatusIconEl.classList.add('bound');
        bindStatusIconEl.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        `;
        bindStatusTitleEl.textContent = '已绑定';
        bindStatusTitleEl.classList.remove('pending');
        bindStatusTitleEl.classList.add('bound');
        bindStatusDescEl.textContent = '专属智能体已完成绑定，可进入后续使用流程。';
        
        // 隐藏操作按钮
        markBoundBtnEl.style.display = 'none';
      } else if (status === 'pending') {
        // 待绑定状态
        bindStatusIconEl.classList.remove('bound');
        bindStatusIconEl.classList.add('pending');
        bindStatusIconEl.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        `;
        bindStatusTitleEl.textContent = '待绑定';
        bindStatusTitleEl.classList.remove('bound');
        bindStatusTitleEl.classList.add('pending');
        bindStatusDescEl.textContent = '已为你分配专属智能体链接，请尽快完成绑定。';
        
        // 显示操作按钮
        markBoundBtnEl.style.display = 'block';
      } else {
        // 无需绑定
        bindStatusTitleEl.textContent = '无需绑定';
        bindStatusDescEl.textContent = '当前账号无需绑定设备。';
        markBoundBtnEl.style.display = 'none';
      }
    }
    
    // 显示 Toast
    function showToast(message, isError = false) {
      toast.textContent = message;
      toast.className = 'toast' + (isError ? ' error' : '');
      toast.classList.add('active');
      setTimeout(() => {
        toast.classList.remove('active');
      }, 2000);
    }
    
    // 复制链接
    copyLinkBtn.addEventListener('click', function() {
      const link = deviceLinkDisplayEl.textContent;
      if (link && link !== '暂无专属链接') {
        navigator.clipboard.writeText(link).then(() => {
          showToast('已复制链接');
        }).catch(() => {
          const textArea = document.createElement('textarea');
          textArea.value = link;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          showToast('已复制链接');
        });
      } else {
        showToast('暂无链接可复制', true);
      }
    });
    
    // 标记为已绑定（Mock 演示用）
    markBoundBtnEl.addEventListener('click', function() {
      if (accountData) {
        // 更新绑定状态
        accountData.bindStatus = 'bound';
        
        // 保存到存储
        const rememberMe = Storage.get('auth_is_logged_in') === 'true';
        if (rememberMe) {
          Storage.Auth.setAccountData(accountData);
        } else {
          Storage.setSession('auth_account_data', accountData);
        }
        
        // 更新页面显示
        updateBindStatusDisplay('bound');
        showToast('设备绑定成功');
      }
    });

    // 初始化主题
    ThemeManager.init();

    // 初始化页面
    initPage();
  </script>
</body>
</html>
