<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>词元充值 - 个人萤火虫-数字大脑</title>
  <script>
    // 在页面渲染前应用主题，防止闪烁
    (function() {
      const savedTheme = localStorage.getItem('app_theme_mode');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme === 'system' ? (systemDark ? 'dark' : 'light') : (savedTheme || 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root,
    html[data-theme="dark"] {
      --bg-primary: linear-gradient(180deg, #0a1628 0%, #0d1f3a 50%, #0a1628 100%);
      --bg-card: rgba(30, 58, 138, 0.25);
      --bg-card-hover: rgba(37, 99, 235, 0.3);
      --bg-input: rgba(15, 23, 42, 0.6);
      --border-card: rgba(37, 99, 235, 0.4);
      --border-input: rgba(37, 99, 235, 0.3);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-tertiary: rgba(255, 255, 255, 0.5);
      --accent-blue: #2563eb;
      --accent-blue-light: #60a5fa;
      --accent-cyan: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
    }

    /* 浅色模式 - 冷白灰蓝科技风 */
    html[data-theme="light"] {
      --bg-primary: #F6FAFF;
      --bg-secondary: #F5F9FF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #FBFDFF;
      --bg-input: #F8FAFC;
      --border-card: #E8F0FF;
      --border-input: #BFD7FF;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-tertiary: #7C8CA5;
      --accent-blue: #4A8DFF;
      --accent-blue-light: #6BA8FF;
      --accent-cyan: #0891B2;
      --success: #1BD4A0;
      --warning: #D97706;
      --shadow-card: 0 8px 24px rgba(67, 97, 168, 0.06);
      --shadow-card-hover: 0 12px 32px rgba(67, 97, 168, 0.10);
    }

    html[data-theme="light"] body {
      background: var(--bg-primary);
    }

    /* 浅色模式页眉 */
    html[data-theme="light"] .header {
      background: rgba(246, 250, 255, 0.95);
      border-bottom: 1px solid var(--border-card);
    }

    html[data-theme="light"] .header .back,
    html[data-theme="light"] .header .title,
    html[data-theme="light"] .header .skip {
      color: var(--text-primary);
    }

    html[data-theme="light"] .header .subtitle {
      color: var(--text-secondary);
    }

    /* 浅色模式金额选项 */
    html[data-theme="light"] .amount-item {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
    }

    html[data-theme="light"] .amount-item:hover {
      border-color: var(--accent-blue);
      background: rgba(74, 141, 255, 0.05);
    }

    html[data-theme="light"] .amount-item.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    html[data-theme="light"] .amount-item.active .price {
      color: #FFFFFF;
    }

    /* 浅色模式自定义金额输入 */
    html[data-theme="light"] .custom-input-wrapper {
      background: var(--bg-input);
      border-color: var(--border-input);
    }

    html[data-theme="light"] .custom-input-wrapper .yuan {
      color: var(--text-secondary);
    }

    html[data-theme="light"] .custom-input-wrapper input {
      color: var(--text-primary);
      background: transparent;
    }

    /* 浅色模式词元钱包卡 */
    html[data-theme="light"] .wallet-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
    }

    html[data-theme="light"] .wallet-card .card-title {
      color: var(--text-secondary);
    }

    html[data-theme="light"] .wallet-card .card-title svg {
      stroke: var(--accent-blue);
    }

    html[data-theme="light"] .wallet-card .balance-item .label {
      color: var(--text-tertiary);
    }

    html[data-theme="light"] .wallet-card .balance-item .value {
      color: var(--text-primary);
    }

    html[data-theme="light"] .wallet-card .token-info {
      border-top-color: var(--border-card);
    }

    html[data-theme="light"] .wallet-card .token-info .label {
      color: var(--text-tertiary);
    }

    html[data-theme="light"] .wallet-card .token-info .value {
      color: var(--accent-cyan);
    }

    html[data-theme="light"] .wallet-card .desc {
      color: var(--text-tertiary);
    }

    /* 浅色模式代金券卡 */
    html[data-theme="light"] .voucher-card {
      background: var(--bg-card);
      border-color: var(--border-card);
    }

    html[data-theme="light"] .voucher-card .left .icon {
      background: var(--brand-soft, rgba(74, 141, 255, 0.1));
    }

    html[data-theme="light"] .voucher-card .left .icon svg {
      stroke: var(--accent-blue);
    }

    html[data-theme="light"] .voucher-card .voucher-info .voucher-label {
      color: var(--text-tertiary);
    }

    html[data-theme="light"] .voucher-card .voucher-info .voucher-value {
      color: var(--text-primary);
    }

    html[data-theme="light"] .voucher-card .redeem-btn {
      background: var(--accent-blue);
      color: #FFFFFF;
    }

    /* 浅色模式按钮 */
    html[data-theme="light"] .voucher-card .btn {
      background: rgba(74, 141, 255, 0.1);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    html[data-theme="light"] .voucher-card .btn:hover {
      background: var(--accent-blue);
      color: #FFFFFF;
    }

    html[data-theme="light"] .corporate-section .btn {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    html[data-theme="light"] .corporate-section .btn:hover {
      background: rgba(74, 141, 255, 0.1);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      overflow-x: hidden;
    }
    
    .app-container {
      max-width: 430px;
      min-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 40px;
    }
    
    /* 顶部栏 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-card);
      background: rgba(10, 22, 40, 0.95);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header .back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      text-decoration: none;
      color: var(--accent-blue);
    }
    
    .header .title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .header .detail {
      font-size: 13px;
      color: var(--accent-blue-light);
      text-decoration: none;
      padding: 6px 12px;
    }
    
    /* 主内容区 */
    .main-content {
      flex: 1;
      padding: 16px;
    }
    
    /* 钱包总览卡 */
    .wallet-card {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.35) 0%, rgba(30, 58, 138, 0.5) 100%);
      border: 1px solid rgba(37, 99, 235, 0.5);
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    
    .wallet-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.2) 0%, transparent 70%);
    }
    
    .wallet-card .card-title {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .wallet-card .balance-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    
    .wallet-card .balance-item {
      flex: 1;
    }
    
    .wallet-card .balance-item .label {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }
    
    .wallet-card .balance-item .value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
    }
    
    .wallet-card .token-info {
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .wallet-card .token-info .label {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    
    .wallet-card .token-info .value {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent-cyan);
    }
    
    .wallet-card .desc {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 12px;
      line-height: 1.5;
    }
    
    /* 代金券卡 */
    .voucher-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .voucher-card .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .voucher-card .icon {
      width: 40px;
      height: 40px;
      background: rgba(245, 158, 11, 0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .voucher-card .icon svg {
      width: 20px;
      height: 20px;
      color: var(--warning);
    }
    
    .voucher-card .info .title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    
    .voucher-card .info .count {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    
    .voucher-card .btn {
      padding: 8px 16px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 8px;
      font-size: 12px;
      color: var(--accent-blue-light);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .voucher-card .btn:hover {
      background: rgba(37, 99, 235, 0.3);
    }
    
    /* 充值区 */
    .topup-section {
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text-primary);
    }
    
    .amount-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    
    .amount-item {
      padding: 16px 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .amount-item:hover,
    .amount-item.active {
      background: rgba(37, 99, 235, 0.25);
      border-color: var(--accent-blue);
    }
    
    .amount-item .price {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    
    .amount-item .token {
      display: none;
    }
    
    /* 自定义金额 */
    .custom-amount {
      margin-bottom: 20px;
    }
    
    .custom-amount .label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    
    .custom-input-wrapper {
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 12px;
      padding: 0 16px;
      height: 52px;
    }
    
    .custom-input-wrapper .prefix {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-right: 8px;
    }
    
    .custom-input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 600;
    }
    
    .custom-input-wrapper input::placeholder {
      color: var(--text-tertiary);
      font-size: 14px;
      font-weight: 400;
    }
    
    /* 支付方式 */
    .payment-section {
      margin-bottom: 20px;
    }
    
    .payment-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
    }
    
    .payment-item .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .payment-item .icon {
      width: 28px;
      height: 28px;
      background: #10b981;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .payment-item .icon svg {
      width: 16px;
      height: 16px;
      color: white;
    }
    
    .payment-item .name {
      font-size: 14px;
      font-weight: 500;
    }
    
    .payment-item .check {
      width: 20px;
      height: 20px;
      background: var(--accent-blue);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .payment-item .check svg {
      width: 12px;
      height: 12px;
      color: white;
    }
    
    /* 协议确认 */
    .agreement {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
      padding: 0 4px;
    }
    
    .agreement input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--accent-blue);
    }
    
    .agreement .text {
      font-size: 12px;
      color: var(--text-tertiary);
      line-height: 1.5;
    }
    
    .agreement .text a {
      color: var(--accent-blue-light);
      text-decoration: none;
    }
    
    /* 充值按钮 */
    .topup-btn {
      width: 100%;
      padding: 16px;
      background: var(--accent-blue);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 24px;
    }
    
    .topup-btn:hover {
      background: var(--accent-blue-light);
    }
    
    .topup-btn:disabled {
      background: rgba(37, 99, 235, 0.3);
      cursor: not-allowed;
    }
    
    /* 对公转账 */
    .corporate-section {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    
    .corporate-section .title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .corporate-section .desc {
      font-size: 12px;
      color: var(--text-tertiary);
      line-height: 1.6;
      margin-bottom: 16px;
    }
    
    .corporate-section .btn {
      display: inline-block;
      padding: 10px 24px;
      background: transparent;
      border: 1px solid var(--border-card);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.2s;
    }
    
    .corporate-section .btn:hover {
      background: rgba(37, 99, 235, 0.1);
      border-color: var(--accent-blue);
      color: var(--accent-blue-light);
    }
    
    /* 安全区适配 */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .app-container {
        padding-bottom: calc(40px + env(safe-area-inset-bottom));
      }
    }

    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text-primary);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1001;
      pointer-events: none;
      text-align: center;
      max-width: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    html[data-theme="light"] .toast {
      background: #FFFFFF;
      border: 1px solid #D7E6FF;
      color: #0F172A;
      box-shadow: 0 8px 24px rgba(67, 97, 168, 0.12);
    }

    /* 深色模式覆盖 */
    html[data-theme="dark"] body {
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    html[data-theme="dark"] .header {
      background: var(--bg-card);
      border-bottom-color: var(--border-card);
    }

    html[data-theme="dark"] .header .back,
    html[data-theme="dark"] .header .title,
    html[data-theme="dark"] .header .skip {
      color: var(--text-primary);
    }

    html[data-theme="dark"] .header .subtitle {
      color: var(--text-secondary);
    }

    html[data-theme="dark"] .amount-item {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
    }

    html[data-theme="dark"] .amount-item:hover {
      border-color: var(--accent-blue);
    }

    html[data-theme="dark"] .amount-item.active {
      background: rgba(74, 141, 255, 0.15);
      border-color: var(--accent-blue);
    }

    html[data-theme="dark"] .amount-item .price {
      color: var(--text-primary);
    }

    html[data-theme="dark"] .amount-item.active .price {
      color: var(--accent-blue);
    }

    html[data-theme="dark"] .custom-input-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
    }

    html[data-theme="dark"] .custom-input-wrapper .yuan {
      color: var(--text-secondary);
    }

    html[data-theme="dark"] .custom-input-wrapper input {
      color: var(--text-primary);
    }

    html[data-theme="dark"] .wallet-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
    }

    html[data-theme="dark"] .wallet-card .card-title {
      color: var(--text-primary);
    }

    html[data-theme="dark"] .wallet-card .card-title svg {
      stroke: var(--accent-blue);
    }

    html[data-theme="dark"] .wallet-card .balance-item .label {
      color: var(--text-secondary);
    }

    html[data-theme="dark"] .wallet-card .balance-item .value {
      color: var(--text-primary);
    }

    html[data-theme="dark"] .wallet-card .token-info {
      background: rgba(74, 141, 255, 0.1);
    }

    html[data-theme="dark"] .wallet-card .token-info .label {
      color: var(--text-secondary);
    }

    html[data-theme="dark"] .wallet-card .token-info .value {
      color: var(--accent-blue);
    }

    html[data-theme="dark"] .wallet-card .desc {
      color: var(--text-tertiary);
    }

    html[data-theme="dark"] .voucher-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
    }

    html[data-theme="dark"] .voucher-card .left .icon {
      background: rgba(74, 141, 255, 0.15);
    }

    html[data-theme="dark"] .voucher-card .left .icon svg {
      stroke: var(--accent-blue);
    }

    html[data-theme="dark"] .voucher-card .voucher-info .voucher-label {
      color: var(--text-secondary);
    }

    html[data-theme="dark"] .voucher-card .voucher-info .voucher-value {
      color: var(--text-primary);
    }

    html[data-theme="dark"] .voucher-card .redeem-btn {
      background: rgba(74, 141, 255, 0.15);
      color: var(--accent-blue);
    }

    html[data-theme="dark"] .voucher-card .btn {
      background: var(--accent-blue);
      color: #FFFFFF;
    }

    html[data-theme="dark"] .corporate-section .btn {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
    }

    html[data-theme="dark"] .toast {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
  </style>
  <script src="js/utils/storage.js"></script>
  <script src="js/services/themeService.js"></script>
  <script src="js/utils/navigation.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- 顶部栏 -->
    <header class="header">
      <a href="home.html" class="back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <span class="title">充值</span>
      <a href="#" class="detail">充值明细</a>
    </header>
    
    <!-- Toast 提示 -->
    <div id="toast" class="toast">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>正在开发</span>
    </div>
    
    <!-- 主内容 -->
    <main class="main-content">
      <!-- 钱包总览卡 -->
      <div class="wallet-card">
        <div class="card-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="6" width="20" height="12" rx="2"/><path d="M22 10H2"/><path d="M6 18v2"/><path d="M18 18v2"/>
          </svg>
          词元钱包
        </div>
        <div class="balance-row">
          <div class="balance-item">
            <div class="label">余额</div>
            <div class="value">¥0.00</div>
          </div>
          <div class="balance-item">
            <div class="label">额度</div>
            <div class="value">¥0.00</div>
          </div>
        </div>

        <div class="desc">充值后可用于词元购买、能力调用与相关服务</div>
      </div>
      
      <!-- 代金券卡 -->
      <div class="voucher-card">
        <div class="left">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="6" width="18" height="12" rx="2"/>
              <path d="M8 6v12"/>
              <path d="M16 6v12"/>
              <circle cx="12" cy="12" r="2"/>
            </svg>
          </div>
          <div class="info">
            <div class="title">代金券</div>
            <div class="count">1 张可用</div>
          </div>
        </div>
        <button class="btn">查看权益</button>
      </div>
      
      <!-- 在线充值区 -->
      <div class="topup-section">
        <div class="section-title">在线充值</div>
        <div class="amount-grid">
          <div class="amount-item active" data-amount="100">
            <div class="price">¥100</div>
          </div>
          <div class="amount-item" data-amount="300">
            <div class="price">¥300</div>
          </div>
          <div class="amount-item" data-amount="500">
            <div class="price">¥500</div>
          </div>
          <div class="amount-item" data-amount="1000">
            <div class="price">¥1000</div>
          </div>
          <div class="amount-item" data-amount="3000">
            <div class="price">¥3000</div>
          </div>
          <div class="amount-item" data-amount="5000">
            <div class="price">¥5000</div>
          </div>
        </div>
      </div>
      
      <!-- 自定义金额 -->
      <div class="custom-amount">
        <div class="label">其他金额</div>
        <div class="custom-input-wrapper">
          <span class="prefix">¥</span>
          <input type="number" placeholder="点击输入金额" id="customAmount">
        </div>
      </div>
      
      <!-- 支付方式 -->
      <div class="payment-section">
        <div class="section-title">支付方式</div>
        <div class="payment-item">
          <div class="left">
            <div class="icon" style="background: #07C160;">
              <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <path d="M8.5,13.5A1.5,1.5 0 1,0 10,15A1.5,1.5 0 0,0 8.5,13.5M14.5,13.5A1.5,1.5 0 1,0 16,15A1.5,1.5 0 0,0 14.5,13.5M12,2C6.5,2 2,6 2,10.5C2,13 3.5,15.5 6,17V22L10.5,18.5C11,18.5 11.5,18.5 12,18.5C17.5,18.5 22,14.5 22,10C22,5.5 17.5,2 12,2Z"/>
              </svg>
            </div>
            <span class="name">微信支付</span>
          </div>
          <div class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
        </div>
      </div>
      
      <!-- 协议确认 -->
      <div class="agreement">
        <input type="checkbox" id="agreement" checked>
        <label for="agreement" class="text">
          确认支付即代表同意平台<a href="#">《充值协议》</a>
        </label>
      </div>
      
      <!-- 充值按钮 -->
      <button class="topup-btn" id="topupBtn">立即充值</button>
      
      <!-- 对公转账 -->
      <div class="corporate-section">
        <div class="title">对公转账</div>
        <div class="desc">如需企业充值或大额充值，请联系平台客服获取对公转账信息。</div>
        <a href="#" class="btn">联系客服</a>
      </div>
    </main>
  </div>
  
  <script>
    // 金额选择
    const amountItems = document.querySelectorAll('.amount-item');
    const customInput = document.getElementById('customAmount');
    
    amountItems.forEach(item => {
      item.addEventListener('click', () => {
        amountItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        customInput.value = '';
      });
    });
    
    // 自定义金额输入时取消选中固定金额
    customInput.addEventListener('input', () => {
      if (customInput.value) {
        amountItems.forEach(i => i.classList.remove('active'));
      }
    });
    
    // 充值按钮
    document.getElementById('topupBtn').addEventListener('click', () => {
      const activeAmount = document.querySelector('.amount-item.active');
      const customValue = customInput.value;
      
      if (!activeAmount && !customValue) {
        alert('请选择或输入充值金额');
        return;
      }
      
      const amount = activeAmount ? activeAmount.dataset.amount : customValue;
      alert(`确认充值 ¥${amount}？`);
    });
    
    // 检查登录状态
    function checkLoginStatus() {
      const isLoggedIn = Storage.Auth.isLoggedIn() || Storage.getSession('auth_is_logged_in');
      if (!isLoggedIn) {
        Navigation.replaceTo('index.html');
        return false;
      }
      return true;
    }

    // 初始化主题
    ThemeManager.init();
    
    // 页面加载时检查登录状态
    checkLoginStatus();
    
    // 显示"正在开发"提示
    function showDevelopingToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }
    
    // 初始化未实现功能的点击事件
    document.addEventListener('DOMContentLoaded', function() {
      // 充值明细
      document.querySelector('.detail').addEventListener('click', function(e) {
        e.preventDefault();
        showDevelopingToast();
      });
      
      // 联系客服
      document.querySelector('.btn').addEventListener('click', function(e) {
        e.preventDefault();
        showDevelopingToast();
      });
      
      // 充值协议
      document.querySelector('a[href="#"]').addEventListener('click', function(e) {
        e.preventDefault();
        showDevelopingToast();
      });
    });
  </script>
</body>
</html>
