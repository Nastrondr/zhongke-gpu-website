<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小龙虾设备对话</title>
  <link rel="icon" type="image/png" href="./apple-touch-icon2.png">
  <link rel="shortcut icon" type="image/png" href="./apple-touch-icon2.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon2.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon2.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="数字大脑">
  <meta name="application-name" content="数字大脑">
  <link rel="stylesheet" href="css/theme-variables.css">
  <link rel="stylesheet" href="css/device-chat.css">
</head>

<body>
  <!-- 顶部 -->
  <div class="header">
    <a href="device.html" class="header-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      返回
    </a>
    <div class="header-title">设备对话</div>
    <div class="header-status" id="serviceStatus"></div>
  </div>

  <!-- 设备信息 -->
  <div class="device-info">
    <div class="device-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <circle cx="15.5" cy="8.5" r="1.5"/>
        <circle cx="8.5" cy="15.5" r="1.5"/>
        <circle cx="15.5" cy="15.5" r="1.5"/>
      </svg>
    </div>
    <div class="device-detail">
      <div class="device-name" id="deviceName">加载中...</div>
      <div class="device-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">检查中...</span>
      </div>
    </div>
    <button class="device-reconnect-btn" onclick="handleAction('重新连接', '正在重新连接...')" title="重新连接">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    </button>
  </div>

  <!-- 快捷指令 -->
  <div class="quick-commands">
    <button class="quick-cmd" onclick="sendQuickCmd('状态查询')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      查状态
    </button>
    <button class="quick-cmd" id="testCmd" onclick="sendQuickCmd('1+1=?')" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      测试
    </button>
    <button class="quick-cmd" onclick="sendQuickCmd('你好')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"/></svg>
      打招呼
    </button>
    <button class="quick-cmd" onclick="handleSend('/new')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      新的会话
    </button>
  </div>

  <!-- 聊天容器 -->
  <div class="chat-container" id="chatContainer"></div>

  <!-- 输入框 -->
  <div class="input-area">
    <div class="chat-composer" id="chatComposer">
      <button class="multi-modal-btn" id="multiModalBtn" onclick="toggleAttachMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <textarea class="chat-input" id="chatInput" placeholder="输入设备指令或任务..." rows="1"></textarea>
      <button class="voice-btn" id="voiceBtn" type="button" onclick="handleVoiceClick()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button class="send-btn" id="sendBtn" onclick="isProcessing ? handlePause() : handleSend()">
        <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <rect x="6" y="4" width="4" height="16" rx="1"/>
          <rect x="14" y="4" width="4" height="16" rx="1"/>
        </svg>
        <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
        </svg>
      </button>
    </div>
    
    <!-- 多模态输入菜单（与whale-chat统一） -->
    <div class="attach-menu" id="attachMenu" style="display: none; position: fixed; bottom: 100px; left: 16px; right: 16px; background: var(--card-bg, #ffffff); border-radius: 16px; padding: 16px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); z-index: 9999;">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
        <div class="attach-option" onclick="handleMultimodalUpload('image')" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; background: var(--card-bg-soft, #f8f9fa); border-radius: 12px; cursor: pointer; transition: all 0.2s;">
          <div style="width: 40px; height: 40px; background: rgba(37, 99, 235, 0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <span style="font-size: 12px; color: var(--text-primary, #1f2937);">上传图片</span>
          <span style="font-size: 10px; color: var(--text-tertiary, #9ca3af);">截图、票据</span>
        </div>
        <div class="attach-option" onclick="handleMultimodalUpload('document')" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; background: var(--card-bg-soft, #f8f9fa); border-radius: 12px; cursor: pointer; transition: all 0.2s;">
          <div style="width: 40px; height: 40px; background: rgba(16, 185, 129, 0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
          </div>
          <span style="font-size: 12px; color: var(--text-primary, #1f2937);">上传文档</span>
          <span style="font-size: 10px; color: var(--text-tertiary, #9ca3af);">PDF、Word</span>
        </div>
        <div class="attach-option" onclick="handleMultimodalUpload('spreadsheet')" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; background: var(--card-bg-soft, #f8f9fa); border-radius: 12px; cursor: pointer; transition: all 0.2s;">
          <div style="width: 40px; height: 40px; background: rgba(245, 158, 11, 0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="3" y1="15" x2="21" y2="15"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </div>
          <span style="font-size: 12px; color: var(--text-primary, #1f2937);">上传表格</span>
          <span style="font-size: 10px; color: var(--text-tertiary, #9ca3af);">Excel、CSV</span>
        </div>
        <div class="attach-option" onclick="handleMultimodalUpload('scan')" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; background: var(--card-bg-soft, #f8f9fa); border-radius: 12px; cursor: pointer; transition: all 0.2s;">
          <div style="width: 40px; height: 40px; background: rgba(139, 92, 246, 0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </div>
          <span style="font-size: 12px; color: var(--text-primary, #1f2937);">扫描资料</span>
          <span style="font-size: 10px; color: var(--text-tertiary, #9ca3af);">调用设备扫描</span>
        </div>
        <div class="attach-option" onclick="handleMultimodalUpload('voice')" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; background: var(--card-bg-soft, #f8f9fa); border-radius: 12px; cursor: pointer; transition: all 0.2s;">
          <div style="width: 40px; height: 40px; background: rgba(236, 72, 153, 0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </div>
          <span style="font-size: 12px; color: var(--text-primary, #1f2937);">语音输入</span>
          <span style="font-size: 10px; color: var(--text-tertiary, #9ca3af);">后续开放</span>
        </div>
      </div>
    </div>
    
    <!-- 文件输入 -->
    <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.md,.markdown" style="display: none;" onchange="handleFileSelected(event)">
    <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)" hidden multiple>
  </div>

  <!-- 图片预览弹窗 -->
  <div class="image-preview-modal" id="imagePreviewModal" onclick="closeImagePreview(event)">
    <button class="close-btn" onclick="closeImagePreview()">×</button>
    <img id="previewImage" src="" alt="图片预览">
  </div>

  <!-- 依赖脚本 -->
  <script src="js/lib/marked.min.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/services/themeService.js"></script>
  <script src="js/utils/navigation.js"></script>
  <script src="js/utils/toast.js"></script>
  <script src="js/services/api/config.js"></script>
  <script src="js/services/api/ApiClient.js"></script>
  <script src="js/services/api/endpoints.js"></script>
  <script src="js/services/api/index.js"></script>
  <script src="js/services/deviceService.js"></script>
  <script src="js/services/openclawChatService.js"></script>

  <script src="js/pages/device-chat.js"></script>
</body>
</html>
