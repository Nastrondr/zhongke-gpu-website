<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>订单记录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root,
    html[data-theme="dark"] {
      --bg-primary: #0A0F1C;
      --bg-secondary: #10182A;
      --card-bg: #111C31;
      --card-hover: #16233D;
      --border-card: rgba(96, 165, 250, 0.28);
      --border-color: rgba(148, 163, 184, 0.16);
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-tertiary: #94A3B8;
      --brand-primary: #60A5FA;
      --brand-secondary: #3B82F6;
      --accent-blue: #60A5FA;
      --success: #22C55E;
      --warning: #F59E0B;
      --error: #EF4444;
      --pending: #F59E0B;
      --icon-bg: rgba(96, 165, 250, 0.1);
      --border-radius-sm: 10px;
      --border-radius: 16px;
      --shadow-card: none;
      --shadow-card-hover: none;
    }

    html[data-theme="light"] {
      --bg-primary: #F6FAFF;
      --bg-secondary: #F5F9FF;
      --card-bg: #FFFFFF;
      --card-hover: #FAFCFF;
      --border-card: #E8F0FF;
      --border-color: rgba(140, 170, 220, 0.12);
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-tertiary: #6B7A90;
      --brand-primary: #4A8DFF;
      --brand-secondary: #6BA8FF;
      --accent-blue: #2563EB;
      --success: #1BD4A0;
      --warning: #D97706;
      --error: #DC2626;
      --pending: #D97706;
      --icon-bg: #EAF3FF;
      --border-radius-sm: 10px;
      --border-radius: 16px;
      --shadow-card: 0 8px 24px rgba(67, 97, 168, 0.08);
      --shadow-card-hover: 0 12px 32px rgba(67, 97, 168, 0.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
    }

    .app-container {
      max-width: 430px;
      min-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .nav-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 8px;
      color: var(--accent-blue);
      transition: all 0.2s;
      text-decoration: none;
    }

    .back-btn:hover {
      background: rgba(96, 165, 250, 0.1);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
    }

    .nav-title h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .page-content {
      padding: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
    }

    .tab-item {
      flex: 1;
      text-align: center;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-item.active {
      background: var(--accent-blue);
      color: #fff;
      font-weight: 500;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .filter-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .filter-select {
      padding: 6px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
    }

    .filter-select:focus {
      outline: none;
      border-color: var(--accent-blue);
    }
  </style>
  <script src="js/services/api/config.js"></script>
  <script src="js/services/api/endpoints.js"></script>
  <script src="js/services/api/models.js"></script>
  <script src="js/services/api/ApiClient.js"></script>
  <script src="js/services/api/index.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="nav-header">
      <div class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="nav-title">
        <h1>订单记录</h1>
      </div>
    </div>

    <div class="page-content">
      <div class="tabs">
        <div class="tab-item active" onclick="switchTab('all')">全部</div>
        <div class="tab-item" onclick="switchTab('pending')">待支付</div>
        <div class="tab-item" onclick="switchTab('success')">已完成</div>
      </div>

      <div class="filter-bar">
        <span class="filter-label">共 <strong style="color: var(--accent-blue)" id="orderCount">0</strong> 条订单</span>
        <select class="filter-select" id="orderFilter" onchange="handleFilterChange()">
          <option value="priority">待支付优先</option>
          <option value="latest">最近下单</option>
          <option value="amount-desc">金额从高到低</option>
          <option value="amount-asc">金额从低到高</option>
        </select>
      </div>

      <div id="orderList">
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div class="empty-title">暂无订单</div>
        <div class="empty-desc">当前筛选条件下没有找到订单</div>
      </div>
    </div>

    <script>
      const FALLBACK_ORDERS = [
        {
          id: 'ORD20241215001',
          status: 'success',
          statusText: '已完成',
          title: 'NVIDIA RTX 4090 设备租用',
          desc: '设备型号：NVIDIA RTX 4090 | 租用时长：7天',
          time: '2024-12-15 14:30:22',
          quantity: '1台',
          price: 2800,
          icon: 'device'
        },
        {
          id: 'ORD20241218002',
          status: 'pending',
          statusText: '待支付',
          title: '智能问答技能包',
          desc: '技能版本：v2.0 | 有效期：永久',
          time: '2024-12-18 09:15:45',
          quantity: '1个',
          price: 1200,
          icon: 'skill'
        },
        {
          id: 'ORD20241220003',
          status: 'success',
          statusText: '已完成',
          title: '数据分析技能包',
          desc: '技能版本：v1.5 | 有效期：1年',
          time: '2024-12-20 16:45:30',
          quantity: '1个',
          price: 1200,
          icon: 'skill'
        },
        {
          id: 'ORD20241222004',
          status: 'cancelled',
          statusText: '已取消',
          title: 'AMD RX 7900 XTX 设备租用',
          desc: '设备型号：AMD RX 7900 XTX | 租用时长：30天',
          time: '2024-12-22 11:20:15',
          quantity: '2台',
          price: 12000,
          icon: 'device'
        },
        {
          id: 'ORD20241225005',
          status: 'success',
          statusText: '已完成',
          title: '图像识别技能包',
          desc: '技能版本：v3.0 | 有效期：永久',
          time: '2024-12-25 10:00:00',
          quantity: '1个',
          price: 2500,
          icon: 'skill'
        }
      ];

      let currentStatusFilter = 'all';
      let orders = [];

      function getStatusMapping(payStatus) {
        const mapping = {
          'PAID': { status: 'success', statusText: '已完成' },
          'UNPAID': { status: 'pending', statusText: '待支付' },
          'CANCELLED': { status: 'cancelled', statusText: '已取消' },
          'REFUNDED': { status: 'refunded', statusText: '已退款' }
        };
        return mapping[payStatus] || { status: 'success', statusText: '已完成' };
      }

      function convertApiOrder(order) {
        const statusInfo = getStatusMapping(order.payStatus);
        return {
          id: order.orderNo || order.id.toString(),
          status: statusInfo.status,
          statusText: statusInfo.statusText,
          title: order.type === 'DEVICE_RENT' ? `${order.attachJson ? JSON.parse(order.attachJson)?.deviceName || '设备租用' : '设备租用'}` : 
                 order.type === 'SKILL' ? `${order.attachJson ? JSON.parse(order.attachJson)?.skillName || '技能包' : '技能包'}` : '订单',
          desc: order.attachJson ? (() => {
            try {
              const attach = JSON.parse(order.attachJson);
              return Object.entries(attach).map(([k, v]) => `${k}: ${v}`).join(' | ') || '暂无描述';
            } catch {
              return '暂无描述';
            }
          })() : '暂无描述',
          time: order.payTime || order._creation_date || '',
          quantity: '1',
          price: order.amountTotal || 0,
          icon: order.type === 'DEVICE_RENT' ? 'device' : 'skill'
        };
      }

      async function loadOrders() {
        try {
          if (typeof Api === 'undefined') {
            console.warn('[OrderList] Api is not defined, using fallback orders');
            orders = [...FALLBACK_ORDERS];
            renderOrders(orders);
            return;
          }
          
          const userId = localStorage.getItem('userId') || '1';
          const response = await Api.Order.listByUser(userId, {
            pageNumber: 1,
            pageSize: 20,
            search: {}
          });
          
          if (response && response.success && response.rows && response.rows.length > 0) {
            orders = response.rows.map(convertApiOrder);
            renderOrders(orders);
          } else {
            console.warn('[OrderList] API returned empty or failed, using fallback');
            orders = [...FALLBACK_ORDERS];
            renderOrders(orders);
          }
        } catch (error) {
          console.error('[OrderList] load failed:', error);
          console.warn('[OrderList] using fallback orders');
          orders = [...FALLBACK_ORDERS];
          renderOrders(orders);
        }
      }

      function getIconHtml(iconType) {
        if (iconType === 'device') {
          return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>';
        }
        return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>';
      }

      function renderOrders(filteredOrders) {
        const orderList = document.getElementById('orderList');
        const emptyState = document.getElementById('emptyState');
        const orderCount = document.getElementById('orderCount');

        orderCount.textContent = filteredOrders.length;

        if (filteredOrders.length === 0) {
          orderList.style.display = 'none';
          emptyState.style.display = 'flex';
          return;
        }

        orderList.style.display = 'block';
        emptyState.style.display = 'none';

        orderList.innerHTML = filteredOrders.map(order => `
          <div class="order-card" onclick="showOrderDetail('${order.id}')">
            <div class="order-header">
              <span class="order-id">订单号：${order.id}</span>
              <span class="order-status ${order.status}">${order.statusText}</span>
            </div>
            <div class="order-body">
              <div class="order-item">
                <div class="order-icon">${getIconHtml(order.icon)}</div>
                <div class="order-info">
                  <div class="order-title">${order.title}</div>
                  <div class="order-desc">${order.desc}</div>
                  <div class="order-meta">
                    <span>${order.time}</span>
                    <span>数量：${order.quantity}</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="order-footer">
              <span class="order-total">订单总额</span>
              ${order.status === 'pending' ? `
                <div class="order-actions">
                  <button class="action-btn" onclick="cancelOrder('${order.id}'); event.stopPropagation();">取消订单</button>
                  <button class="action-btn primary" onclick="payOrder('${order.id}'); event.stopPropagation();">立即支付</button>
                </div>
              ` : `
                <span class="order-total-price"><span class="symbol">¥</span>${order.price.toLocaleString()}</span>
              `}
            </div>
          </div>
        `).join('');
      }

      function sortOrders(orders, sortBy) {
        const sorted = [...orders];
        switch (sortBy) {
          case 'priority':
            return sorted.sort((a, b) => {
              const priority = { pending: 0, success: 1, cancelled: 2, refunded: 3 };
              return priority[a.status] - priority[b.status];
            });
          case 'latest':
            return sorted.sort((a, b) => new Date(b.time) - new Date(a.time));
          case 'amount-desc':
            return sorted.sort((a, b) => b.price - a.price);
          case 'amount-asc':
            return sorted.sort((a, b) => a.price - b.price);
          default:
            return sorted;
        }
      }

      function filterOrders(status) {
        currentStatusFilter = status;
        const filterSelect = document.getElementById('orderFilter');
        
        let filtered = orders;
        if (status !== 'all') {
          filtered = orders.filter(order => order.status === status);
        }

        const sortBy = filterSelect.value;
        const sorted = sortOrders(filtered, sortBy);
        renderOrders(sorted);
      }

      function switchTab(status) {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        filterOrders(status);
      }

      function handleFilterChange() {
        filterOrders(currentStatusFilter);
      }

      function goBack() {
        window.history.back();
      }

      function showOrderDetail(orderId) {
        if (typeof Api === 'undefined') {
          alert('订单详情：' + orderId);
          return;
        }
        
        Api.Order.getDetail(orderId).then(response => {
          if (response && response.success) {
            alert('订单详情：\n' + JSON.stringify(response.data, null, 2));
          } else {
            alert('订单详情：' + orderId);
          }
        }).catch(() => {
          alert('订单详情：' + orderId);
        });
      }

      function payOrder(orderId) {
        if (typeof Api === 'undefined') {
          alert('正在跳转到支付页面...');
          return;
        }
        
        Api.Order.pay(orderId, 'WECHAT').then(response => {
          if (response && response.success) {
            alert('支付成功！');
            loadOrders();
          } else {
            alert('正在跳转到支付页面...');
          }
        }).catch(() => {
          alert('正在跳转到支付页面...');
        });
      }

      function cancelOrder(orderId) {
        if (confirm('确定要取消此订单吗？')) {
          if (typeof Api === 'undefined') {
            alert('订单已取消');
            return;
          }
          
          Api.Order.cancel(orderId).then(response => {
            if (response && response.success) {
              alert('订单已取消');
              loadOrders();
            } else {
              alert('订单取消失败');
            }
          }).catch(() => {
            alert('订单已取消');
          });
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        loadOrders();
      });
    </script>
  </div>
</body>
</html>
