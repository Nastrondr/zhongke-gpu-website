<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>订单记录</title>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('app_theme_mode');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme === 'system' ? (systemDark ? 'dark' : 'light') : (savedTheme || 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root,
    html[data-theme="dark"] {
      --bg-primary: #0A0F1C;
      --bg-secondary: #10182A;
      --card-bg: #111C31;
      --card-hover: #16233D;
      --border-card: rgba(96, 165, 250, 0.28);
      --border-color: rgba(148, 163, 184, 0.16);
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-tertiary: #94A3B8;
      --brand-primary: #60A5FA;
      --brand-secondary: #3B82F6;
      --accent-blue: #60A5FA;
      --success: #22C55E;
      --warning: #F59E0B;
      --error: #EF4444;
      --pending: #F59E0B;
      --icon-bg: rgba(96, 165, 250, 0.1);
      --border-radius-sm: 10px;
      --border-radius: 16px;
      --shadow-card: none;
      --shadow-card-hover: none;
    }

    html[data-theme="light"] {
      --bg-primary: #F6FAFF;
      --bg-secondary: #F5F9FF;
      --card-bg: #FFFFFF;
      --card-hover: #FAFCFF;
      --border-card: #E8F0FF;
      --border-color: rgba(140, 170, 220, 0.12);
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-tertiary: #6B7A90;
      --brand-primary: #4A8DFF;
      --brand-secondary: #6BA8FF;
      --accent-blue: #2563EB;
      --success: #1BD4A0;
      --warning: #D97706;
      --error: #DC2626;
      --pending: #D97706;
      --icon-bg: #EAF3FF;
      --border-radius-sm: 10px;
      --border-radius: 16px;
      --shadow-card: 0 8px 24px rgba(67, 97, 168, 0.08);
      --shadow-card-hover: 0 12px 32px rgba(67, 97, 168, 0.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
    }

    .app-container {
      max-width: 430px;
      min-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .nav-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 8px;
      color: var(--accent-blue);
      transition: all 0.2s;
      text-decoration: none;
    }

    .back-btn:hover {
      background: rgba(96, 165, 250, 0.1);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
    }

    .nav-title h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .tabs-container {
      display: flex;
      background: var(--bg-secondary);
      padding: 0 16px;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-item {
      flex: 1;
      padding: 14px 0;
      text-align: center;
      font-size: 14px;
      color: var(--text-tertiary);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .tab-item.active {
      color: var(--accent-blue);
      font-weight: 600;
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 2px;
      background: var(--accent-blue);
      border-radius: 2px;
    }

    .page-content {
      padding: 16px;
    }

    .order-card {
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      border-radius: var(--border-radius);
      margin-bottom: 16px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: all 0.2s;
    }

    .order-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-1px);
      box-shadow: var(--shadow-card-hover);
    }

    .order-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .order-id {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .order-status {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .order-status.pending {
      background: rgba(245, 158, 11, 0.15);
      color: var(--pending);
    }

    .order-status.success {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }

    .order-status.cancelled {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-tertiary);
    }

    .order-body {
      padding: 14px 16px;
    }

    .order-item {
      display: flex;
      gap: 12px;
    }

    .order-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--icon-bg);
      flex-shrink: 0;
    }

    .order-info {
      flex: 1;
      min-width: 0;
    }

    .order-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .order-desc {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }

    .order-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .order-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
    }

    .order-total {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .order-total-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .order-total-price .symbol {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-tertiary);
    }

    .order-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      padding: 6px 14px;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--bg-secondary);
    }

    .action-btn.primary {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .action-btn.primary:hover {
      opacity: 0.9;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--text-tertiary);
      text-align: center;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .filter-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .filter-select {
      padding: 6px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
    }

    .filter-select:focus {
      outline: none;
      border-color: var(--accent-blue);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="nav-header">
      <div class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="nav-title">
        <h1>订单记录</h1>
      </div>
    </div>

    <div class="tabs-container">
      <div class="tab-item active" onclick="switchTab('all')">全部</div>
      <div class="tab-item" onclick="switchTab('pending')">待支付</div>
      <div class="tab-item" onclick="switchTab('success')">已完成</div>
    </div>

    <div class="page-content">
      <div class="filter-bar">
        <span class="filter-label">共 <strong style="color: var(--accent-blue)" id="orderCount">5</strong> 条订单</span>
        <select class="filter-select" id="orderFilter" onchange="handleFilterChange()">
          <option value="priority">待支付优先</option>
          <option value="latest">最近下单</option>
          <option value="amount-desc">金额从高到低</option>
          <option value="amount-asc">金额从低到高</option>
        </select>
      </div>

      <div id="orderList">
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div class="empty-title">暂无订单</div>
        <div class="empty-desc">当前筛选条件下没有找到订单</div>
      </div>
    </div>

    <script>
      const orders = [
        {
          id: 'ORD20241215001',
          status: 'success',
          statusText: '已完成',
          title: 'NVIDIA RTX 4090 设备租用',
          desc: '设备型号：NVIDIA RTX 4090 | 租用时长：7天',
          time: '2024-12-15 14:30:22',
          quantity: '1台',
          price: 2800,
          icon: 'device'
        },
        {
          id: 'ORD20241218002',
          status: 'pending',
          statusText: '待支付',
          title: '智能问答技能包',
          desc: '技能版本：v2.0 | 有效期：永久',
          time: '2024-12-18 09:15:45',
          quantity: '1个',
          price: 1200,
          icon: 'skill'
        },
        {
          id: 'ORD20241220003',
          status: 'success',
          statusText: '已完成',
          title: '数据分析技能包',
          desc: '技能版本：v1.5 | 有效期：1年',
          time: '2024-12-20 16:45:30',
          quantity: '1个',
          price: 1200,
          icon: 'skill'
        },
        {
          id: 'ORD20241222004',
          status: 'cancelled',
          statusText: '已取消',
          title: 'AMD RX 7900 XTX 设备租用',
          desc: '设备型号：AMD RX 7900 XTX | 租用时长：30天',
          time: '2024-12-22 11:20:15',
          quantity: '2台',
          price: 12000,
          icon: 'device'
        },
        {
          id: 'ORD20241225005',
          status: 'success',
          statusText: '已完成',
          title: '图像识别技能包',
          desc: '技能版本：v3.0 | 有效期：永久',
          time: '2024-12-25 10:00:00',
          quantity: '1个',
          price: 2500,
          icon: 'skill'
        }
      ];

      let currentStatusFilter = 'all';

      function getIconHtml(iconType) {
        if (iconType === 'device') {
          return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>';
        }
        return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>';
      }

      function renderOrders(filteredOrders) {
        const orderList = document.getElementById('orderList');
        const emptyState = document.getElementById('emptyState');
        const orderCount = document.getElementById('orderCount');

        orderCount.textContent = filteredOrders.length;

        if (filteredOrders.length === 0) {
          orderList.style.display = 'none';
          emptyState.style.display = 'flex';
          return;
        }

        orderList.style.display = 'block';
        emptyState.style.display = 'none';

        orderList.innerHTML = filteredOrders.map(order => `
          <div class="order-card" onclick="showOrderDetail('${order.id}')">
            <div class="order-header">
              <span class="order-id">订单号：${order.id}</span>
              <span class="order-status ${order.status}">${order.statusText}</span>
            </div>
            <div class="order-body">
              <div class="order-item">
                <div class="order-icon">${getIconHtml(order.icon)}</div>
                <div class="order-info">
                  <div class="order-title">${order.title}</div>
                  <div class="order-desc">${order.desc}</div>
                  <div class="order-meta">
                    <span>${order.time}</span>
                    <span>数量：${order.quantity}</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="order-footer">
              <span class="order-total">订单总额</span>
              ${order.status === 'pending' ? `
                <div class="order-actions">
                  <button class="action-btn" onclick="cancelOrder('${order.id}'); event.stopPropagation();">取消订单</button>
                  <button class="action-btn primary" onclick="payOrder('${order.id}'); event.stopPropagation();">立即支付</button>
                </div>
              ` : `
                <span class="order-total-price"><span class="symbol">¥</span>${order.price.toLocaleString()}</span>
              `}
            </div>
          </div>
        `).join('');
      }

      function sortOrders(orders, sortBy) {
        const sorted = [...orders];
        switch (sortBy) {
          case 'priority':
            return sorted.sort((a, b) => {
              const priority = { pending: 0, success: 1, cancelled: 2 };
              return priority[a.status] - priority[b.status];
            });
          case 'latest':
            return sorted.sort((a, b) => new Date(b.time) - new Date(a.time));
          case 'amount-desc':
            return sorted.sort((a, b) => b.price - a.price);
          case 'amount-asc':
            return sorted.sort((a, b) => a.price - b.price);
          default:
            return sorted;
        }
      }

      function filterOrders(status) {
        currentStatusFilter = status;
        const filterSelect = document.getElementById('orderFilter');
        
        let filtered = orders;
        if (status !== 'all') {
          filtered = orders.filter(order => order.status === status);
        }

        const sortBy = filterSelect.value;
        const sorted = sortOrders(filtered, sortBy);
        renderOrders(sorted);
      }

      function switchTab(status) {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        filterOrders(status);
      }

      function handleFilterChange() {
        filterOrders(currentStatusFilter);
      }

      function goBack() {
        window.history.back();
      }

      function showOrderDetail(orderId) {
        alert('订单详情：' + orderId);
      }

      function payOrder(orderId) {
        alert('正在跳转到支付页面...');
      }

      function cancelOrder(orderId) {
        if (confirm('确定要取消此订单吗？')) {
          alert('订单已取消');
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        filterOrders('all');
      });
    </script>
  </div>
</body>
</html>
