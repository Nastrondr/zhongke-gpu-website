<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>账户设置 - 萤火虫</title>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('app_theme_mode');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme === 'system' ? (systemDark ? 'dark' : 'light') : (savedTheme || 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <script src="js/utils/storage.js"></script>
  <script src="js/services/themeService.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #09090B;
      --bg-secondary: #18181B;
      --bg-card: #27272A;
      --bg-card-soft: #3F3F46;
      --border-card: rgba(255, 255, 255, 0.08);
      --text-primary: #FAFAFA;
      --text-secondary: #A1A1AA;
      --text-tertiary: #71717A;
      --brand-primary: #4A8DFF;
      --brand-secondary: #6D5DFB;
      --brand-gradient: linear-gradient(135deg, #4F7CFF 0%, #6D5DFB 45%, #9B5CFF 100%);
      --success: #10B981;
      --error: #EF4444;
      --border-radius: 16px;
    }

    html[data-theme="light"] {
      --bg-primary: #F6FAFF;
      --bg-secondary: #F5F9FF;
      --bg-card: #FFFFFF;
      --bg-card-soft: #F0F5FF;
      --border-card: #E8F0FF;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-tertiary: #6B7A90;
      --success: #1BD4A0;
      --error: #DC2626;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(20px);
      z-index: 100;
    }

    html[data-theme="light"] .header { background: rgba(255, 255, 255, 0.9); }

    .header-back {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: var(--bg-card);
      cursor: pointer;
    }

    .header-back svg { width: 18px; height: 18px; color: var(--text-primary); }

    .header-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
    }

    .content { padding: 72px 16px 20px; }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .setting-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--border-radius);
      overflow: hidden;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--border-card);
      cursor: pointer;
    }

    .setting-item:last-child { border-bottom: none; }

    .setting-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .setting-icon {
      width: 36px;
      height: 36px;
      background: var(--bg-card-soft);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .setting-icon svg { width: 18px; height: 18px; color: var(--brand-primary); }

    .setting-label { font-size: 15px; color: var(--text-primary); }

    .setting-value {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    .setting-arrow { color: var(--text-tertiary); }

    .setting-divider { height: 1px; background: var(--border-card); margin: 8px 0; }

    /* 头像上传 */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--border-radius);
      margin-bottom: 24px;
    }

    .avatar-preview {
      width: 80px;
      height: 80px;
      background: var(--brand-gradient);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 600;
      color: white;
      margin-bottom: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-edit {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.6);
      padding: 4px;
      font-size: 10px;
      color: white;
      text-align: center;
    }

    .avatar-tip { font-size: 12px; color: var(--text-tertiary); }

    /* 表单 */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
    }

    .form-input:focus { border-color: var(--brand-primary); }

    /* 按钮 */
    .btn-danger {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--error);
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      color: var(--error);
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--brand-gradient);
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      cursor: pointer;
    }

    /* 模态框 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      width: calc(100% - 48px);
      max-width: 340px;
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: 24px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }

    .modal-btn.cancel {
      background: var(--bg-card-soft);
      border: none;
      color: var(--text-primary);
    }

    .modal-btn.confirm {
      background: var(--error);
      border: none;
      color: white;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 20px;
      font-size: 13px;
      color: white;
      z-index: 1000;
      display: none;
    }

    .toast.show { display: block; }

    @media (min-width: 390px) {
      .content { max-width: 390px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <!-- 头部 -->
  <div class="header">
    <div class="header-back" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </div>
    <div class="header-title">账户设置</div>
    <div style="width: 36px;"></div>
  </div>

  <div class="content">
    <!-- 头像区域 -->
    <div class="avatar-section">
      <div class="avatar-preview" id="avatarPreview" onclick="changeAvatar()">
        <span id="avatarInitial">U</span>
        <div class="avatar-edit">更换</div>
      </div>
      <div class="avatar-tip">点击更换头像</div>
    </div>
    <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">

    <!-- 基本信息 -->
    <div class="section">
      <div class="section-title">基本信息</div>
      <div class="setting-card">
        <div class="setting-item" onclick="editUsername()">
          <div class="setting-item-left">
            <div class="setting-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <div>
              <div class="setting-label">用户名</div>
              <div class="setting-value" id="usernameDisplay">User_9527</div>
            </div>
          </div>
          <div class="setting-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 账号绑定 -->
    <div class="section">
      <div class="section-title">账号绑定</div>
      <div class="setting-card">
        <div class="setting-item" onclick="bindPhone()">
          <div class="setting-item-left">
            <div class="setting-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                <path d="M12 18h.01"/>
              </svg>
            </div>
            <div>
              <div class="setting-label">手机号</div>
              <div class="setting-value" id="phoneDisplay">未绑定</div>
            </div>
          </div>
          <div class="setting-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </div>
        </div>
        <div class="setting-item" onclick="bindEmail()">
          <div class="setting-item-left">
            <div class="setting-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <path d="M22 6l-10 7L2 6"/>
              </svg>
            </div>
            <div>
              <div class="setting-label">邮箱</div>
              <div class="setting-value" id="emailDisplay">未绑定</div>
            </div>
          </div>
          <div class="setting-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 账号操作 -->
    <div class="section">
      <div class="section-title">账号操作</div>
      <button class="btn-danger" onclick="showLogoutModal()">注销账号</button>
    </div>
  </div>

  <!-- 注销确认弹窗 -->
  <div class="modal-overlay" id="logoutModal">
    <div class="modal-content">
      <div class="modal-title">确定要注销账号吗？</div>
      <div style="font-size: 13px; color: var(--text-secondary); text-align: center; line-height: 1.6;">
        注销后将清除所有数据且无法恢复，请三思而后行。
      </div>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeLogoutModal()">取消</button>
        <button class="modal-btn confirm" onclick="confirmLogout()">确认注销</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">已保存</div>

  <script>
    // 初始化
    function init() {
      loadUserInfo();
    }

    // 加载用户信息
    function loadUserInfo() {
      const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
      const username = userInfo.username || 'User_9527';
      const phone = userInfo.phone || '';
      const email = userInfo.email || '';

      document.getElementById('usernameDisplay').textContent = username;
      document.getElementById('avatarInitial').textContent = username.charAt(0).toUpperCase();
      document.getElementById('phoneDisplay').textContent = phone ? maskPhone(phone) : '未绑定';
      document.getElementById('emailDisplay').textContent = email ? maskEmail(email) : '未绑定';
    }

    // 手机号脱敏
    function maskPhone(phone) {
      return phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
    }

    // 邮箱脱敏
    function maskEmail(email) {
      return email.replace(/(.{2}).*(@.*)/, '$1***$2');
    }

    // 修改用户名
    function editUsername() {
      const username = prompt('请输入新用户名:', document.getElementById('usernameDisplay').textContent);
      if (username && username.trim()) {
        saveUserInfo({ username: username.trim() });
        showToast('用户名已更新');
      }
    }

    // 绑定手机号
    function bindPhone() {
      const phone = prompt('请输入手机号:');
      if (phone && /^1\d{10}$/.test(phone)) {
        saveUserInfo({ phone });
        showToast('手机号已绑定');
      } else if (phone) {
        showToast('手机号格式不正确');
      }
    }

    // 绑定邮箱
    function bindEmail() {
      const email = prompt('请输入邮箱:');
      if (email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        saveUserInfo({ email });
        showToast('邮箱已绑定');
      } else if (email) {
        showToast('邮箱格式不正确');
      }
    }

    // 上传头像
    function changeAvatar() {
      document.getElementById('avatarInput').click();
    }

    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const avatarPreview = document.getElementById('avatarPreview');
        avatarPreview.innerHTML = `<img src="${e.target.result}" alt="头像">`;
        saveUserInfo({ avatar: e.target.result });
        showToast('头像已更新');
      };
      reader.readAsDataURL(file);
    }

    // 保存用户信息
    function saveUserInfo(info) {
      const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
      Object.assign(userInfo, info);
      localStorage.setItem('userInfo', JSON.stringify(userInfo));
      loadUserInfo();
    }

    // 显示注销弹窗
    function showLogoutModal() {
      document.getElementById('logoutModal').classList.add('active');
    }

    // 关闭注销弹窗
    function closeLogoutModal() {
      document.getElementById('logoutModal').classList.remove('active');
    }

    // 确认注销
    function confirmLogout() {
      localStorage.clear();
      sessionStorage.clear();
      showToast('账号已注销');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);
    }

    // 返回
    function goBack() {
      window.history.back();
    }

    // Toast
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
